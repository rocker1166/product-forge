id: invoice
name: Invoice
module: billing
kinds: [document, money]
why: the legal tax paper a small Indian firm sends to be paid; frozen at issue, numbered without gaps, and settled through payments, credit notes and write-off
links:
  - {to: customer, on_delete: "the issued copy keeps its own snapshot of name, address, GSTIN and state; a customer with any invoice cannot be deleted, only archived"}
  - {to: payment, on_delete: "a payment is never deleted; a reversed one stays listed and the invoice balance is recalculated"}
  - {to: credit_note, on_delete: "issued credit notes stay linked for good; draft credit notes must be deleted or issued before the invoice can be voided"}
  - {to: einvoice, on_delete: "the record stays for good; voiding an invoice before any IRN closes the record as cancelled"}
  - {to: share_link, on_delete: "the link stays and shows a plain cancelled page after a void; it is never deleted"}
  - {to: message, on_delete: "sent emails stay in the outbox log; nothing about the invoice can erase them"}
  - {to: quote, on_delete: "deleting a draft made from a quote frees the quote again; an issued invoice keeps the quote number as its reference"}
  - {to: recurring_plan, on_delete: "ending or stopping a plan leaves every invoice it made untouched"}
abilities:
  create: {d: now, how: "A draft starts from the bottom plus button, from a quote, from a recurring plan, from a copy, or from a voided invoice that it replaces; the customer picker opens first and terms, place of supply and tax treatment fill from the customer.", e: ["wide:B202", "wide:W040", "wide:B191"]}
  edit: {d: now, how: "A draft allows every field, to owner, accountant and staff; if two people edit at once the second save is refused and shows the newer version. After issue only due date, customer note, internal note, expected payment date and the reminders switch change, each logged with old and new values; the Edit button explains the lock and offers credit note or void and re-create. The In dispute flag and its note can also be set after issue by an owner; the due date moves later only by an owner (R37).", e: ["judge"]}
  draft: {d: now, how: "A draft needs only a customer and may hold zero lines; it autosaves every 30 seconds and on leaving, shows Saved 10:42, has no number, and a lost connection shows Not saved, retrying.", e: ["wide:W013", "wide:D346"]}
  search: {d: now, how: "Number, customer name or customer GSTIN, any case, substring from 2 characters; spaces and slashes inside a number are ignored so INV2627 00001 finds INV/26-27/00001.", e: ["wide:W080", "wide:D306"]}
  filter: {d: now, how: "Document state, payment state, e-invoice state, customer, issue date range, currency and opened by the customer, all combined with AND. Overdue is a ready view, because it is a label made from payment state and due date.", e: ["wide:W079", "wide:D128", "wide:D162", "wide:B006"]}
  sort: {d: now, how: "Number, issue date, due date, total and balance due, both ways; default newest issue date first with drafts at the top; the choice stays in the page address.", e: ["wide:W082", "wide:W078"]}
  bulk: {d: now, how: "Send email, send reminder, download PDFs and issue reviewed drafts, each row on its own; failed rows are listed with the reason and a Retry. Issuing many takes numbers in issue date order and stops at the free-plan limit with the rest listed.", e: [judge, "walk:F017"]}
  import: {d: now, how: "Opening unpaid invoices only: one row per invoice, kept as migrated and read-only, original number and date kept, counters untouched; a bad row stops only itself.", e: ["judge"]}
  export: {d: now, how: "Selected rows, the current filter or a date range; one row per invoice or one per line; CSV with a byte-order mark, a zip of CSV files per month, Tally XML or a zip of PDFs; large sets come by email.", e: ["wide:W083", "wide:W084", "wide:D228"]}
  delete: {d: now, how: "Drafts only, by owner or accountant after a confirm; one history row keeps draft id, who, customer and total. An issued or void invoice is never deleted.", e: ["wide:W039"]}
  archive: {d: no, how: "An invoice is never put away: settled and void ones leave the default view through filters and views, and the books stay whole for at least 8 years.", e: ["wide:B069", "wide:A068"]}
  restore: {d: no, how: "Nothing is archived and only drafts are deleted; a deleted draft does not come back.", e: ["judge"]}
  duplicate: {d: now, how: "Makes a new draft with the same customer, lines, place of supply and notes; today's date, no number, no payments, no IRN and no attachments.", e: ["wide:W040"]}
  version: {d: now, how: "Issue stores PDF version 1 with its hash and template version; the IRN and QR, a due-date edit or a note edit each store a newer version; every earlier file stays readable and listed.", e: ["judge"]}
  reverse: {d: now, how: "Three separate acts: void for an invoice with nothing counted against it, a credit note for any issued invoice, and reversal of a payment. The invoice itself is never edited back.", e: ["wide:W038", "wide:W060", "wide:W059"]}
  print_pdf: {d: now, how: "A4 GST layout with every legal field, stored once at issue with its hash and served unchanged; the file name is the number with slashes turned into hyphens; Indian-style words and scripts print correctly. A viewer's copy is made without the bank block and UPI ID, as the firm profile says viewers do not see them.", e: ["wide:W042", "wide:B042", "walk:X036"]}
  share_link: {d: now, how: "A read-only page for this invoice only, random token of at least 128 bits, 30 days by default (owner picks 1 to 365), revocable, no login; shows first and last view; UPI button and QR only while balance is above 0; says cancelled after a void. The page also offers Something is wrong (wrong GSTIN, wrong amount, not ours, already paid, with a text box), I deduct TDS on the claim, a receipt download after a confirmed payment, a request for a fresh link on an expired page, 'Replaced by' on a cancelled one, and the last four digits of the account with the date the bank details last changed.", e: ["wide:W044", "wide:D341", "wide:D073", "walk:F028", "walk:F031", "walk:F032", "walk:F033", "walk:F037", "walk:F006"]}
  preview: {d: now, how: "A dry run of the final PDF and email with totals and number format, without taking a number, on phone and desktop width.", e: ["wide:B011"]}
  approve: {d: room, how: "No approval step: staff draft, accountant or owner issues, and that is the second pair of eyes. A slot stays between draft and issued for an approval limit later.", e: ["judge"]}
  tag: {d: no, how: "No free tags in wave 1; PO number, PO date and project reference are the fixed labels.", e: [judge]}
  custom_fields: {d: no, how: "A firm cannot add fields of its own; the fixed header holds PO number, PO date, project reference and service period.", e: [judge]}
  remind: {d: now, how: "1, 7 and 15 days after due date, at most 3 per invoice, between 9 am and 7 pm IST, one message per customer listing all overdue invoices; 3 days before due is optional and off by default; stops at paid, credited or void; paused by an expected payment date or the per-invoice off switch.", e: ["wide:W088", "wide:B052"]}
  schedule: {d: room, how: "Repeating is done by a recurring plan that only creates review drafts; sending later is not in wave 1.", e: ["wide:D052", "wide:W047"]}
  api: {d: later, how: "Read and write by API waits for the integration build, together with webhooks.", e: ["judge"]}
  webhook: {d: later, how: "Events for issued, paid and voided come with the API, not in wave 1.", e: ["judge"]}
answers:
  freeze: {a: "At issue the customer snapshot, firm block with bank and logo, lines, amounts, issue date, place of supply and exchange rate are frozen. Only due date, customer note up to 500, internal note up to 1,000, expected payment date and the reminders switch change after, each logged.", e: ["wide:W033", "wide:W034"]}
  number: {a: "Given only at issue from a counter per firm, prefix and financial year, shaped PREFIX/YY-YY/NNNNN and at most 16 characters, starting at 00001 each 1 April, with no gaps: a failed issue or a deleted draft takes none, and a voided number stays used. The database refuses a second row with the same firm, type, series, year and sequence. The IST date is read once inside the issue step, so 00:30 on 1 April takes the new year.", e: ["wide:W017", "wide:W018", "wide:W019", "wide:W020"]}
  fix: {a: "Nothing is edited. Void is owner-only, needs no counted payment, credit note or live IRN, and a reason of 5 to 200 characters. A credit note works on any issued invoice up to 30 November after the year end, or the annual return date if the firm filed earlier. Void and re-create copies a voided invoice into a new draft linked both ways. Once an IRN is older than 24 hours only the credit note remains.", e: ["wide:W038", "wide:W060", "wide:W065", "wide:B191"]}
  money: {a: "Whole paise in integers. Line taxable is quantity times rate less discount, half-up to paise; tax per line half-up (CGST and SGST each tax over 200 inside the state, IGST over 100 across states); the total is rounded to the rupee with a labelled round-off line. Foreign invoices keep amount, currency, rate to 4 decimals with its source and the INR of every line. The server recomputes at issue and refuses a total that differs by one paisa.", e: ["wide:W026", "wide:W028", "wide:W030", "wide:A121", "wide:A062"]}
  paid: {a: "Its own track beside the document: unpaid, part_paid, paid, credited, written_off. Balance due is the total less non-reversed payments and TDS, credit notes, applied customer credit and write-off, never below 0. Overdue is only a label for an issued or part-paid invoice whose due date is before today in IST.", e: ["wide:W035", "wide:W036", "wide:W037"]}
  late: {a: "Reminders at 1, 7 and 15 days after the due date, with balance due and pay link, in the 9 am to 7 pm IST window; due dates count calendar days and never shift for Sundays. A promise-to-pay date pauses reminders until the day after it. Nothing changes state when an invoice is late.", e: ["wide:W088", "wide:W036", "wide:B023"]}
  law: {a: "Firm name, address and GSTIN, number, date, recipient, SAC, taxable value, rate, tax, place of supply, reverse-charge line and amount in words; titled Tax Invoice; Bill of Supply or Invoice-cum-Bill of Supply only for a registered composition or exempt supplier; an unregistered firm issues a plain Invoice with no tax lines. A firm over Rs 5 crore also gets an IRN and signed QR; cancelling an IRN is allowed only within 24 hours; issuing more than 30 days after the service date warns.", e: ["wide:A071", "wide:A074", "wide:A076", "wide:A104", "wide:A106", "wide:A072"]}
  send: {a: "Issued means numbered and frozen. Sending is a separate act, repeatable: email through the outbox with extra To, Cc and Bcc for that send, WhatsApp click-to-chat with the share link, copy link or download PDF. A draft cannot be sent.", e: ["wide:W086", "wide:B010", "wide:W044"]}
  amount: {a: "Payment above 0 with 2 decimals; payment plus TDS cannot exceed the balance due, and a larger one is refused in plain words because advance receipts are wave 2. A foreign payment records amount received, INR credited, bank charge and exchange gain or loss.", e: ["wide:W049", "wide:D160"]}
  settles: {a: "Through allocation rows: one payment may be split across several invoices of the same customer and the sum never passes the payment. An invoice takes payments only while issued or part-paid; draft, paid, credited and void invoices refuse them.", e: ["wide:W048", "wide:W057"]}
  undo: {a: "The owner reverses a payment with a reason of 5 to 200 characters; whoever saved it may undo within 10 seconds with no reason. The row stays listed as reversed, balance and state are recalculated and the receipt number is never reused.", e: ["wide:W059"]}
  fail: {a: "No gateway in wave 1, so no failed charge. A UPI I-have-paid claim waits as Pending check and counts for nothing until confirmed; a bounced cheque reverses the payment; a payment that would overpay is refused.", e: ["wide:W049", "wide:W059"]}
  fee: {a: "No gateway fee. Only a foreign bank charge and an exchange gain or loss are stored, beside the dollar value the invoice settles at.", e: ["wide:D160"]}
  dispute: {a: "No chargebacks without a gateway. A customer dispute ends as an agreed credit note or an owner write-off with a reason; the invoice and its number stay. While an owner has marked it In dispute, or after the customer pressed Something is wrong, reminders stop and a chip shows (R40).", e: [judge, "walk:F029", "walk:F028"]}
  proof: {a: "A receipt REC/YY-YY/NNNNN from its own gapless counter, marked not a tax document; the invoice itself is the tax proof.", e: ["wide:W056", "wide:W057"]}
  match: {a: "By hand: the person picks the invoice and amount. A UPI QR cannot prove money arrived, so only the owner or accountant records it; bank statement lines are not read in wave 1.", e: ["judge"]}
tracks:
  document:
    states: [{id: draft, start: true}, {id: issued}, {id: void, end: true}]
    moves:
      - {do: issue, from: draft, to: issued, who: [owner, accountant, staff], guard: "customer chosen, 1 to 50 lines, total above 0, issue date not future and not before the latest issued date in the series, outside any locked period, firm has the details its tax scheme needs, plan limit not reached; rates in force on the date are shown and clicked through if they changed. issue date in the same financial year as today in IST (R37); staff only when the switch 'May issue' is on for that person and the total is within the cap set for them", effect: "number taken, fields frozen, PDF rendered and stored with hash, e-invoice track started when the firm and customer need it, plan counter goes up by 1. an invoice issued as the corrected copy of a voided one does not count against the plan limit; the history names the issuer", reverse: "void, or credit_note", notify: none, e: ["wide:W019", "wide:W021", "wide:W015", "wide:A113", "wide:A164", "walk:F020", "walk:X018", "walk:F007"]}
      - {do: void, from: issued, to: void, who: [owner], guard: "no counted payment, no active credit note, no live IRN, no draft credit note, reason of 5 to 200 characters. no applied customer credit and no write-off (an owner unapplies or undoes it first), no pending I-have-paid claim; when the due date of the return month has passed the screen warns that the return may be filed and offers a credit note instead, and the reason must say it was not filed", effect: "number stays used, PDF gets a CANCELLED mark and date, share link says cancelled, counts as cancelled in the documents-issued summary, plan counter goes down only for a void within 24 hours with nothing sent or viewed (R42), the cancelled page shows 'Replaced by' the corrected copy and the send step is pre-filled with both numbers (J09)", reverse: "none: copy it into a new draft with void and re-create", notify: [invoice_voided_alert], e: ["wide:W038", "wide:B191", "wide:B069", "walk:X003", "walk:X016", "walk:X043", "walk:F006", "walk:X054"]}
      - {do: request_void, from: issued, to: issued, who: [accountant], guard: "reason of 5 to 200 characters; an owner exists in the firm", effect: "every owner is mailed one tap to open the invoice and Void it; nothing changes until an owner does", reverse: "none: withdraw by asking the owner not to void", notify: [void_requested], e: ["walk:F014"]}
  payment:
    states: [{id: unpaid, start: true}, {id: part_paid}, {id: paid}, {id: credited}, {id: written_off}]
    moves:
      - {do: record_part, from: [unpaid, part_paid], to: part_paid, who: [owner, accountant], guard: "invoice is issued; amount plus TDS is below the balance due", effect: "allocation row added, balance lowered", reverse: "reverse_to_part or reverse_to_unpaid", notify: none, e: ["wide:W048", "wide:W054"]}
      - {do: record_full, from: [unpaid, part_paid], to: paid, who: [owner, accountant], guard: "amount plus TDS equals the balance due to the paisa", effect: "balance reaches 0, reminders stop, payment share of the share page shows paid", reverse: "reverse_to_unpaid or reverse_to_part", notify: none, e: ["wide:W054", "wide:W053"]}
      - {do: reverse_to_part, from: paid, to: part_paid, who: [owner], guard: "reason of 5 to 200 characters, or by the saver within 10 seconds; other money or credit still counts; a credit already spent elsewhere is not needed back", effect: "balance rises, receipt number stays used, reminders restart from the due date", reverse: "record the payment again", notify: [payment_reversed_alert], e: ["wide:W059", "wide:A172"]}
      - {do: reverse_to_unpaid, from: [paid, part_paid], to: unpaid, who: [owner], guard: "reason of 5 to 200 characters, or by the saver within 10 seconds; nothing else counts against the invoice", effect: "balance returns to the full total less credits, receipt number stays used", reverse: "record the payment again", notify: [payment_reversed_alert], e: ["wide:W059", "wide:A172"]}
      - {do: credit_lowers, from: [unpaid, part_paid], to: part_paid, who: [system], guard: "a credit note issues or customer credit is applied and the balance stays above 0", effect: "balance lowered by the credit", reverse: "credit_returns_part", notify: none, e: ["wide:W066", "wide:W067"]}
      - {do: credit_clears, from: unpaid, to: credited, who: [system], guard: "credit alone brings the balance to 0 and no money or TDS counts", effect: "balance 0 and the state says Credited, not Paid; reminders stop", reverse: "credit_returns_all", notify: none, e: ["judge"]}
      - {do: credit_settles, from: part_paid, to: paid, who: [system], guard: "credit brings the balance to 0 and some money or TDS counts", effect: "balance 0, reminders stop", reverse: "credit_returns_part", notify: none, e: ["wide:W066", "wide:W035"]}
      - {do: credit_returns_part, from: [paid, credited], to: part_paid, who: [system], guard: "a credit note is voided or applied credit is returned and the balance goes above 0 but below the total", effect: "balance rises by the credit returned", reverse: "credit_lowers", notify: none, e: ["wide:W069", "wide:A172"]}
      - {do: credit_returns_all, from: credited, to: unpaid, who: [system], guard: "the last credit counting against it is voided or returned and no money counts", effect: "balance back to the full total", reverse: "credit_clears", notify: none, e: ["judge"]}
      - {do: write_off, from: [unpaid, part_paid], to: written_off, who: [owner, accountant], guard: "amount above 0 and at most the balance due, reason of 5 to 200 characters. an accountant only up to Rs 10.00 per invoice and only with the reason rounding; an owner without that limit", effect: "balance goes to 0 as write-off, not as a payment; tax already charged stays in the registers; reminders stop", reverse: "undo_write_off_part or undo_write_off_unpaid", notify: none, e: ["wide:A035", "wide:A190", "walk:F015", "walk:X040"]}
      - {do: undo_write_off_part, from: written_off, to: part_paid, who: [owner], guard: "reason of 5 to 200 characters; some money or credit still counts", effect: "written-off amount returns to the balance", reverse: "write_off", notify: none, e: [judge]}
      - {do: undo_write_off_unpaid, from: written_off, to: unpaid, who: [owner], guard: "reason of 5 to 200 characters; nothing else counts", effect: "written-off amount returns to the balance", reverse: "write_off", notify: none, e: [judge]}
  tax:
    states: [{id: not_needed, start: true}, {id: due}, {id: pending}, {id: generated}, {id: failed}, {id: cancelled, end: true}]
    moves:
      - {do: require_einvoice, from: not_needed, to: due, who: [system], guard: "firm is flagged for e-invoice and the customer has a GSTIN, or the supply is export, SEZ or deemed export; never for a B2C invoice", effect: "e-invoice record created, due-by date set, warning counted down", reverse: "none: the flag follows the firm and the customer at the moment of issue", notify: none, e: ["wide:A104", "wide:A108"]}
      - {do: start_portal_call, from: [due, failed], to: pending, who: [owner, accountant, system], guard: "invoice is issued and the 30-day window for turnover of Rs 10 crore or more is not over", effect: "queued portal call, never inline", reverse: "none: wait for the answer, the record explains it", notify: none, e: ["wide:W045", "wide:A239", "wide:A105"]}
      - {do: portal_ok, from: pending, to: generated, who: [system], guard: "portal returned an IRN, or says the IRN already exists", effect: "IRN, ack number, ack date and signed QR stored, PDF version added. a send that was waiting for the IRN goes out by itself and the owner is told (R12)", reverse: "cancel_irn", notify: none, e: ["wide:A109", "wide:A154", "walk:F041"]}
      - {do: portal_refused, from: pending, to: failed, who: [system], guard: "portal refused or 5 automatic tries ended", effect: "error code and message show on the invoice; the invoice stays issued and payable", reverse: "start_portal_call", notify: [einvoice_failed_alert], e: ["wide:W046", "wide:A215"]}
      - {do: cancel_irn, from: generated, to: cancelled, who: [owner, accountant], guard: "within 24 hours of generation, no counted payment or credit note, coded reason chosen", effect: "cancelled IRN is never reused; the invoice can then only be voided", reverse: "none: a cancelled IRN cannot come back, make a new invoice", notify: none, e: ["wide:A106", "wide:A147", "walk:X020"]}
      - {do: close_tax, from: [due, failed], to: cancelled, who: [system], guard: "invoice voided before any IRN was generated", effect: "record closed, due-by warning stops", reverse: "none: the invoice is void", notify: none, e: ["wide:A147", "wide:W038"]}
fields:
  - {id: number, type: text, required: true, limit: 16, edit: "nobody; given at issue", auto: true}
  - {id: in_dispute, type: choice, required: true, default: no, edit: "owner after issue; owner, accountant and staff while draft", msg: "Choose yes or no; a dispute needs a note."}
  - {id: dispute_note, type: text, required: false, limit: 300, edit: "owner", msg: "The dispute note is longer than 300 letters."}
  - {id: customer, type: link, required: true, edit: "while draft", msg: "Choose a customer."}
  - {id: supply_type, type: choice, required: true, default: "from the customer: B2B, B2C, export under LUT, export with IGST, SEZ with or without payment, reverse charge", edit: "while draft", msg: "Choose the type of supply; it decides the tax."}
  - {id: place_of_supply, type: choice, required: true, default: "the customer's billing state", edit: "while draft; locked at issue", msg: "Choose the place of supply; it decides CGST and SGST or IGST."}
  - {id: issued_at, type: date, required: true, default: today, edit: "while draft; refreshed to today at Issue unless the person typed a date", msg: "The date cannot be in the future or before the last issued invoice."}
  - {id: due_at, type: date, required: true, default: "issue date plus the customer's terms, else the firm's 15 days", edit: "while draft, then owner or accountant any time, never before the issue date", msg: "Due date is before the issue date."}
  - {id: service_from, type: date, required: false, edit: "while draft", msg: "Service period start is after its end."}
  - {id: service_to, type: date, required: false, edit: "while draft", msg: "Service period end is before its start."}
  - {id: currency, type: choice, required: true, default: "the customer's currency", edit: "while draft; the customer's currency cannot change once an invoice exists", msg: "Choose a currency from the firm's list."}
  - {id: exchange_rate, type: number, required: false, limit: 9999999, default: "last rate used for that currency", edit: "while draft; locked at issue", msg: "Enter a rate above 0 with up to 4 decimals; no rate is saved for this date."}
  - {id: lines, type: list, required: true, limit: 50, edit: "while draft", msg: "Add 1 to 50 lines, each with a description, a quantity above 0 and a rate."}
  - {id: round_off, type: money, required: true, limit: 1, edit: "nobody", auto: true}
  - {id: total, type: money, required: true, limit: 9999999999, edit: "nobody", auto: true}
  - {id: po_number, type: text, required: false, limit: 40, edit: "while draft", msg: "The PO number is longer than 40 letters."}
  - {id: po_date, type: date, required: false, edit: "while draft", msg: "Enter a real date."}
  - {id: project_ref, type: text, required: false, limit: 60, edit: "while draft", msg: "The project reference is longer than 60 letters."}
  - {id: customer_note, type: long_text, required: false, limit: 500, default: "the firm's default note", edit: "any time, owner and accountant; each change logged and saved as a new PDF version", msg: "The note is longer than 500 letters."}
  - {id: internal_note, type: long_text, required: false, limit: 1000, edit: "any time, owner and accountant, never printed or shared", msg: "The note is longer than 1,000 letters."}
  - {id: expected_payment_on, type: date, required: false, edit: "owner and accountant, any time while unpaid", msg: "The promise date cannot be before today."}
  - {id: reminders_off, type: flag, required: false, default: false, edit: "owner and accountant, any time", auto: true}
  - {id: needs_review, type: flag, required: false, default: false, edit: "set by recurring and import; cleared by owner or accountant before issue", auto: true}
  - {id: source, type: choice, required: true, default: manual, edit: "nobody", auto: true}
  - {id: replaces, type: link, required: false, edit: "set when copied from a voided invoice; nobody after", auto: true}
fields_e: ["wide:K041", "wide:A054", "wide:A055", "wide:W016"]
list:
  search: [number, customer, gstin]
  filters: [document, payment, tax, customer, issued_at, currency, opened]
  sorts: [number, issued_at, due_at, total, balance]
  default_sort: -issued_at
  columns: [number, issued_at, due_at, customer, currency, total, balance, document, payment, tax]
  views: [All, Drafts, Needs review, Unpaid, Overdue, This month, Opened, Tax pending, Tax failed, Voided]
  bulk: [send, remind, download, issue]
  bulk_fail: "Each row goes alone; the rest go through and failed rows are listed with the reason and a Retry."
  export: {rows: [selected, filtered, date range], what: [invoices, lines, sales register], formats: [CSV, month zip, Tally XML, PDF zip], big: "Over 5,000 rows runs as an export job and the link comes by email and lives 7 days; one request holds at most 50,000 rows, so a larger range is asked to be split by financial year."}
  import: {match: "firm, series and original number; a clash is rejected row by row", errors: "a CSV of row, field and reason; re-uploading skips rows already added", limit: "5 MB and 5,000 rows"}
  page: 25
  e: ["wide:W078", "wide:W079", "wide:W082", "wide:W083"]
volume: {y1: 500000, y3: 6000000}
queries:
  - {id: newest, filters: [document, payment], sort: [-issued_at], index: [tenant, document, payment, issued_at], p95: 150 ms}
  - {id: overdue, filters: [payment], sort: [due_at], index: [tenant, payment, due_at], p95: 150 ms}
  - {id: one_customer, filters: [customer], sort: [-issued_at], index: [tenant, customer, issued_at], p95: 100 ms}
  - {id: tax_state, filters: [tax], sort: [-issued_at], index: [tenant, tax, issued_at], p95: 100 ms}
  - {id: by_currency, filters: [currency], sort: [-issued_at], index: [tenant, currency, issued_at], p95: 150 ms}
  - {id: opened, filters: [opened], sort: [-issued_at], index: [tenant, opened, issued_at], p95: 150 ms}
  - {id: by_number, filters: [], sort: [number], index: [tenant, number], p95: 100 ms}
  - {id: by_total, filters: [], sort: [total], index: [tenant, total], p95: 200 ms}
  - {id: by_balance, filters: [], sort: [balance], index: [tenant, balance], p95: 200 ms}
