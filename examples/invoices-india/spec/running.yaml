settings: [{"group":"Firm profile (owner only)","items":["legal name, address, state and GSTIN with the date it started","PAN and Udyam number","tax scheme: regular, composition or unregistered","declared turnover per financial year and the e-invoice flag","filing mode: monthly or quarterly","bank block, SWIFT and UPI ID; a change needs the password and second step, takes effect after 24 hours and any owner can cancel it from the mail (R62)","period lock date: owner or accountant sets it, up to the last day of the previous month; only an owner moves it back, with a reason"]},{"group":"Numbering and dates","items":["invoice prefix and credit note prefix of 1 to 4 characters","next number per series, upward only before the first document of the year, locked afterwards","payment terms days, default 15, 0 to 90","share link expiry days, default 30, 1 to 365"]},{"group":"Documents and branding","items":["logo (PNG or JPG, 1 MB), one brand colour, footer note, signature image","terms text per document type, 1000 characters","default customer note, 500 characters","template style: plain, standard or modern","email templates for invoice, receipt, credit note, quote and three reminders"]},{"group":"Reminders and messages","items":["reminder days 1, 7 and 15 after due date, switchable per customer and per invoice","before-due reminder 3 days ahead, off by default","owner confirms the first reminder batch: off by default; the 18:00 eve mail lists tomorrow's reminders with Paid already on each row","reminder tones gentle, firm and final, text editable once","send window 09:00 to 19:00 IST","receipt email after payment, on by default"]},{"group":"Money and tax switches","items":["currencies enabled for invoices: USD, EUR, GBP, AED, SGD, AUD","LUT per financial year with number, validity and ARN","default tax treatment and default TDS section per customer","reverse-charge category list","cash receipt limit Rs 2,00,000 (product-owned, shown not edited)","UPI limit note above Rs 1,00,000 balance"]},{"group":"People and security","items":["require TOTP for all users","invite roles: owner, accountant, staff, viewer (fixed, not editable)","session idle limit 8 hours (fixed)","grant support access for 24 hours or 7 days","sign out of other sessions and see where you are signed in, each person for their own login","list of every support view made under a grant, with time and what was opened: the same list support sees, shown to the owner"]},{"group":"Plan and billing (owner only)","items":["plan, billing details, cancel at period end and Undo cancel","free limit 10 issued invoices a month, 2 users, 1 accountant seat","paid plan Rs 499 a month or Rs 4,999 a year including GST, 5 users, 1 accountant seat","trial length 14 days (owner decision)"]},{"group":"Product-owned tables (firms never edit)","items":["GST rate and SAC table with effective dates","TDS table: section 393(1) serial, old alias, rate, threshold, effective dates","GST state codes","e-invoice thresholds Rs 5 crore and Rs 10 crore, B2C large limit Rs 1 lakh, unregistered detail limit Rs 50,000","filing calendar dates","credit note date limit rule and the 01-11-2026 discount change","registration limits Rs 20 lakh and Rs 10 lakh states"]},{"group":"Clocks and jobs (fixed)","items":["recurring drafts daily 06:00 IST","reminders daily 09:00 IST","month-end pack on the 1st at 08:00 IST","financial year counters created on first use, pre-warmed 1 April 00:05 IST","payment undo window 10 seconds, duplicate guard 24 hours, draft autosave 30 seconds","nightly encrypted backup with a copy in a second Indian region and a weekly restore test"]}]
support: ["find a firm by name, GSTIN or owner email","build the full-firm export of a sealed firm for a former owner after the proofs of R65","refund a plan charge made in the last 30 days against a ticket","see its history log and failed jobs","resend or retry an email and an e-invoice call","view as the firm only inside an owner grant, with a banner and a log","restore one firm from backup","run the integrity check for one firm","end all sessions of a user"]
events: ["signed_up","first_invoice_issued","first_invoice_sent","first_payment_recorded","first_export_used","i_have_paid_claim","reminder_sent","plan_limit_hit","trial_ended","plan_paid","tax_check_failed","einvoice_failed","accountant_invited","support_access_granted"]
seed: "two sample firms in different states (one regular with GSTIN, one unregistered), 300 customers, 6,000 invoices in every state across two financial years, credit notes, TDS payments, a foreign-currency export under LUT, a cheque bounce, a recurring plan and every outbox state"
rollout: "five design-partner firms from the interviews, then invite only with a waiting list, then open signup; each step holds until a month-end pack has been checked by a chartered accountant"
rollback: "one command returns web and API to the last release and the database is only ever migrated forward, so every release stays compatible with the one before; tried once before the first firm"
stack: "Go and Postgres backend, React and Vite web app, hosted in the Mumbai region with a backup copy in a second Indian region"
product: {"home": "now: four tiles, unpaid total, overdue total, paid this month and drafts, each opening its list; a staff user sees no revenue figure and the page never fetches one", "views": "no: lists with filters, sort and a quick Opened filter kept in the page address are enough; board, calendar and timeline wait", "quick_entry": "now: a bottom plus button, a customer picker with the 5 latest customers, a name-only customer, item autocomplete and a live PDF preview that takes no number", "modes": "no: one fixed way of working; dates cannot be in the future and Issue locks the paper; approval before issue is later", "favourites": "now: recent customers first in the picker and recently used items first, no pinned favourites", "search_all": "now: every list searches from 2 characters and a number typed with or without spaces and slashes finds its document; one box over everything is later", "keyboard": "later: Ctrl or Cmd Enter submits a form now, the command menu waits", "planning": "no: this product does not forecast or budget", "time_off": "no: due dates and reminders count calendar days and no holiday calendar changes any date", "teams": "no: firms of one to twenty people use roles, not teams", "custom_roles": "no: four fixed roles; the Users page lists what each may do and the 403 tests come from that table", "signin_company": "later: company sign-in waits; email and password with optional TOTP and sign-out of other sessions are now", "preferences": "now: dates DD-MM-YYYY, Indian grouping and IST are fixed for everyone; no per-person format yet. Every screen, PDF, CSV export and email shows dates and times in IST in that format; stored times are UTC and converted only on display", "branding": "now: logo, one brand colour, footer, terms and signature on the paper and emails; own domain later", "templates": "now: three style families, separate invoice, credit note, receipt and email templates with merge tags, edits apply to new documents only", "automation": "later: fixed reminders and recurring drafts are the only rules; when-this-then-that waits", "recurring": "now: monthly, quarterly or yearly review drafts once per period, failures tell the owner, never issued by the job", "reports": "now: aging summary and detail, payments received, customer balance, sales register, GST summaries and TDS by customer, each with a date preset and customer filter", "scheduled_report": "now: only the month-end accountant pack on the 1st at 08:00 IST; other schedules later", "public_page": "now: a share page per document with pay button, QR, PDF, view times and a plain paid or cancelled notice, no login", "portal": "no: no customer logins; the share link and I have paid claim are the whole customer side", "phone_app": "now: an installable web app, lists and drafts readable offline, Issue needs the network", "desktop": "no: nothing to add on a desktop in wave 1", "external_sync": "later: Tally and Zoho Books sync; wave 1 exports Tally XML", "ai": "no: no AI features in wave 1", "languages": "now: English screens; names and notes in any Indian script print correctly; Hindi screens later", "many_companies": "room: one login can belong to many firms (a CA); one plan covers one business", "audit_all": "now: append-only history, one log filterable and searchable by record number, kept at least 8 years, every export logged", "trash_all": "no: drafts are hard-deleted with a history row, issued papers are never deleted, customers and items are archived", "import_all": "now: customers, items and opening invoices from CSV or XLSX with a sample file and a dry run; rival files go through CSV", "demo": "later: a sample firm the owner can try and remove", "help": "now: a help page, a support email and a status page, linked from every error", "plans": "now: Free with 10 issued invoices a month, a 14-day trial that ends on Free, one paid plan; whatever happens every paper stays readable and exportable", "self_host": "no: hosted by us only", "admin_settings": "now: every switch is in the grouped settings list of this map and owner-only ones are marked", "privacy": "now: owner can export everything, correct or erase a contact's data on request, delete the firm after 30 days; tax papers stay by law", "list_address": "now: a list keeps its filters, search, sort and page in the address, so Reload restores them and Back from a record returns to the same list, filters and page", "form_keys": "now: Enter in a single-line field submits the form once; Enter in a multi-line field adds a line; Ctrl or Cmd Enter submits from anywhere", "form_errors": "now: a failed submit moves focus to the first wrong field and scrolls it into view; every message is tied to its field and read out by screen readers; a failed save keeps everything typed, says what failed beside the form, and the same button tries again", "layout_overflow": "now: long names, GSTINs, emails and unbroken words wrap or truncate with a tooltip in every cell, card and header; no page scrolls sideways at 375 px or on desktop; tested with a 200-character name", "confirmations": "now: every create, edit, delete and state change shows a short confirmation that names what happened, such as 'Invoice INV-2026-27/0042 issued'; it reads out to screen readers and fades after a few seconds", "number_input": "now: amount fields accept Indian grouping (1,00,000.50), a rupee sign and plain digits, and show the amount back in Indian grouping; the number keypad opens on a phone; pasted text is cleaned before it is checked", "list_controls": "now: a sortable column header shows its direction and flips it on the second click; each active filter is a chip with its own remove button, and Clear all removes them together", "accessibility": "now: every action works by keyboard in reading order with a visible focus outline; every input has a real label, icon buttons have names, tables use header cells, and a status is a word as well as a colour", "page_titles": "now: each page sets its own title naming the page or record, such as 'Invoice INV-2026-27/0042 - Sharma Traders'", "print_pages": "now: printing an invoice, credit note, quote or report hides the menu, header, buttons and banners and prints only the document", "page_states": "now: a loading page shows grey blocks in its final shape; an error shows what failed and Retry; an empty list says the first thing to do; any action that takes over one second shows a working state on its button, and a long job shows progress", "list_scale": "now: lists page by 50 over 10,000 rows with the count reading 10,000+; every filter and sort is backed by an index that starts with the firm; checked in the seed of 6,000 invoices and the load test (P16)", "undo": "now: where a change can be reversed, a short Undo shows with the confirmation (payment 10 seconds, archive, void within its rules); where it cannot, the confirm dialog names the consequence in words before the button", "server_validation": "now: every input is checked on the Go server for type, length, range and allowed values with the same limits as the rules; the page checks only help; an over-limit value gets 422 with the field and the limit", "output_safety": "now: every value is escaped where it is shown, in PDFs, emails and CSV (a cell starting with = + - or @ is prefixed so a spreadsheet never runs it); notes and terms accept plain text only; no user text is run as code", "file_uploads": "now: a logo, signature or import file is checked by its content and not its name (PNG or JPG for images, CSV or XLSX for imports), limited to 1 MB for images and 5 MB for imports, stored outside the web root under a random name and served only through a signed link that checks the firm", "secrets_and_logs": "now: keys, provider tokens and passwords come from the environment or a secret manager, never from code, logs, error pages or the browser; logs never hold passwords, tokens, full card or account numbers, or message text", "request_safety": "now: every state-changing request carries a per-session token checked on the server and the cookie is SameSite; every response sets a content security policy, frame protection, no-sniff and strict transport", "rate_limits": "now: sign-in, sign-up, password reset, share pages and exports have rate limits per address and per account; an answer of 429 says in words when to try again and sets Retry-After", "supply_chain": "now: dependencies are pinned by lock file and a known-vulnerability check runs in CI; a build with a high-severity finding does not ship", "backups": "now: nightly backups are encrypted and copied to a second Indian region; a restore into a clean database runs weekly and its time is recorded; a deleted firm is erased from live data after the cooling period and from backups when they age out, as the privacy page states"}
day_one: {"D1":"firm_id on every table including child rows and in the first place of every index, with composite keys so a child cannot point at another firm's parent","D2":"UUID v7 keys; the human document number is a separate column from the counter","D3":"tax rows per line (head, rate, amount) and per document, not single columns, so a new tax head is a row","D4":"price and rate are copied onto the line; the catalogue is a convenience; a price list can come later","D5":"document, payment, e-invoice and delivery states run as separate tracks side by side","D6":"issued invoices and credit notes are never edited; only due date and notes change, and a credit note or void reverses","D7":"one counter row per firm, GSTIN, document type, prefix and financial year, locked in the issue transaction, no gaps allowed","D8":"an owner is a membership of a person today; the column can later point at a team or bot","D9":"no saved views in wave 1; filters live in the page address per person","D10":"rates, thresholds, plan limits, number format and reminder days live in dated settings tables, not in code or schema","D11":"one jsonb custom fields column on customer and invoice; customers do not make their own objects","D12":"idempotency key on every write, outbox table, UTC time, integer paise, API version header"}
production: {"P1":"ASVS level 1 minimum, level 2 for sign-in, sharing and money; requirement ids tracked as v5.0.0-x.y.z","P2":"all secrets and provider tokens come from the environment or a secret manager and are encrypted at rest; none in the repository","P3":"an automated test takes one firm's token and requests 100 ids of other firms by record, list, search, export and share link and expects 404","P4":"every input is validated on the Go server with the same limits as the rules; the web checks are courtesy only","P5":"every write endpoint is called by every role in a test generated from the role table, expecting 403 where forbidden","P6":"managed Postgres in the Mumbai region with daily backups and point-in-time recovery; encrypted copy in a second Indian region","P7":"a restore into a clean database runs weekly and checks invoice and payment counts; one firm can be restored alone; the time is recorded","P8":"drafts are hard-deleted with a history row; issued papers never deleted; archived customers restorable; no general trash","P9":"migrations only move forward, run first on a copy of production data, and never need downtime","P10":"one command rolls back the web and API to the last release, tried once before the first firm","P11":"rolling deploy of two or more instances with no manual database step","P12":"support and admin tasks are scripts in the repository, reviewed and logged, never typed by hand in production","P13":"alerts on error rate, latency, failed jobs and counter gaps go to a named owner on call","P14":"an hourly synthetic check signs in to a test firm, issues an invoice, records a payment and opens the share link","P15":"structured logs go to a searchable store for 30 days with no full GSTIN, phone, account number or amount beside a name","P16":"load test at 5 times the expected peak of end of month, mainly the issue transaction and the register build","P17":"rate limits of 100 requests a minute per user and 1,000 per firm, sign-in lockout, and limits on share-link opens and email sends","P18":"documented caps: import 5 MB and 5,000 rows, CSV export 50,000 rows, logo 1 MB, 50 lines per invoice, 99,99,99,999 rupees a document","P19":"at least two app instances and a managed database with a standby in another zone","P20":"every job takes a lock and a unique key per unit of work, so running it twice sends or creates nothing twice","P21":"failed jobs are listed for support and owner with the reason and a Retry; the retry limit is 5","P22":"exports over 5,000 rows run as background jobs and email a 7-day link","P23":"owner exports the whole firm as one zip of CSVs and PDFs, open in every plan state","P24":"firm deletion is owner-only with the typed name, a 30-day cooling period and a plain list of what stays 8 years by law","P25":"a written personal data inventory with the retention of each field, shown in the privacy page","P26":"DPDP duties start in stages over about 18 months from 14 November 2025; the firm is the fiduciary and we are the processor; a lawyer reviews terms before launch; our reply time target is 30 days against the 90 allowed","P27":"support finds a firm, sees its history and failed jobs and can view as the firm only inside an owner grant, every view logged","P28":"a status page and a support email, both linked from the app footer","P29":"cost per firm (storage, email, PDF, e-invoice calls) is measured monthly with a budget alert","P30":"free plan is 10 issued invoices a month, 2 users, email sends capped per day, and one signup per verified email"}
flow: {"A1":"yes","A2":"no: no saved views in wave 1; filters, sort and search live in the page address and an All list is always the default","A3":"yes","A4":"yes","A5":"no: no bulk selection in wave 1; every money action is one record at a time","A6":"yes","A7":"yes","A8":"yes","A9":"no: errors show on submit with the summary, never on blur or while typing, so no real-time rule is needed","A10":"yes","A11":"yes","A12":"no: invoice drafts autosave every 30 seconds and on leaving with Saved hh:mm, as the list says; other forms use Save and Discard","A13":"yes","A14":"yes","A15":"yes","A16":"yes","A17":"yes","A18":"yes","A22":"yes","A23":"yes","A25":"yes"}
