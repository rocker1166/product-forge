# Six roles. owner and support differ from the rest in kind: owner holds the firm, support is our staff under an owner's grant.
# scope: own = rows the person made or their own login; team = only the documents that role may open; all = the whole firm.
# A move's who wins over this table for abilities that are also move names.
# Staff payment create is an I-got-paid claim only (Pending check); staff and viewer see a payment's date, mode and amount on the invoice, never TDS or reference; a viewer's invoice copy has no bank block; support export_job.create is for sealed firms only (R65).
roles:
  - {id: "owner", name: "Owner", home: "home", joins: "signs up with email and a password; sign-up makes the firm and its first owner, or an owner hands the role over and the new owner accepts", leaves: "hands ownership over first; the last owner cannot leave or close the login; the firm, its books and drafts stay"}
  - {id: "accountant", name: "Accountant", home: "home", joins: "by an owner's invite that expires in 7 days; a CA who already has a login accepts it and the firm shows in the switcher; or the CA creates the firm for a client and presses Hand to owner when it is set up", leaves: "loses access on the next request when an owner removes them or they leave; their entries keep their name and their drafts stay with the firm"}
  - {id: "staff", name: "Staff", home: "home", joins: "by an owner's invite that expires in 7 days; the invite page defaults to this role and says so", leaves: "loses access on the next request when an owner removes them or they leave; drafts they made stay with the firm under their name"}
  - {id: "viewer", name: "Viewer", home: "home", joins: "by an owner's invite that expires in 7 days, for a partner or advisor who only reads", leaves: "loses access on the next request when an owner removes them or they leave; they own no work, so nothing moves"}
  - {id: "client", name: "Client", home: "shared_document", joins: "opens a link from an invoice, credit note or quote mail or a WhatsApp tap and sees one document with no sign-in; or opens the client page link the firm sent for that customer and signs in with the password the firm set or sent, one password per customer, and sees that customer's documents, receipts and statement", leaves: "the document link expires, is revoked, or the sender voids the document; a later send renews an expired link on an unpaid document. The client page ends after 2 idle hours, when the firm switches it off, or when five wrong passwords lock it for 30 minutes"}
  - {id: "support", name: "Support", home: "support_console", joins: "only when an owner grants access for 24 hours, 3 days or 7 days with a ticket number; read only, banner shown to the firm, every view logged with a Support label", leaves: "the grant ends by its date or the owner ends it; sessions on that firm close at once"}
