# Every message the moves notify, plus timed and event mail. to: roles, or the person named (starter, invitee, person, target, sender, recorder, user, pack_address).
# channels: whatsapp_link is click-to-chat only; the system never sends on WhatsApp. mute: can the receiver switch it off.
- {id: "credit_note_large_alert", on: "credit_note.issue", to: ["owner"], channels: ["email", "app"], subject: "Large credit note issued", text: "Credit note {number} for {total} was issued against invoice {invoice} for {customer} by {actor}. It is above {limit}, or the credits on that invoice or for that customer today or this month together pass it, so every owner is told.", mute: false, e: ["wide:C139", "walk:X013"]}
- {id: "einvoice_failed_alert", on: "einvoice.portal_refused", to: ["owner", "accountant"], channels: ["email", "app"], subject: "E-invoice not accepted", text: "The tax portal refused the e-invoice for {number}: {reason}. The document stays issued and payable. Fix the cause and press Retry; the 30-day window runs to {last_day}.", mute: false, e: ["judge"]}
- {id: "export_ready", on: "export_job.finish", to: ["starter"], channels: ["email", "app"], subject: "Your export is ready", text: "Your export {name} is ready with {rows} rows. The link asks you to sign in and works for 7 days, then the file is deleted.", mute: true, e: ["judge"]}
- {id: "export_failed", on: "export_job.fail", to: ["starter"], channels: ["email", "app"], subject: "Your export did not run", text: "Your export {name} could not be built: {reason}. No partial file was kept. Try again, or narrow the dates if the list is very large.", mute: false, e: ["judge"]}
- {id: "export_full_firm", on: "export_job.announce_full_export", to: ["owner"], channels: ["email", "app"], subject: "Full export of your firm started", text: "{actor} started a full export of {firm} on {date}. It holds all the books. If you did not expect this, remove their access in Users now.", mute: false, e: ["judge"]}
- {id: "firm_read_only", on: "firm.go_read_only", to: ["owner"], channels: ["email", "app"], subject: "Your firm is read only", text: "{firm} is read only from {date}. You can still view, record payments, void, issue credit notes, share links and export. New invoices and edits wait until the plan is paid.", mute: false, e: ["judge"]}
- {id: "firm_closing_started", on: "firm.start_closing", to: ["owner"], channels: ["email", "app"], subject: "Closing of your firm started", text: "{actor} started closing {firm} on {date}. It stays read only for 30 days and you can cancel until {final_date}. A final export link is in your mail.", mute: false, e: ["wide:A256"]}
- {id: "firm_closing_cancelled", on: "firm.cancel_closing", to: ["owner"], channels: ["email", "app"], subject: "Closing of your firm cancelled", text: "{actor} cancelled the closing of {firm}. The firm is active again{plan_note}.", mute: false, e: ["judge"]}
- {id: "firm_deleted_final", on: "firm.finish_closing", to: ["owner"], channels: ["email"], subject: "Your firm is closed", text: "{firm} is closed. Personal data we do not need by law was removed. The books stay sealed for at least 8 years and a last export link is here: {link}", mute: false, e: ["wide:A256", "wide:A068"]}
- {id: "import_failed", on: "import_job.fail", to: ["starter"], channels: ["email", "app"], subject: "Your import did not run", text: "Import {name} did not run: {reason}. Nothing was added. Fix the file and upload it again; the 5 MB and 5,000 row limits apply.", mute: false, e: ["wide:A142"]}
- {id: "import_done", on: "import_job.finish", to: ["starter", "owner"], channels: ["email", "app"], subject: "Your import finished", text: "Import {name} finished: {added} added, {skipped} skipped, {errors} with errors. The rows with errors are listed on the run page.", mute: true, e: ["wide:A142"]}
- {id: "invite_sent", on: "invite.resend", to: ["invitee"], channels: ["email"], subject: "You are invited to a firm", text: "{inviter} invited you to join {firm} as {role}. Open the link within 7 days; it works only for this email. Any earlier invite from them is replaced.", mute: false, e: ["wide:W073"]}
- {id: "invite_accepted", on: "invite.accept", to: ["owner"], channels: ["email", "app"], subject: "Invite accepted", text: "{person} accepted the invite to {firm} as {role}. The firm now shows in their switcher.", mute: true, e: ["judge"]}
- {id: "invite_expired_owner", on: "invite.expire", to: ["owner"], channels: ["email", "app"], subject: "An invite expired", text: "The invite to {email} for {firm} ended after 7 days without an answer. Send a new one if they still need access.", mute: true, e: ["judge"]}
- {id: "role_changed", on: "membership.change_role", to: ["person","owner"], channels: ["email", "app"], subject: "Your role changed", text: "{actor} changed your role in {firm} from {old_role} to {new_role}. It applies from your next click; what you already did is not changed.", mute: false, e: ["wide:A006"]}
- {id: "access_removed", on: "membership.deactivate", to: ["person"], channels: ["email"], subject: "Your access was removed", text: "{actor} removed your access to {firm}. Your sessions there ended. The drafts you made stay with the firm.", mute: false, e: ["wide:A005"]}
- {id: "member_left", on: "membership.leave", to: ["owner"], channels: ["email", "app"], subject: "Someone left your firm", text: "{person} left {firm} on {date}. Their drafts stay with the firm and their entries keep their name.", mute: true, e: ["judge"]}
- {id: "access_returned", on: "membership.reactivate", to: ["person"], channels: ["email"], subject: "Your access is back", text: "{actor} gave you back your access to {firm} as {role}. Sign in to carry on.", mute: false, e: ["judge"]}
- {id: "owner_transfer_ask", on: "membership.offer_ownership", to: ["target"], channels: ["email"], subject: "You are asked to become owner", text: "{owner} asks you to become the owner of {firm}. Confirm with this link within 7 days. Nothing changes until you do, and then they become an accountant.", mute: false, e: ["wide:A004"]}
- {id: "owner_transfer_done", on: "membership.accept_ownership", to: ["owner", "accountant"], channels: ["email", "app"], subject: "Ownership moved", text: "{new_owner} is now owner of {firm} and {old_owner} is now an accountant. Both changes are in the firm history.", mute: false, e: ["wide:A004"]}
- {id: "owner_transfer_declined", on: "membership.decline_ownership", to: ["owner"], channels: ["email", "app"], subject: "Ownership offer declined", text: "{person} did not accept ownership of {firm}. You are still the owner and nothing changed.", mute: true, e: ["wide:A004"]}
- {id: "email_failed", on: "message.fail", to: ["sender"], channels: ["app"], subject: "A mail did not go out", text: "The {type} mail to {customer} did not go out: {reason}. Open the outbox, fix the address and press Retry.", mute: false, e: ["wide:A042"]}
- {id: "email_bounced", on: "message.bounce", to: ["owner", "accountant"], channels: ["email", "app"], subject: "An address bounced", text: "{address} bounced. We stopped mailing it for {firm}. A banner shows on {customer} and invoice {number}. Fix the address, or an owner can lift the block with a reason.", mute: false, e: ["wide:A042", "wide:A199"]}
- {id: "email_complaint", on: "message.complain", to: ["owner"], channels: ["email", "app"], subject: "A customer marked your mail as spam", text: "{address} marked a mail from {firm} as spam. All reminders to it stopped. Only an owner can lift this block, and must give a reason.", mute: false, e: ["wide:A200"]}
- {id: "lut_expiring", on: "lut.warn_expiry", to: ["owner", "accountant"], channels: ["email", "app"], subject: "Your LUT ends soon", text: "LUT {number} ends on {end_date}. Export invoices without tax are refused after that day. Add the next LUT before then.", mute: false, e: ["judge"]}
- {id: "lut_expired", on: "lut.expire", to: ["owner", "accountant"], channels: ["email", "app"], subject: "Your LUT has ended", text: "LUT {number} ended on {end_date}. Export invoices without tax are refused from today. Add the new LUT to carry on.", mute: false, e: ["judge"]}
- {id: "invoice_voided_alert", on: "invoice.void", to: ["owner", "accountant"], channels: ["email", "app"], subject: "An invoice was voided", text: "Invoice {number} for {customer} was voided by {actor}. The number stays used, the link now says cancelled and reminders stopped. The customer was not mailed.", mute: false, e: ["wide:A221"]}
- {id: "payment_reversed_alert", on: "invoice.reverse_to_part", to: ["accountant", "recorder"], channels: ["app"], subject: "A payment was reversed", text: "Payment {receipt} on invoice {number} was reversed by {actor}. {balance} is due again and reminders restart from the due date. Owners get the email; you get this note only.", mute: true, e: ["wide:W059"]}
- {id: "pay_receipt", on: "payment.record", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Receipt {receipt} from {firm}", text: "{firm} received {amount} on {date} for invoice {number}, receipt {receipt}. Tax deducted at source {tds}. Balance left {balance}.", mute: false, e: ["wide:A213"]}
- {id: "pay_claim_declined", on: "payment.decline_claim", to: ["client"], channels: ["email"], subject: "Payment not confirmed", text: "{firm} could not confirm your payment of {amount} for invoice {number}. {balance} is still due. If you paid, send the bank reference to {contact} or file the claim again.", mute: false, e: ["judge"]}
- {id: "pay_claim_lapsed", on: "payment.claim_lapses", to: ["owner", "accountant"], channels: ["app"], subject: "A payment claim lapsed", text: "The claim of {amount} on invoice {number} from {customer} was not checked in 14 days and lapsed. The customer sees it as not confirmed and may file again.", mute: true, e: ["judge"]}
- {id: "pay_reversed_owner", on: "payment.reverse", to: ["owner"], channels: ["email", "app"], subject: "A payment was reversed", text: "Payment {receipt} of {amount} on invoice {number} was {kind} by {actor}. Reason: {reason}. The balance is {balance} again.", mute: false, e: ["wide:W059"]}
- {id: "quote_email", on: "quote.send", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Quote {number} from {firm}", text: "{firm} sent you quote {number} for {total}, valid until {valid_until}. Open the link to read the lines and terms. To accept, reply to this mail.", mute: false, e: ["judge"]}
- {id: "rate_change_notice", on: "rate_master.publish", to: ["owner", "accountant"], channels: ["email", "app"], subject: "A tax rate is changing", text: "The rate for {code} changes from {old_rate} to {new_rate} on {effective_date}. Invoices dated on or after that day use the new rate. Check your saved services that use this code.", mute: false, e: ["judge"]}
- {id: "recurring_drafts_ready", on: "recurring_plan.run_due", to: ["owner", "accountant"], channels: ["email", "app"], subject: "Recurring drafts are ready", text: "{count} draft invoices from your recurring plans are ready to review for {period}. Nothing is sent until someone issues them.", mute: true, e: ["wide:A038"]}
- {id: "recurring_failed_alert", on: "recurring_plan.fail_run", to: ["owner", "accountant"], channels: ["email", "app"], subject: "A recurring plan did not run", text: "Plan {name} did not run for {period}: {reason}. No draft was made and the plan waits for you. Fix the cause, then press Create draft for period.", mute: false, e: ["judge"]}
- {id: "refund_reversed_owner", on: "refund.reverse_refund", to: ["owner"], channels: ["email", "app"], subject: "A refund was reversed", text: "Refund {number} of {amount} to {customer} was reversed by {actor}. Reason: {reason}. The amount is back in the customer's credit.", mute: false, e: ["judge"]}
- {id: "link_revoked", on: "share_link.revoke", to: ["owner"], channels: ["app"], subject: "A link was withdrawn", text: "{actor} withdrew the link for {document}. Anyone who opens it sees that the sender withdrew it, and nothing about the document.", mute: true, e: ["judge"]}
- {id: "sub_trial_over", on: "subscription.trial_ends", to: ["owner"], channels: ["email", "app"], subject: "Your trial has ended", text: "The trial of {firm} ended on {date}. You are on the Free plan with {limit} invoices a month and {used} are used. Nothing is blocked except new invoices above the limit.", mute: false, e: ["wide:D271"]}
- {id: "sub_plan_changed", on: "subscription.upgrade", to: ["owner"], channels: ["email", "app"], subject: "Your plan changed", text: "The plan of {firm} is {plan} from {date}. {detail}", mute: false, e: ["judge"]}
- {id: "sub_renewal_failed", on: "subscription.renewal_fails", to: ["owner"], channels: ["email", "app"], subject: "Your renewal payment failed", text: "The renewal for {firm} failed on {date}. Everything works as before and we try again for 3 days. Update the payment method to avoid a pause.", mute: false, e: ["judge"]}
- {id: "sub_grace", on: "subscription.grace_starts", to: ["owner"], channels: ["email", "app"], subject: "Payment is still due", text: "Payment for {firm} is still due. {days_left} days are left before the firm becomes read only. Full use continues until then.", mute: false, e: ["judge"]}
- {id: "sub_read_only", on: "subscription.go_read_only", to: ["owner"], channels: ["email", "app"], subject: "Your firm is read only", text: "{firm} is read only because {reason}. Viewing, sharing, payments and exports stay open. New invoices and edits return the moment the plan is paid.", mute: false, e: ["judge"]}
- {id: "sub_cancel_set", on: "subscription.cancel", to: ["owner"], channels: ["email", "app"], subject: "Your plan will end", text: "The plan of {firm} ends on {end_date}. You keep full use until then and exports stay open. You can undo this before that day.", mute: false, e: ["judge"]}
- {id: "account_closed", on: "user.close_account", to: ["user", "owner"], channels: ["email"], subject: "A login was closed", text: "The login {email} was closed on {date}. Its sessions ended and its memberships went inactive. Books and drafts stay with each firm. To open it again, write to support.", mute: false, e: ["judge"]}
- {id: "invoice_sent", on: "event:invoice.send", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Invoice {number} from {firm}", text: "{firm} sent you invoice {number}. Total {total}, balance {balance}, due {due}. Open the link to pay by UPI or to download the PDF.", mute: false, e: ["wide:A195"]}
- {id: "credit_note_sent", on: "event:credit_note.send", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Credit note {number} from {firm}", text: "{firm} issued credit note {number} against invoice {invoice} for {total}. Your balance on that invoice is now {balance}. Open the link to see it.", mute: false, e: ["judge"]}
- {id: "invoice_void_notice", on: "event:invoice.void_notice", to: ["client"], channels: ["email"], subject: "Invoice {number} was cancelled", text: "Invoice {number} from {firm} was cancelled and nothing is due for it. {replacement_line} Please ignore the PDF you received earlier, with both PDFs attached. The link shows it as cancelled and, when there is one, Replaced by {replacement} with a link.", mute: false, e: ["wide:A221", "walk:F006"]}
- {id: "pay_reversed_client", on: "event:payment.reversed_notice", to: ["client"], channels: ["email", "whatsapp_link"], subject: "A payment did not go through", text: "The payment of {amount} for invoice {number} did not go through, so {balance} is due again. Please ignore receipt {receipt}. The link shows the current balance.", mute: false, e: ["judge"]}
- {id: "statement_sent", on: "event:customer.statement_sent", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Your statement from {firm}", text: "{firm} sent your statement from {from} to {to}. Closing balance {closing}. Open the link to see the invoices, payments and credit notes.", mute: false, e: ["wide:A041"]}
- {id: "reminder_day_1", on: "time:due_at + 1 day", to: ["client"], channels: ["email", "whatsapp_link"], subject: "A note from {firm}", text: "A friendly note from {firm}: {balance} across {count} invoices is past its due date. Open the link to pay by UPI or to download the invoices.", mute: true, e: ["judge"]}
- {id: "reminder_day_7", on: "time:due_at + 7 days", to: ["client"], channels: ["email", "whatsapp_link"], subject: "A reminder from {firm}", text: "Invoices from {firm} are 7 days past due. Balance due {balance}. Please pay with the link, or tell us the date you will pay.", mute: true, e: ["wide:W088", "wide:A210", "wide:A209"]}
- {id: "reminder_day_15", on: "time:due_at + 15 days", to: ["client"], channels: ["email", "whatsapp_link"], subject: "A second reminder from {firm}", text: "Invoices from {firm} are 15 days past due. Balance due {balance}. Please pay today, or write to {contact} if something looks wrong.", mute: true, e: ["wide:W088", "wide:A210", "wide:A209"]}
- {id: "reminder_before_due", on: "time:due_at - 3 days", to: ["client"], channels: ["email"], subject: "Invoice {number} is due soon", text: "Invoice {number} from {firm} for {balance} is due on {due}. Open the link to pay by UPI or to download it. This reminder is off unless the firm switches it on.", mute: true, e: ["wide:A212"]}
- {id: "pay_claim_filed", on: "event:payment.claim_filed", to: ["owner", "accountant"], channels: ["email", "app"], subject: "A customer says they paid", text: "{customer} says they paid {amount} for invoice {number}. It shows as Pending check and is not counted. Look at your bank, then press Confirm or Decline.", mute: false, e: ["judge"]}
- {id: "pay_claim_nudge", on: "time:claim_filed + 3 days", to: ["owner", "accountant"], channels: ["app"], subject: "A claim is still unchecked", text: "The claim of {amount} on invoice {number} has waited {days} days. It lapses on day 14. Confirm or decline it. You get this on day 3 and day 7.", mute: true, e: ["judge"]}
- {id: "sub_trial_ending", on: "time:trial_end - 7 days", to: ["owner"], channels: ["email", "app"], subject: "Your trial ends soon", text: "The trial of {firm} ends in {days} days, on {date}. After that you move to the Free plan with {limit} invoices a month. Nothing is blocked. You get this at 7 days and at 1 day.", mute: false, e: ["wide:A215", "wide:D271"]}
- {id: "sub_limit_warning", on: "event:subscription.limit_reached", to: ["owner"], channels: ["email", "app"], subject: "You are near your invoice limit", text: "{firm} has used {percent} of the {limit} invoices on its plan this month. At 100 percent new invoices wait for next month or a plan change; payments and exports stay open.", mute: false, e: ["wide:A215"]}
- {id: "sub_predebit", on: "time:auto_debit - 24 hours", to: ["owner"], channels: ["email"], subject: "A charge is coming", text: "We will charge {amount} for {firm} on {date}. This notice comes at least a day before. Update the payment method now if it changed.", mute: false, e: ["wide:A222"]}
- {id: "filing_gstr1_due", on: "time:filing_gstr1", to: ["owner", "accountant"], channels: ["email", "app"], subject: "GSTR-1 is due", text: "GSTR-1 for {period} is due on {due_date}. The registers for the period are ready to export. Documents that block the return are listed with a link to fix each.", mute: true, e: ["judge"]}
- {id: "filing_gstr3b_due", on: "time:filing_gstr3b", to: ["owner", "accountant"], channels: ["email", "app"], subject: "GSTR-3B is due", text: "GSTR-3B for {period} is due on {due_date}. The outward summary for the period is ready to export and matches the register.", mute: true, e: ["judge"]}
- {id: "month_end_pack", on: "job:month_end_pack", to: ["owner", "pack_address"], channels: ["email"], subject: "Month-end pack for {firm}", text: "The pack for {month} is ready: sales register, credit notes, receipts, TDS and ageing. The link works for 7 days and every download is logged. If an invoice or payment was added after the pack was built, the pack shows Out of date with Build again, and the owner is asked whether to lock the month now before it goes out.", mute: true, e: ["wide:A230", "walk:F048"]}
- {id: "einvoice_window_near", on: "job:einvoice_window", to: ["owner", "accountant"], channels: ["email", "app"], subject: "Invoices near the e-invoice limit", text: "{count} invoices have no IRN and are close to the 30-day limit: {numbers}. Generate their e-invoices before {date}, or they cannot be reported.", mute: false, e: ["wide:A229", "mk-073"]}
- {id: "reminder_skipped", on: "event:message.skip", to: ["owner", "accountant"], channels: ["app"], subject: "A reminder was skipped", text: "No reminder went to {customer} for {balance} because there is no usable email address. Call them or add an address.", mute: true, e: ["wide:B222"]}
- {id: "firm_bank_changed", on: "event:firm.bank_changed", to: ["owner"], channels: ["email"], subject: "Bank details changed", text: "{actor} asked to change the bank or UPI details of {firm}: last four digits {old} to {new}. The change takes effect in 24 hours and any owner can cancel it with the link in this mail. If this was not you, change your password and check Users.", mute: false, e: ["wide:W070", "walk:F036", "walk:X030"]}
- {id: "firm_lock_date_changed", on: "event:firm.lock_date_changed", to: ["owner"], channels: ["email", "app"], subject: "Lock date changed", text: "{actor} moved the lock date of {firm} from {old} to {new}. Entries dated up to that day cannot change.", mute: false, e: ["judge"]}
- {id: "support_access_granted", on: "event:firm.support_granted", to: ["owner"], channels: ["email", "app"], subject: "Support can now read your firm", text: "{actor} gave support read-only access to {firm} until {until}, ticket {ticket}. Every view is logged. You can end it at any time.", mute: false, e: ["judge"]}
- {id: "support_access_ended", on: "time:support_access_until", to: ["owner"], channels: ["app"], subject: "Support access ended", text: "Support access to {firm} ended on {date}. Support can no longer see your books.", mute: true, e: ["judge"]}
- {id: "account_verify", on: "event:user.signup", to: ["user"], channels: ["email"], subject: "Confirm your email", text: "Confirm {email} with this link to finish signing up. Until you do, you cannot accept an invite. If you did not sign up, ignore this mail.", mute: false, e: ["judge"]}
- {id: "account_reset", on: "event:user.reset_requested", to: ["user"], channels: ["email"], subject: "Reset your password", text: "Use this link to set a new password for {email}. It works once and ends in {minutes} minutes. If you did not ask for it, ignore this mail.", mute: false, e: ["judge"]}
- {id: "void_requested", on: "invoice.request_void", to: ["owner"], channels: ["email", "app"], subject: "Void requested for {number}", text: "{actor} asks you to void invoice {number} for {customer}: {reason}. Nothing has changed. Open the invoice and press Void, or ignore this.", mute: false, e: ["walk:F014"]}
- {id: "client_reports_problem", on: "share_link.report_problem", to: ["owner", "accountant"], channels: ["email", "app"], subject: "{customer} says invoice {number} is wrong", text: "{customer} pressed Something is wrong on {number}: {reason}. {note} Reminders on this invoice are off for 7 days and it shows In dispute.", mute: false, e: ["walk:F028"]}
- {id: "sub_refund_notice", on: "subscription.refund_charge", to: ["owner"], channels: ["email"], subject: "We refunded a charge", text: "Support refunded {amount} charged on {date} for ticket {ticket}. It returns to your original payment method.", mute: false, e: ["walk:F050"]}
- {id: "invoice_needs_look", on: "event:invoice.staff_comment", to: ["owner"], channels: ["email", "app"], subject: "Needs a look: {number}", text: "{actor} wrote on issued invoice {number}: {comment}. It also shows on Home as Needs a look with the invoice link.", mute: false, e: ["walk:F021"]}
- {id: "reminder_eve_preview", on: "time:remind_eve 18:00", to: ["owner"], channels: ["email", "app"], subject: "Tomorrow these customers will be reminded", text: "Tomorrow at 09:00 these {count} customers will get a reminder: {list}. Tap Paid already on a row to drop it, or Go to let them all go.", mute: false, e: ["walk:F042"]}
- {id: "pay_digest_no_reference", on: "job:payments_without_reference", to: ["owner"], channels: ["email"], subject: "Payments with no bank reference", text: "Yesterday {count} payments were recorded or confirmed without a bank reference: {list}. Check them against your bank statement.", mute: true, e: ["walk:X014"]}
- {id: "owner_change_notice", on: "event:membership.owner_notice", to: ["owner"], channels: ["email", "app"], subject: "An owner will be removed in 24 hours", text: "{actor} asked to remove or demote {person}, who is an owner of {firm}. It happens in 24 hours unless any owner cancels with this link.", mute: false, e: ["walk:F038"]}
- {id: "closing_confirm_ask", on: "event:firm.closing_confirm", to: ["owner"], channels: ["email", "app"], subject: "Confirm closing {firm}", text: "{actor} asked to close {firm}. With more than one owner a second owner must confirm within 24 hours, or it is dropped.", mute: false, e: ["walk:F038"]}
- {id: "bank_change_applied", on: "event:firm.bank_change_applied", to: ["owner"], channels: ["email", "app"], subject: "Bank details are live", text: "The new bank or UPI details of {firm} are now live. {count} open invoices still show the old details; open the list and press Send again with new details.", mute: false, e: ["walk:F036"]}
- {id: "pack_out_of_date", on: "event:month_end.pack_stale", to: ["owner", "accountant"], channels: ["email", "app"], subject: "The {month} pack is out of date", text: "{count} invoice or payment was added after the pack was built. Press Build again, and decide whether to lock the month now.", mute: false, e: ["walk:F048"]}
- {id: "portal_link_sent", on: "customer.send_portal_link", to: ["client"], channels: ["email", "whatsapp_link"], subject: "Your page with {firm}", text: "{firm} made a page for you with your invoices, quotes, receipts and statement. Open {link} and sign in with the password {firm} gave you. The link works until {expiry}. The password is not in this message.", mute: false, e: ["wide:W202", "wide:B080"]}
- {id: "portal_password_sent", on: "customer.send_portal_link", to: ["client"], channels: ["email"], subject: "Your password for the page from {firm}", text: "Your password for the page {firm} made for you is {password}. Keep it private. You can ask for a new one on the sign-in page with Forgot password.", mute: false, e: ["wide:W202"]}
- {id: "portal_reset_link", on: "customer.reset_password", to: ["client"], channels: ["email"], subject: "Choose a new password", text: "Open {link} within 60 minutes to choose a new password for your page from {firm}. It works once. If you did not ask for this, ignore this mail; your password is unchanged.", mute: false, e: ["wide:W203"]}
- {id: "portal_locked_alert", on: "customer.lock_portal", to: ["owner", "accountant"], channels: ["email", "app"], subject: "A client page is locked", text: "The page for {customer} was locked after 5 wrong passwords and opens again at {time}. If it was not them, press Set password on the customer to unlock it with a new password.", mute: false, e: ["wide:W204"]}
- {id: "quote_answered_alert", on: "quote.accept", to: ["owner", "accountant"], channels: ["email", "app"], subject: "{customer} accepted quote {number}", text: "{customer} accepted quote {number} for {total}; {name} agreed at {time}. Convert it to an invoice from the quote.", mute: true, e: ["wide:D003"]}
- {id: "quote_declined_alert", on: "quote.decline", to: ["owner", "accountant"], channels: ["email", "app"], subject: "{customer} declined quote {number}", text: "{customer} declined quote {number} for {total} at {time}. {reason} The quote is closed; copy it into a new draft to offer again.", mute: true, e: ["wide:D003"]}
