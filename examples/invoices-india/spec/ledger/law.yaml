- {id: law-001, product: "India law", cap: "Rule 46 does not require amount in words. It requires the supplier's signature or digital signature (46(q)) and, for e-invoices, the IRN QR code (46(r)); words are a house choice (W042/C123 can keep them, but not as law).", object: "GST invoice particulars", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-002, product: "India law", cap: "Recipient name, address, delivery address and state name and code are required on a tax invoice to an unregistered person when the taxable value is Rs 50,000 or more (Rule 46(e)); below that only if the recipient asks (46(f)). The B2C large reporting limit is Rs 1 lakh inter-state since the Aug...", object: "unregistered recipient details", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-003, product: "India law", cap: "A bill of supply is issued by a registered person who supplies exempt goods or services or is a composition taxpayer (s.31(3)(c); Rule 49 requires the supplier's GSTIN). An unregistered supplier is outside s.31, charges no GST and issues no tax invoice and no bill of supply; a plain titled...", object: "unregistered supplier document", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section31_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-004, product: "India law", cap: "For a micro or small supplier, interest at three times the RBI bank rate with monthly rests is the statutory rate (MSMED Act s.16) and does not depend on the agreement. The payment period can be agreed up to 45 days from acceptance; with no agreement the appointed day is 15 days after acceptance....", object: "MSME delayed payment interest", url: "https://www.dcmsme.gov.in/publications/LegalFramework.pdf", seen: 2026-11-26, kind: law}
- {id: law-005, product: "India law", cap: "The DPDP Rules 2025 allow a Data Fiduciary up to 90 days to answer access, correction, updating and erasure requests. 30 days is a stricter product choice, not the legal number.", object: "DPDP request deadline", url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/nov/doc20251117695301.pdf", seen: 2026-11-26, kind: law}
- {id: law-006, product: "India law", cap: "Under CGST s.36 records are kept until 72 months after the due date of the annual return for that year, which is about 6 years 9 months after the financial year ends (GSTR-9 due date of 31 December is from memory), longer while a case is open. Companies Act s.128(5) says 8 years (not opened)....", object: "record retention", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter8/section36_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-007, product: "India law", cap: "Section 269ST is now section 186 of the Income-tax Act 2025 (in force 1 April 2026). The Rs 2,00,000 limit is unchanged and has three tests: aggregate from a person in a day, a single transaction, or one event or occasion. It binds the person receiving the money; allowed modes are account payee...", object: "cash receipt limit", url: "https://wm.incometaxindia.gov.in/w/section-186-41", seen: 2026-11-26, kind: law}
- {id: law-008, product: "India law", cap: "For payments from 1 April 2026 these are rows of section 393(1) of the Income-tax Act 2025: 194C is Sl.6(i), 194J is Sl.6(iii), 194H is Sl.1(ii) (2%, Rs 20,000), 194O is Sl.8(v) (0.1%), 194Q is Sl.8(ii) (purchase above Rs 50 lakh). Keep the old labels as aliases but store the new section and...", object: "TDS section numbers", url: "https://wm.incometaxindia.gov.in/w/section-393-5", seen: 2026-11-26, kind: law}
- {id: law-009, product: "India law", cap: "Section 206AA is now section 397(2). Tax is deducted at the highest of the section rate, the rate in force, or 20% (5% for Sl.8(ii) and 8(v) of the 393(1) table).", object: "TDS without PAN", url: "https://wm.incometaxindia.gov.in/w/section-397-6", seen: 2026-11-26, kind: law}
- {id: law-010, product: "India law", cap: "Form 16A is Form 131 (certificate under s.395(4)) for tax year 2026-27 onwards; Form 16 is Form 130. Work for FY 2025-26 stays on the old forms. Taken from three news and explainer pages; the Income-tax Rules 2026 pages were blocked.", object: "TDS certificate form", url: "https://www.businesstoday.in/personal-finance/news/story/form-16-to-form-130-new-income-tax-act-brings-in-new-forms-from-april-1-522253-2026-03-25", seen: 2026-11-26, kind: law}
- {id: law-011, product: "India law", cap: "Form 26AS is renamed Form 168 (annual tax statement) from 1 April 2026; AIS continues. Same three non-official pages as the Form 131 row.", object: "annual tax statement form", url: "https://www.taxaj.com/learn/?p=90968", seen: 2026-11-26, kind: law}
- {id: law-012, product: "India law", cap: "Section 34(2): a credit note must be declared in the return for the month it is issued, and not later than 30 November following the financial year of the supply or the date the annual return is filed, whichever is earlier. So the cutoff can come before 30 November if the firm filed GSTR-9 early....", object: "credit note time limit", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section34_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-013, product: "India law", cap: "Rule 46 prescribes the exact endorsement: \"SUPPLY MEANT FOR EXPORT/SUPPLY TO SEZ UNIT OR SEZ DEVELOPER FOR AUTHORISED OPERATIONS UNDER BOND OR LETTER OF UNDERTAKING WITHOUT PAYMENT OF INTEGRATED TAX\", or the same ending \"ON PAYMENT OF INTEGRATED TAX\". The invoice must also show recipient name and...", object: "export invoice endorsement", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-014, product: "India law", cap: "From 1 November 2026 s.34(1) expressly allows credit notes for post-supply discounts under s.15(3)(b); the discount no longer needs a prior agreement, but the recipient must reverse the matching ITC and the 30 November limit still applies.", object: "post-sale discount credit note", url: "https://www.businesstoday.in/latest/economy/story/finance-ministry-notifies-key-gst-changes-from-november-1-564094-2026-10-27", seen: 2026-11-26, kind: law}
- {id: law-015, product: "India law", cap: "Rule 46(b): a consecutive serial number not exceeding sixteen characters, in one or multiple series, using letters, numerals, hyphen and slash, unique for a financial year.", object: "invoice number", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-016, product: "India law", cap: "Rules 50, 51 and 53(1A) give receipt voucher, refund voucher, credit note and debit note the same 16-character consecutive-number rule, unique per financial year; separate series are allowed.", object: "voucher and note numbers", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule50_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-017, product: "India law", cap: "The e-invoice schema pattern for DocDtls.No is ^([a-zA-Z1-9]{1}[a-zA-Z0-9/-]{0,15})$, so it cannot start with 0, slash or hyphen.", object: "e-invoice document number", url: "https://einv-apisandbox.nic.in/version1.03/generate-irn.html", seen: 2026-11-26, kind: law}
- {id: law-018, product: "India law", cap: "The invoice number of a cancelled e-invoice cannot be used again, and an IRN cannot be regenerated for the same document number.", object: "cancelled invoice number", url: "https://einvoice1.gst.gov.in/Documents/GST_eInvoiceSystemDetailedOverview.pdf", seen: 2026-11-26, kind: law}
- {id: law-019, product: "India law", cap: "Rule 46(a)-(n). Place of supply with state name is required only for inter-State supplies (46(n)), so printing it always is a house choice.", object: "tax invoice particulars", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-020, product: "India law", cap: "Rule 46(p) requires a statement whether tax is payable on reverse charge basis and 46(q) the signature or digital signature of the supplier or representative (not needed on an e-invoice with QR).", object: "reverse charge statement", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-021, product: "India law", cap: "Notification 13/2017-CT(Rate) entry 2: legal services by an individual advocate or firm of advocates to a business entity in the taxable territory are taxed on reverse charge, paid by the business entity.", object: "advocate reverse charge", url: "https://cbic-gst.gov.in/pdf/press-release/legal-services-15072017.pdf", seen: 2026-11-26, kind: law}
- {id: law-022, product: "India law", cap: "Rule 47: invoice for services within 30 days of supply; 45 days if the supplier is an insurer, bank or financial institution including NBFC.", object: "invoice time limit", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule47_v1.00.html", seen: 2026-11-26, kind: law, skip: "Rule 47 timing on R38 was judged loose by the audit, so that rule rests on judgement now; row kept for the next check"}
- {id: law-023, product: "India law", cap: "CGST s.13(2): the earlier of the invoice date (if issued in time) or the date of receipt of payment; if the invoice is late, the earlier of date of provision of service or receipt of payment. Payment received first moves the date earlier.", object: "time of supply services", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter4/section13_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-024, product: "India law", cap: "Section 14 CGST decides the rate when the rate changes between supply, invoice and payment (PIB FAQ on the 22 Sep 2025 change, Q4-Q5).", object: "rate by date of supply", url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2163560", seen: 2026-11-26, kind: law}
- {id: law-025, product: "India law", cap: "From 22 September 2025 the slabs are 5%, 18% and 40% (12% and 28% removed); 3% (gold, silver), 0.25% (rough diamonds) and 1.5% (cut and polished diamonds) remain special rates. For services 0, 5, 18 and 40 are the usable rates; the list misses 1.5%, which does not matter for services.", object: "GST rate slabs", url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2163560", seen: 2026-11-26, kind: law}
- {id: law-026, product: "India law", cap: "IGST s.12(2): services to a registered person are supplied at that person's location; to an unregistered person at the recipient's location if an address is on record, else the supplier's location. s.12(3)-(14) have exceptions such as immovable property.", object: "place of supply services", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_IGST_Act/active/chapterv/section12_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-027, product: "India law", cap: "IGST s.5 levies IGST on all inter-State supplies; intra-State supplies carry CGST and SGST, each half of the notified rate.", object: "tax split", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_IGST_Act/active/chapteriii/section5_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-028, product: "India law", cap: "s.31(3)(d) and (e) with Rules 50 and 51 require a receipt voucher and a refund voucher. Notification 66/2017 exempts tax on advances only for goods, not services. Rule 50 proviso: if the rate cannot be fixed at advance, tax is at 18%.", object: "advance receipt voucher", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section31_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-029, product: "India law", cap: "IGST s.16(1): export of services and supplies to an SEZ developer or unit for authorised operations are zero-rated; s.16(3) lets the supplier export without paying IGST under LUT and claim ITC refund, or pay IGST and claim refund of it. The e-invoice supply types are B2B, SEZWP, SEZWOP, EXPWP,...", object: "export and SEZ zero rating", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_IGST_Act/active/chaptervii/section16_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-030, product: "India law", cap: "IGST s.2(6)(iv) needs payment in convertible foreign exchange or in INR where RBI permits. Rule 96A(1)(b): under LUT the tax falls due 15 days after one year or the FEMA period with extensions, whichever is later, from the invoice date if payment for services is not received.", object: "export payment realisation", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_IGST_Act/active/chapteri/section2_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-031, product: "India law", cap: "CBIC master circular on bond and LUT: the LUT is valid for the whole financial year in which it is given; Rule 96A requires it in FORM GST RFD-11 before export.", object: "LUT validity", url: "https://gstcouncil.gov.in/sites/default/files/2024-06/final_master_circular_lut_bond_04102017.pdf", seen: 2026-11-26, kind: law}
- {id: law-032, product: "India law", cap: "Notification 10/2023-CT: e-invoicing for aggregate turnover above Rs 5 crore from 1 August 2023, tested on any year from 2017-18. No official lowering was found as of 26 Nov 2026. Notification 04/2026-CT (26 Oct 2026, seen only in news) widens scope to reverse-charge supplies from unregistered...", object: "e-invoice threshold", url: "https://gstcouncil.gov.in/node/4365", seen: 2026-11-26, kind: law}
- {id: law-033, product: "India law", cap: "GSTN advisory of 5 Nov 2024: from 1 April 2025, AATO of Rs 10 crore and above cannot report an e-invoice older than 30 days; applies to invoices, credit notes and debit notes; the IRP validation rejects it.", object: "e-invoice 30-day limit", url: "https://www.mahagst.gov.in/public/uploads/gstnadvisory/1760531580_293%20Advisory%20Time%20Limit%20for%20Reporting%20e%20Invoice%20on%20the%20IRP%20Portal%20%20Lowering%20of%20Threshold%20to%20AATO%2010%20Crores%20and%20Above.pdf", seen: 2026-11-26, kind: law}
- {id: law-034, product: "India law", cap: "IRP cancels an IRN within 24 hours of generation, and not while an e-way bill is active (official process note); after 24 hours the usual route is a credit or debit note. Sources disagree whether a manual cancel on the GST portal before GSTR-1 filing is possible; A106's 'not yet in a filed...", object: "IRN cancellation", url: "https://einvoice1.gst.gov.in/Documents/eInvoice_process.pdf", seen: 2026-11-26, kind: law}
- {id: law-035, product: "India law", cap: "GSTN advisory and e-invoice process note: IRN is generated for invoices, credit notes and debit notes of B2B and export supplies; the schema accepts INV, CRN, DBN.", object: "IRN for notes", url: "https://www.mahagst.gov.in/public/uploads/gstnadvisory/1760531580_293%20Advisory%20Time%20Limit%20for%20Reporting%20e%20Invoice%20on%20the%20IRP%20Portal%20%20Lowering%20of%20Threshold%20to%20AATO%2010%20Crores%20and%20Above.pdf", seen: 2026-11-26, kind: law}
- {id: law-036, product: "India law", cap: "The IRP does not take B2C transactions; e-invoice covers B2B, export, SEZ and deemed export.", object: "e-invoice scope", url: "https://einv-apisandbox.nic.in/version1.03/generate-irn.html", seen: 2026-11-26, kind: law}
- {id: law-037, product: "India law", cap: "Rule 46(r) requires the QR code with IRN on the invoice; the IRP returns IRN, ack number, ack date, signed invoice and QR. The IRN is a hash of supplier GSTIN, financial year, document type and number (64 hex characters in the official sample).", object: "e-invoice artefacts", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-038, product: "India law", cap: "Schema: LglNm 3-100, Addr1 1-100, Loc 3-50, PrdDesc 3-300, HsnCd 4, 6 or 8 digits.", object: "e-invoice field limits", url: "https://einv-apisandbox.nic.in/version1.03/generate-irn.html", seen: 2026-11-26, kind: law}
- {id: law-039, product: "India law", cap: "Notification 78/2020-CT from 1 April 2021: 4 digits up to Rs 5 crore, 6 digits above, on the preceding year's turnover; a firm up to Rs 5 crore may skip the digits on invoices to unregistered persons. W024 (every line needs a code) is stricter than the law. The e-invoice portal says it will...", object: "HSN SAC digits", url: "https://www.gstcouncil.gov.in/sites/default/files/2024-05/notfctn-78-central-tax-english-2020.pdf", seen: 2026-11-26, kind: law, skip: "digit counts on R16 were judged loose by the audit, so that rule rests on judgement now; row kept for the next check"}
- {id: law-040, product: "India law", cap: "Notification 14/2020-CT: invoices to unregistered persons by firms above Rs 500 crore carry a dynamic QR, effective 1 Dec 2020; penalty was waived to 31 Mar 2021 (Notification 89/2020). Below Rs 500 crore it is not required, so 'optional' is right.", object: "B2C dynamic QR", url: "https://gstcouncil.gov.in/sites/default/files/2024-05/notfctn-14-central-tax-english-2020.pdf", seen: 2026-11-26, kind: law, skip: "the dynamic QR applies above Rs 500 crore turnover, so it is not a wave 1 line"}
- {id: law-041, product: "India law", cap: "GST portal guide: B2CL is inter-state supply to a consumer with invoice value above Rs 1 lakh from the August 2024 return period (was 2.5 lakh before); the rest goes to Table 7 B2C Others.", object: "B2CL limit", url: "https://tutorial.gst.gov.in/userguide/returns/Creation_of_Outward_Supplies_Return_in_GSTR-1.htm", seen: 2026-11-26, kind: law}
- {id: law-042, product: "India law", cap: "GSTR-1 Table 11A/11B advances, Table 12 HSN summary (new format from May 2025), Table 13 documents issued; GSTR-3B 3.1 has (a) taxable, (b) zero rated, (c) nil rated and exempt, (d) inward supplies on reverse charge, (e) non-GST outward. Note (d) is the firm's own purchases.", object: "GSTR-1 and 3B tables", url: "https://tutorial.gst.gov.in/userguide/returns/Creation_of_Outward_Supplies_Return_in_GSTR-1.htm", seen: 2026-11-26, kind: law}
- {id: law-043, product: "India law", cap: "GSTN FAQ: monthly GSTR-3B due 20th; quarterly filers 22nd or 24th by state; IFF 13th of the next month for the first two months of a quarter.", object: "GST return dates", url: "https://tutorial.gst.gov.in/userguide/returns/GSTR3B.htm", seen: 2026-11-26, kind: law}
- {id: law-044, product: "India law", cap: "CGST s.22 sets Rs 20 lakh and Rs 10 lakh for special category states; for services since 1 Feb 2019 the Rs 10 lakh limit applies only in Manipur, Mizoram, Nagaland and Tripura, all other states Rs 20 lakh.", object: "registration threshold", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter6/section22_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-045, product: "India law", cap: "GST Council flyer: composition service providers pay 6% of turnover; they cannot collect tax and issue a bill of supply (s.31(3)(c)).", object: "composition levy", url: "https://www.gstcouncil.gov.in/sites/default/files/e-version-gst-flyers/composition-levy-scheme.pdf", seen: 2026-11-26, kind: law}
- {id: law-046, product: "India law", cap: "CGST s.51: notified government and similar deductors deduct 1% central tax (plus 1% state tax, so 2% in all, or 2% IGST) on supplies above Rs 2.5 lakh under a contract. The 2 percent total is from the rate notification, not read here.", object: "GST TDS", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter10/section51_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-047, product: "India law", cap: "CGST s.15(2)(c) and (d): incidental expenses and interest, late fee or penalty for delayed payment are part of the value of supply.", object: "value of supply", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter4/section15_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-048, product: "India law", cap: "Rule 33: excluded only if the supplier acts as a pure agent under a contract, pays on the recipient's authorisation, shows it separately, holds no title, and recovers only actual cost, in addition to own services.", object: "pure agent", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter4/rule33_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-049, product: "India law", cap: "CGST s.34(3)-(4): debit note is declared in the return for the month of issue; no outer date (the 30 November limit is in s.34(2), credit notes only).", object: "debit note timing", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section34_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-050, product: "India law", cap: "Safe choice: CGST s.36 needs 72 months from the annual return due date (about 6 years 9 months after FY end); Companies Act s.128(5) 8 years (seen in search summary only). Eight years covers both; income-tax reopening can reach further.", object: "retention minimum", url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter8/section36_v1.00.html", seen: 2026-11-26, kind: law}
- {id: law-051, product: "India law", cap: "Section 393(1) Sl.6(iii): 10% for professional fees, 2% for technical fees and call centres, threshold Rs 50,000. Sl.6(i): contractors 1% (individual or HUF) and 2% (others), Rs 30,000 single or Rs 1,00,000 aggregate. Unchanged from the 1961 Act.", object: "TDS rates and thresholds", url: "https://wm.incometaxindia.gov.in/w/section-393-5", seen: 2026-11-26, kind: law}
- {id: law-052, product: "India law", cap: "CBDT Circular 23/2017: where GST on services is indicated separately, TDS is on the amount excluding it. It is a 1961-Act circular; whether CBDT re-issued it for the 2025 Act was not found.", object: "TDS on GST component", url: "https://itatonline.org/info/wp-content/uploads/2017/07/CBDT-Circular-23-TDS-GST.pdf", seen: 2026-11-26, kind: law}
- {id: law-053, product: "India law", cap: "GSTIN = 2-digit state code + 10-character PAN + registration count + Z (default) + check code. The 'standard check-character test' is mod-36; its algorithm was not opened.", object: "GSTIN structure", url: "https://www.indiafilings.com/learn/gstin", seen: 2026-11-26, kind: law}
- {id: law-054, product: "India law", cap: "Both lists show 37 Andhra Pradesh, 38 Ladakh, 97 Other Territory, 99 Centre Jurisdiction.", object: "GST state codes", url: "https://www.indiafilings.com/learn/gst-state-codes", seen: 2026-11-26, kind: law}
- {id: law-055, product: "India law", cap: "Pattern UDYAM-XX-00-0000000 (19 characters with hyphens).", object: "Udyam number", url: "https://www.xflowpay.com/blog/udyam-registration-number", seen: 2026-11-26, kind: law}
- {id: law-056, product: "India law", cap: "MSMED Act s.15: agreed period cannot exceed 45 days from acceptance. Printing the Udyam number is a house choice.", object: "MSME 45 days", url: "https://www.dcmsme.gov.in/publications/LegalFramework.pdf", seen: 2026-11-26, kind: law}
