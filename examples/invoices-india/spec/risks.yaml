- {"id":"K1","assumption":"Small service firms will leave Excel, Vyapar or free Zoho Invoice and pay Rs 499 a month for a GST invoice tool","test":"put a priced fake-door page on a landing page and talk to 10 firm owners; count who gives a card or a firm yes","result":"open"}
- {"id":"K2","assumption":"A UPI QR plus I-have-paid claims, with money recorded by hand, gets firms paid faster without a gateway","test":"five firms use only QR for 30 days; compare days to payment with their last quarter","result":"open"}
- {"id":"K3","assumption":"Owners will record payments themselves without a bank statement match","test":"watch five firms for two weeks; count paid invoices that have a recorded payment against what the bank shows","result":"open"}
- {"id":"K4","assumption":"Accountants accept registers, summaries and Tally XML without a GSTR-1 JSON file","test":"show the month-end pack to 8 chartered accountants and ask which tool they would import it into","result":"open"}
- {"id":"K5","assumption":"Per-line half-up rounding and the odd-paisa CGST plus SGST rule match what accountants' filing tools compute to the paisa","test":"run 200 invoices of all rates through the portal's offline tool and a CA's software and diff every paisa","result":"open"}
- {"id":"K6","assumption":"The fixed number format PREFIX/YY-YY/NNNNN is acceptable to most firms","test":"ask 20 firms for their current invoice number and count how many it fits or can be mapped to","result":"open"}
- {"id":"K7","assumption":"Ten free invoices a month is enough to hook a firm and tight enough to convert","test":"ask 15 firms how many invoices they issue a month and find the median","result":"open"}
- {"id":"K8","assumption":"Invoices sent from our domain reach the inbox at Gmail, Outlook, Zoho and Yahoo","test":"send 100 seeded invoices with SPF, DKIM and DMARC and count spam placements","result":"open"}
- {"id":"K9","assumption":"Chartered accountants will invite their clients because the accountant seat is free","test":"offer the free seat to 10 CAs and count client firms invited in 30 days","result":"open"}
- {"id":"K10","assumption":"Most firms are below Rs 5 crore so a fake e-invoice adapter is enough before launch","test":"ask the 10 design-partner firms for their aggregate turnover band before the build","result":"open"}
- {"id":"K11","assumption":"The 2025-Act section numbers, Form 131 and 168 names and the 1 November 2026 credit note change are right as printed","test":"give the rule table to a chartered accountant for one hour before the build","result":"open"}
- {"id":"K12","assumption":"One GSTIN, one bank account and one business per plan fits most firms of 1 to 20 people","test":"ask 20 firms how many GSTINs and bank accounts they invoice from","result":"open"}
- {"id":"K13","assumption":"Reminders at 1, 7 and 15 days after due date, one per customer, do not annoy payers or the firm","test":"run them for 5 firms for a month and count complaints and payments within 3 days","result":"open"}
- {"id":"K14","assumption":"A customer's UPI app can pay the full balance of a typical invoice, so the QR works above Rs 1 lakh","test":"pay test amounts of Rs 1,00,001 and Rs 2,00,000 from three UPI apps to a business ID","result":"open"}

- {"id":"K15","assumption":"Owners and accountants accept 24-hour delay on bank and UPI changes and a Waiting for IRN state without calling support","test":"watch five design-partner firms for a month; count support tickets that mention a bank change or an unsent invoice","result":"open"}
- {"id":"K16","assumption":"Money recorded on account with its real receipt date and a 'tax due in the receipt month' flag is enough for firms that take advances, before the receipt voucher exists","test":"give the flag and the register line to 5 coaching or agency firms and ask their accountant to file one month from it","result":"open"}