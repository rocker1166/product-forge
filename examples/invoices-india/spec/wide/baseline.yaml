- {"id": "CS01", "text": "Reload keeps the list's filters, search, sort and page; they live in the address.", "d": "now", "at": ["product:list_address"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS02", "text": "Back from a record returns to the same list, filters and page.", "d": "now", "at": ["product:list_address"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS03", "text": "Leaving a form with unsaved changes warns (menu link, Back, closing the tab); an untouched or saved form never warns.", "d": "now", "at": ["rule:R69"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS04", "text": "Enter submits a single-line form once; Enter in a multi-line field adds a line.", "d": "now", "at": ["product:form_keys"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS05", "text": "On a failed submit, focus goes to the first wrong field, which scrolls into view, and each error is tied to its field.", "d": "now", "at": ["product:form_errors"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS06", "text": "An unknown record or route shows a not-found page inside the app with a link back; the API answers 404 JSON; never a blank page or a stack trace.", "d": "now", "at": ["screen:not_found"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS07", "text": "Signed out, a deep link goes to sign-in and then to that page; an outside return address is ignored.", "d": "now", "at": ["screen:sign_in"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS08", "text": "A disabled or removed user is signed out at their next action or reload.", "d": "now", "at": ["user.expiry"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS09", "text": "Long names and words never cause sideways scroll or break the layout, on phone and desktop.", "d": "now", "at": ["product:layout_overflow"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS10", "text": "Every save button is busy at once and cannot be pressed twice; a slow network never makes two records.", "d": "now", "at": ["rule:R70"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS11", "text": "Each create, edit, delete and state change shows a short confirmation naming what happened.", "d": "now", "at": ["product:confirmations"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS12", "text": "Number and money fields accept the local grouping and currency sign, and show them back the local way.", "d": "now", "at": ["product:number_input"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS13", "text": "Sortable columns show the direction and switch it on the second click.", "d": "now", "at": ["product:list_controls"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS14", "text": "Active filters show as chips that can be removed one by one, with a Clear all.", "d": "now", "at": ["product:list_controls"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS15", "text": "A failed save keeps everything typed and says what failed near the form; trying again works.", "d": "now", "at": ["product:form_errors"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS16", "text": "Everything can be done by keyboard in reading order, with a visible focus outline.", "d": "now", "at": ["product:accessibility"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS17", "text": "Every input has a real label, icon buttons have names, tables use header cells, and status is never shown by colour alone.", "d": "now", "at": ["product:accessibility"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS18", "text": "Each page has its own title naming the page or record.", "d": "now", "at": ["product:page_titles"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS19", "text": "Print pages hide the app around the document.", "d": "now", "at": ["product:print_pages"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS20", "text": "Loading shows the page's shape; an error shows a Retry; an empty list says what to do first.", "d": "now", "at": ["product:page_states"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS21", "text": "No action takes more than one second without showing that it is working.", "d": "now", "at": ["product:page_states"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS22", "text": "Dates and times show in the user's time zone and format everywhere, including exports and emails.", "d": "now", "at": ["product:preferences"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS23", "text": "Lists hold 10,000 rows with paging, and stay fast with every filter.", "d": "now", "at": ["product:list_scale"], "why": "", "src": "library/baseline.yaml"}
- {"id": "CS24", "text": "Undo is offered where a change can be reversed; otherwise the confirm names the consequence.", "d": "now", "at": ["product:undo"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC01", "text": "Every request checks the user's role and tenant on the server; hiding a button is not access control.", "d": "now", "at": ["user.layers"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC02", "text": "Another tenant's ids give 404 everywhere: pages, API, search, exports, files, links and counts.", "d": "now", "at": ["rule:R71"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC03", "text": "Passwords are stored with a slow hash; sign-in failures are limited and slowed per account and per address.", "d": "now", "at": ["user.proof", "user.secret"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC04", "text": "Sessions expire when idle, end on sign-out everywhere chosen, and cookies are HttpOnly, Secure and SameSite.", "d": "now", "at": ["user.expiry"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC05", "text": "Every input is checked on the server for type, length and range; the page check is only a help.", "d": "now", "at": ["product:server_validation"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC06", "text": "Output is escaped; users' rich text is cleaned to a safe subset; no user text runs as code.", "d": "now", "at": ["product:output_safety"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC07", "text": "Uploaded files are checked by content, limited in size, stored outside the web root and served through a checked link.", "d": "now", "at": ["product:file_uploads"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC08", "text": "Shared links carry long random tokens, expire, can be revoked, and show only what they were made for.", "d": "now", "at": ["share_link.secret", "share_link.scope"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC09", "text": "Secrets live in the environment, never in code, logs, errors or the browser.", "d": "now", "at": ["product:secrets_and_logs"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC10", "text": "Logs never hold passwords, tokens, full card or bank numbers, or private message text.", "d": "now", "at": ["product:secrets_and_logs"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC11", "text": "Changes to money, bank details, roles and ownership are logged with who, when and old and new values, and the owner is told.", "d": "now", "at": ["history_entry.what", "message:firm_bank_changed", "message:role_changed"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC12", "text": "A change of payout or bank details takes effect only after a delay or a second confirmation.", "d": "now", "at": ["rule:R62"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC13", "text": "State-changing requests are protected against cross-site forgery.", "d": "now", "at": ["product:request_safety"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC14", "text": "Rate limits on sign-in, sign-up, password reset, public pages and exports; the answer says when to retry.", "d": "now", "at": ["product:rate_limits"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC15", "text": "Writes that may be retried carry an idempotency key, so a retry never doubles money or numbers.", "d": "now", "at": ["rule:R70"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC16", "text": "Support or admin access to a customer's data needs their consent, is time-boxed, logged and visible to them.", "d": "now", "at": ["connection:support_access"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC17", "text": "Backups are encrypted, restore is tested, and deleting a customer follows the stated retention.", "d": "now", "at": ["product:backups", "setting:nightly encrypted backup"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC18", "text": "Dependencies are pinned and checked for known holes in CI.", "d": "now", "at": ["product:supply_chain"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC19", "text": "Security headers set: content security policy, frame protection, no sniffing, strict transport.", "d": "now", "at": ["product:request_safety"], "why": "", "src": "library/baseline.yaml"}
- {"id": "SEC20", "text": "A person can export their data and ask for deletion; what must stay by law is said before they confirm.", "d": "now", "at": ["product:privacy"], "why": "", "src": "library/baseline.yaml"}
