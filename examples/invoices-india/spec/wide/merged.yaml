- {"id": "B200", "text": "Reimbursable expenses incurred for a customer can be added to its invoice with receipts attached to the PDF.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (expense into invoice lines)", "src": "https://www.zoho.com/in/invoice/help/invoice/invoice-preferences.html", "area": "invoice", "also": ["Expense lines can carry the original receipt photo, taken from the phone camera, shown only to the firm, not on the client invoice, unless chosen."]}
- {"id": "B201", "text": "A customer-specific price for a saved service applies when that customer is chosen.", "d": "later", "at": [], "why": "customer price lists are extra", "src": "https://github.com/invoiceninja/invoiceninja/issues/11016", "area": "invoice", "also": []}
