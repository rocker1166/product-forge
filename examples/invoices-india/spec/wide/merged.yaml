- {"id": "B204", "text": "An invoice can be held for a set number of hours after creation before sending, so errors can be fixed.", "d": "no", "at": [], "why": "send hold duplicates scheduled send", "src": "https://github.com/getlago/lago/issues/99", "area": "invoice", "also": []}
- {"id": "B208", "text": "Customer category registered, unregistered, SEZ or overseas is required and must agree with whether a GSTIN is present.", "d": "now", "at": [], "why": "", "src": "https://github.com/resilient-tech/india-compliance/issues/225", "area": "customers", "also": ["A customer saved with a GSTIN cannot be saved as unregistered; the wrong category made B2B and HSN totals differ."]}
- {"id": "B209", "text": "A customer carries its own invoicing currency set at creation and printed on the PDF; it cannot change once an invoice exists for them.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/clients", "area": "customers", "also": ["A customer carries its own invoicing currency set at creation and printed on the PDF, for export clients.", "Customer default currency prefills new invoices, quotes and recurring plans."]}
- {"id": "B210", "text": "A customer record has a client-page state (off, on, locked, expired) and a GST treatment, including tax deductor, separate from its address.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/gst-tds.html", "area": "customers", "also": []}
