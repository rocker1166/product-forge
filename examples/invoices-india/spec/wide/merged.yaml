- {"id": "C064", "text": "The assistant's drafts go to an Awaiting owner approval list; the owner sees count on home and can issue one by one or all in one tap.", "d": "later", "at": [], "why": "approval queue is polish", "src": "judge", "area": "flow", "also": []}
- {"id": "C068", "text": "The assistant who enters a quantity of 1000 instead of 10 sees an unusual-amount warning when the total is over 10 times the client's usual invoice.", "d": "no", "at": [], "why": "guessing amounts creates noise", "src": "judge", "area": "flow", "also": []}
