- {"id": "A001", "text": "A CA invited by several firms signs in once and switches firm from a header menu; the header always shows firm name and role.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["One login switches between several firms from a list; the firm name sits in the header of every page.", "Accountant serving 30 firms switches firms from one menu with search, with the last 5 firms first, and the active firm name is always on screen."]}
- {"id": "A002", "text": "A staff role creates and edits drafts only and cannot open Reports or Settings; issue, payment, credit note and settings actions are hidden and return 403.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["A staff user cannot open Reports or Settings; the menu hides them and a typed URL returns 403.", "The office assistant sees a role-limited home: create drafts, record payments, send; no settings, no void, no tax-rate edit.", "roles: maker-checker approval before issue (deferred)"]}
- {"id": "A003", "text": "One role-by-action table lives in settings; the 403 test suite is generated from that table so docs and code cannot drift.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["A role that may view reports can open the GST data screens; a permission error names the missing permission.", "A read-only screen lists each role against every action (create, edit, issue, void, reverse, export, settings, users) as a grid."]}
- {"id": "A004", "text": "Owner can transfer ownership to another active user; the new owner confirms by emailed link, then the old owner becomes accountant.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["A firm owner transfer to another user needs both owners to confirm by OTP, and the old owner is told by WhatsApp and email.", "Owner transfer: current owner nominates another active user; they must accept; both are logged; the first owner becomes accountant."]}
- {"id": "A005", "text": "Deactivating a user ends all their sessions at once, not at next expiry; their next request returns 401.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["When a user is deactivated, active sessions end within 60 seconds, share links they created keep working, and their drafts stay with the firm."]}
- {"id": "A006", "text": "A role change applies on the user's next request without logout; a page already open fails its next action with 403.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["Accountant access to a firm is limited to the firms that invited them; removing the accountant by the owner takes effect on the next request.", "A role change takes effect on the user's next request without logout; the user sees a notice in-app and by email."]}
- {"id": "A007", "text": "Any user can list their own active sessions with device and last-seen time and sign out any of them.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": []}
- {"id": "A008", "text": "A user cannot change their own role, deactivate themselves, or remove the last owner through any other route such as account deletion.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": []}
- {"id": "A009", "text": "Owner can set the next invoice number for a series during onboarding or in settings, only upward and only before any document in that series exists this year.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["Onboarding lets the owner set the next number per series before first issue, so a firm moving from another tool continues its sequence."]}
- {"id": "A010", "text": "Share link visitors see only the one document it was made for, never the customer's other invoices; the customer's other documents and statement are on the customer's password-protected client page, never on a document link.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["The hosted invoice page never shows other invoices or customers; the link is per invoice, not per customer."]}
- {"id": "A011", "text": "Owner can revoke a pending invite; its link then shows 'invite expired'. Resend issues a new link and kills the old one.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["Invite list shows email, role, invited by, date, status (pending, accepted, expired, revoked).", "Resend creates a new link and invalidates the old one; the old link says \"This invite was replaced\" rather than a generic error.", "Revoked or expired invites can be re-sent from the same row without retyping the email."]}
- {"id": "A012", "text": "An invite link works only for the invited email; accepting it while signed in as another user is refused.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": []}
- {"id": "A013", "text": "Product support staff enter a firm only through owner-approved, time-boxed access that is written to the firm's history with a support label.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["Support staff cannot open a firm's data without a time-limited grant the owner gave in the app; each view is logged and visible to the owner.", "A staff member of the product company reading a firm's data needs a ticket id and approval; every read is stored and a firm can request the list.", "Owner can grant support access for 24 hours or 7 days, read-only, from Settings; the page shows who has it and until when.", "Every support view is written to the firm's audit log with the staff member's identity, time and records opened.", "While support has access, every screen shows a banner \"Support can view this firm\" and the owner can revoke it with one click.", "Support cannot write, issue, void or reverse anything on a firm's behalf; fixes are made by the firm's own users."]}
- {"id": "A014", "text": "Owner creates API tokens with read or read-write scope; the secret shows once, is stored hashed, and revoked tokens return 401.", "d": "later", "at": [], "why": "public API follows the web product", "src": "judge", "area": "roles", "also": ["API keys are created with a name and read-only or read-write scope, shown once in full, listed with last used time and revocable at once."]}
- {"id": "A015", "text": "Owner can require TOTP two-step login for all users; users without it are forced to enrol at next login.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["Two-factor setup scans a QR code with any authenticator app and saves only after the user types one valid code."]}
- {"id": "A016", "text": "Plan, billing details and cancellation are owner-only; accountants see the plan read-only and get 403 on changes.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": []}
- {"id": "A017", "text": "Full firm data export is owner-only, and every owner gets an email notice when it runs.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["A user who exports all customers or all invoices triggers a notice to owners naming the user, row count and time."]}
- {"id": "A018", "text": "Viewer cannot see internal notes, bank account numbers of the firm's own settings page, or the user list.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": []}
- {"id": "A019", "text": "Accountant may edit a draft created by someone else; history records both the creator and the editor.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["The owner sees on every draft who created it and what the assistant changed since the last owner view."]}
- {"id": "A020", "text": "Every role check runs on the server per request; a test calls each write endpoint with each role and expects the table's answer.", "d": "now", "at": [], "why": "", "src": "judge", "area": "roles", "also": ["roles: forbidden actions return 403, hidden buttons are not security"]}
- {"id": "A021", "text": "Quote flow: states draft, sent, accepted, declined, expired and converted; converted and declined are final, expired can be reopened by extending the date; Convert to invoice copies lines and customer into a draft and links both ways.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["Quote states are draft, sent, accepted, declined, expired and converted; converted and declined are final, expired can be reopened by extending the date.", "A quote with lines converts to an invoice and is marked converted; a customer can accept it from the portal.", "Convert an accepted quote to a draft invoice copying customer, lines, place of supply and notes; the quote then shows Converted and links the invoice."]}
- {"id": "A022", "text": "A quote has a validity date; after it passes, the quote shows expired and cannot be accepted without extending the date.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["A quote has a validity date; after it passes the quote shows Expired, the client link disables Accept, and the owner can extend validity."]}
- {"id": "A023", "text": "A proforma invoice has its own series PI/YY-YY/NNNNN, prints 'Proforma, not a tax invoice', creates no tax liability and is left out of GST registers; it converts to a tax invoice draft once, then locks as Converted and links the invoice.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "workflow", "also": ["A proforma invoice can be shared before work starts, takes no number from the tax series, and converts to a tax invoice.", "Proforma invoices use their own series PI/YY-YY/NNNNN and show \"Proforma, not a tax invoice\"; they create no tax liability and are absent from registers.", "Convert proforma to tax invoice in one action; the proforma locks as Converted, links the new invoice, and cannot be converted twice."]}
- {"id": "A025", "text": "Advance refunded because no supply happened: issue a refund voucher against the receipt voucher, reversing the tax shown on it.", "d": "later", "at": [], "why": "needs receipt vouchers built first", "src": "https://cbic-gst.gov.in CGST Rule 51", "area": "workflow", "also": []}
- {"id": "A026", "text": "A recurring schedule bills a fixed fee each period and fills the service period text on the draft, for example 'May 2026'.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["A recurring profile can name the service period each invoice covers, for example Feb to Apr, and prints it."]}
- {"id": "A027", "text": "Time billing: staff log hours against a customer and rate; Bill selected entries builds invoice lines, marks entries billed, and voiding the invoice frees them.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time billing flow)", "src": "judge", "area": "workflow", "also": []}
- {"id": "A028", "text": "Expenses re-billed to a customer become invoice lines from stored expense entries with receipt attached; billed entries cannot be billed twice.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (expense re-billing flow)", "src": "judge", "area": "workflow", "also": []}
- {"id": "A029", "text": "One payment can be split across several invoices of the same customer; the allocation screen defaults to oldest-due first and must sum to the amount.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["One bank receipt can be split across several invoices of the same customer in one entry.", "Payment received for several invoices of one client in one bank credit can be recorded once and split across invoices, oldest first by default.", "One customer payment can be split across several invoices, oldest due first by default, editable per row; the receipt shows each allocation."]}
- {"id": "A030", "text": "Money received before any invoice exists is saved as on-account payment on the customer and can be allocated later.", "d": "room", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["A payment with no invoice yet is kept as unapplied and appears in the customer's credit balance until applied."]}
- {"id": "A031", "text": "Cheque payment moves received, deposited, cleared or bounced; a bounce reverses the payment, restores balance, and can add a bank-charge debit.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["Cheque payments hold cheque date and status (received, deposited, cleared, bounced); bounced reverses the payment and logs a bounce note."]}
- {"id": "A032", "text": "Customer pays through a payment link; the gateway webhook records the payment with its reference and emails a receipt without staff action.", "d": "later", "at": [], "why": "gateway link comes after the QR", "src": "judge", "area": "workflow", "also": []}
- {"id": "A033", "text": "Client can press Something is wrong on an invoice page; the invoice gets In dispute, reminders on it pause for 7 days and owners get an email.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["Client can ask a question on the invoice page with one tap, which messages the firm on WhatsApp with the invoice number prefilled."]}
- {"id": "A034", "text": "Owner can record an expected payment date (promise to pay) on an invoice; its reminders pause until the day after that date, and the date is kept apart from the due date.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["An invoice has an expected payment date, separate from due date, that drives reminders and the expected-receipts bucket.", "Marking a promise-to-pay date on an invoice pauses reminders until that date plus one day.", "Mark promise-to-pay date and a reminder pause on an invoice, shown on the list as a date chip."]}
- {"id": "A035", "text": "Owner can write off a small remaining balance with a reason; it reduces balance as write-off, not as a payment, and shows on reports.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": []}
- {"id": "A036", "text": "Debit note: added charges after issue go on a debit note linked to the invoice, in its own series, and raise the balance due.", "d": "room", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 34(3)", "area": "workflow", "also": ["A debit note can be raised for an increase in value after issue, numbered in its own series with the same tax split as the original invoice.", "A debit note raises the amount owed against an issued invoice for upward revision; it links that invoice, has reason, lines, tax at original rates, and number DN/YY-YY/NNNNN."]}
- {"id": "A037", "text": "Owner or accountant can lock a period up to a date and only an owner can move the date back, with a reason; no document with issue date on or before it can be created, edited, voided or reversed, and the error names the lock date.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["Accountant can mark a month closed for a firm; a closed month blocks new issue dates in it unless an owner reopens it, with the reason recorded.", "Financial-year lock date set by owner blocks creating, issuing or reversing anything dated before it, with the lock date named in the error.", "settings: FY lock date (deferred)"]}
- {"id": "A038", "text": "Recurring drafts notify the owner and wait for review; an owner can mark a schedule auto-issue and auto-send once it has run clean three times.", "d": "later", "at": [], "why": "auto-issue needs proven schedules", "src": "judge", "area": "workflow", "also": ["Recurring invoices can be set to auto-issue and auto-send, with a default of drafts waiting for approval and a 2-day heads-up reminder."]}
- {"id": "A039", "text": "Onboarding takes signup, firm name, state and optional GSTIN, then lands on a new invoice screen; a first invoice is issuable within five minutes and at most 12 taps on a phone.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["Day-one freelancer reaches a first sent invoice in at most 12 taps and under 3 minutes from install, measured on a 2 GB RAM Android phone.", "Issuing a typical one-line invoice takes at most 6 taps after choosing the customer, with the date, due date, number and tax prefilled."]}
- {"id": "A040", "text": "Cancelling the subscription turns the firm read-only after the paid period; invoices, payments, share links and exports stay reachable for as long as books must be kept (at least 8 years), and paying again restores full use at once.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["After a trial or a lapse the firm can still view, search, print and export everything; only new documents stop.", "Owner who stops paying keeps read-only access to all invoices, payments and exports for at least 12 months after the plan ends.", "When a plan lapses, issuing is paused but the pay links already sent keep working for 90 days so clients can still pay.", "After a plan lapses the firm is set read-only with export open; no record is deleted, and paying again restores full use at once."]}
- {"id": "A041", "text": "Customer statement: pick customer and period, see opening balance, invoices, payments and credit notes with running balance and the closing balance, then print or send.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": ["A client statement (all invoices, payments, balance) can be created in 2 taps and sent on WhatsApp as a PDF.", "Customer statement for a date range lists invoices, payments and credit notes with running balance, prints to PDF and emails to the customer contacts."]}
- {"id": "A042", "text": "Bounced invoice email shows a banner on the invoice and customer asking for a corrected address; the old address is not retried.", "d": "now", "at": [], "why": "", "src": "judge", "area": "workflow", "also": []}
- {"id": "A043", "text": "At issue the firm's legal name, address, GSTIN, bank block and logo are copied onto the invoice; later profile edits never change a reprint.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["Bank details on an issued invoice are copied into it and cannot be changed by a later edit of the firm profile."]}
- {"id": "A046", "text": "Timestamps are stored in UTC and shown in IST; FY, due-date and reminder logic all use the IST calendar date.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A047", "text": "Database enforces unique (firm, document type, series, FY, sequence); a second insert of the same number fails at the database, not only in code.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A048", "text": "Payments link to invoices through an allocation table; the sum of allocations never exceeds the payment amount, enforced by constraint or locked transaction.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A050", "text": "Customer holds tax type: registered, composition, SEZ, unregistered, overseas or UIN holder; it drives tax split, invoice title and register section.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "data", "also": []}
- {"id": "A051", "text": "A customer can have several billing and shipping addresses and several contacts with roles (billing, cc); each invoice picks one address and stores a copy.", "d": "room", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A052", "text": "A customer may hold several GSTINs, one per state registration; the invoice picks one and place of supply follows it.", "d": "room", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A053", "text": "Customer stores an optional PAN, pre-filled from GSTIN characters 3 to 12 and checked against it.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "data", "also": []}
- {"id": "A054", "text": "Invoice carries optional customer PO number, PO date, project reference and service period from and to, all printed when filled.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["A customer PO number and PO date can be entered and printed on the invoice and in the register."]}
- {"id": "A055", "text": "Invoice stores supply type: B2B, B2C, export with payment of IGST, export under LUT, SEZ with payment, SEZ without payment, or reverse charge.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "data", "also": []}
- {"id": "A056", "text": "Each line stores tax nature: taxable, nil-rated, exempt, non-GST or zero-rated, so GST returns split them correctly.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "data", "also": ["Cess, exempt, nil-rated and non-GST supplies can be selected per line and appear in their own columns of the register."]}
- {"id": "A057", "text": "Firm can hold several GSTIN registrations, each with its own state, address and number series; every invoice belongs to exactly one.", "d": "room", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 46", "area": "data", "also": ["Request: one company with more than one GSTIN, for firms registered in several states, invoicing by branch.", "A firm with turnover in two states with two GSTINs can add a second GSTIN registration with its own number series and bank details, chosen at invoice creation.", "A firm can hold several GSTINs, each a branch with address, state, bank account, prefix and logo; one is the default."]}
- {"id": "A058", "text": "Firm stores one bank account (bank name, account number, IFSC, optional SWIFT) and a UPI ID; each invoice prints them; several accounts are wave 2.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["A QR code on the invoice PDF carries a UPI payment string or custom text up to 250 characters, switched on per document type.", "A bank account has nickname, bank name, last 4 digits, IFSC, UPI id and a default flag; exactly one account is default and prints on invoices."]}
- {"id": "A059", "text": "LUT record per firm per FY: LUT number, valid-from, valid-to and ARN; export invoices under LUT read it and print its number.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 96A", "area": "data", "also": ["Exporter marks an invoice as export under LUT with no tax; the LUT number and validity year are saved once in settings and printed on every such invoice."]}
- {"id": "A060", "text": "GST rates and SAC master are effective-dated tables; an invoice uses the rate in force on its date of supply, never a hard-coded list.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in", "area": "data", "also": ["A tax-rate list is versioned by effective date; an invoice uses the rate in force on its issue date, and a rate change does not alter any issued invoice.", "System tax-rate table has effective-from dates; an invoice uses the rate valid on its issue date, and rate changes by law are added by the product, not the firm.", "A firm cannot add or edit tax rates; the rate dropdown lists only allowed rates for the document date."]}
- {"id": "A061", "text": "State list carries GST codes including 38 Ladakh and 97 Other Territory, and a foreign option for exports (the portal code must be confirmed); 99 Centre Jurisdiction is not offered for customers.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["Place of supply list holds all states and union territories with GST codes, and \"Other territory\" and \"Outside India\" options."]}
- {"id": "A062", "text": "Foreign-currency invoices store currency, exchange rate to 4 decimals, rate source and date, and the INR equivalent of every amount.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 34", "area": "data", "also": ["An export invoice shows the INR equivalent beside the foreign-currency total with the rate used.", "A foreign-currency invoice shows amount in dollars and its rupee equivalent at the exchange rate used, with the rate editable and the source named.", "Foreign-currency invoice stores an exchange rate with 4 decimals, its source (reference rate or manual), and prints the INR equivalent."]}
- {"id": "A063", "text": "Saved services catalogue holds name, SAC, rate, tax rate and unit; lines copy values so later catalogue edits do not change issued invoices.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A064", "text": "Subscription record stores plan, status, trial end, period end, limits and per-month issued-invoice count used for plan limits.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A065", "text": "Message log stores channel, template id, provider message id, status and timestamps for every email sent.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["Email delivery records stay for the life of the document: sent time, address, success or bounce.", "Reminder log per invoice lists date, rule, recipient and result; list filters by result and date."]}
- {"id": "A066", "text": "Deleting a draft hard-deletes it but leaves a history row with draft id, actor, customer and total; nothing else survives.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": []}
- {"id": "A067", "text": "Generated PDFs and exports live under firm-scoped paths and are served through signed URLs that expire in 15 minutes.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["Uploaded files (logos, receipts) are stored under a firm folder and served by signed links that expire in 15 minutes; guessing a file URL returns 404.", "Exports, PDFs and email attachments are generated per firm and never cached under a shared key that a second firm could read."]}
- {"id": "A068", "text": "Books and history are kept at least 8 years and never purged by plan, trial or closure rules.", "d": "now", "at": [], "why": "", "src": "https://www.incometax.gov.in ; Companies Act Rule 3(1) Accounts Rules", "area": "data", "also": ["Audit entries and issued documents are retained at least 8 years even after a firm lapses, and a closed firm's owner can still export them."]}
- {"id": "A069", "text": "Audit history cannot be switched off by any role and has no edit or delete path in the interface or API.", "d": "now", "at": [], "why": "", "src": "judge", "area": "data", "also": ["The auditable history of every invoice and payment cannot be edited or deleted by any user, including the owner and the product's own staff; changes append only."]}
- {"id": "A070", "text": "Timesheet entries store person, date, hours, rate, customer, billable flag and billed invoice id; billed entries are locked.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time entry record)", "src": "judge", "area": "data", "also": []}
- {"id": "A071", "text": "Invoice must show the firm's name, address, GSTIN, number, date, recipient details, SAC, taxable value, rate, tax amounts and place of supply.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 46", "area": "tax", "also": ["An invoice needs the supplier state's name and code, the recipient's state name and code, and the place of supply, all printed."]}
- {"id": "A072", "text": "Services invoice should be issued within 30 days of supply; issue date more than 30 days after the stated service date shows a warning.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 31(2), Rule 47", "area": "tax", "also": ["Time of supply for a service defaults to the invoice date when issued within 30 days, else the date service was provided.", "Invoice must be issued within 30 days of supply of service (Rule 47); an invoice dated more than 30 days after the service date shows a warning at Issue."]}
- {"id": "A073", "text": "Invoice for an unregistered recipient with taxable value of Rs 50,000 or more requires recipient name, address and state; below it, state only.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 46(f)", "area": "tax", "also": ["Unregistered customer with no GSTIN on an invoice above 2.5 lakh asks for state and address before issue, since B2C large supplies need them."]}
- {"id": "A074", "text": "Invoice prints a line showing whether tax is payable on reverse charge, Yes or No, and a signature block for the authorised signatory.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 46", "area": "tax", "also": ["The invoice shows the amount in words, whole rupee total and the signature or digital sign space as required by Rule 46."]}
- {"id": "A075", "text": "Services invoice prints 'Original for recipient' and 'Duplicate for supplier' copies; printing both on one run is one action.", "d": "later", "at": [], "why": "duplicate copy is a print nicety", "src": "https://cbic-gst.gov.in CGST Rule 48", "area": "tax", "also": []}
- {"id": "A076", "text": "Invoice with both taxable and exempt lines is titled 'Invoice-cum-Bill of Supply'; an all-exempt firm issues 'Bill of Supply'.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 31(3)(c)", "area": "tax", "also": []}
- {"id": "A077", "text": "Invoice number must start with a letter or digit 1 to 9 and use only letters, digits, slash and hyphen, or the e-invoice portal rejects it.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": []}
- {"id": "A078", "text": "Default place of supply is the recipient's registered location; for an unregistered recipient it is address on record, else the supplier's location.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in IGST Act Section 12(2)", "area": "tax", "also": []}
- {"id": "A079", "text": "Place of supply can be overridden with a reason for immovable-property services (location of property) and for services physically performed (location of performance).", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in IGST Act Section 12(3),(4)", "area": "tax", "also": []}
- {"id": "A080", "text": "Intermediary services, common for agencies and recruiters, have place of supply at the supplier's location, so a foreign customer is not an export and tax applies.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in IGST Act Section 13(8)(b)", "area": "tax", "also": []}
- {"id": "A081", "text": "Export of services requires recipient outside India, place of supply outside India and payment in foreign exchange; a failed check blocks zero-rating with the reason.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in IGST Act Section 2(6)", "area": "tax", "also": ["Place of supply for services to a foreign client is the client's location; an export invoice with Indian place of supply is blocked with a message.", "rules: export / SEZ supplies, LUT (deferred)"]}
- {"id": "A082", "text": "An export under LUT prints exactly \"SUPPLY MEANT FOR EXPORT UNDER BOND OR LETTER OF UNDERTAKING WITHOUT PAYMENT OF INTEGRATED TAX\", recipient name and address, country of destination, and tax of zero on every line; the LUT number prints too, as our choice.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", "area": "tax", "also": []}
- {"id": "A083", "text": "An export with tax charges IGST at the normal rate, prints the Rule 46 ending \"ON PAYMENT OF INTEGRATED TAX\" and the country of destination, and flags the invoice for refund tracking.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html", "area": "tax", "also": ["Export of services is zero-rated: with LUT it carries no tax, without LUT it carries IGST with a refund claim; the choice is stored on the invoice and printed."]}
- {"id": "A084", "text": "Export under LUT is refused when no LUT is recorded for the FY of the invoice date or when the stored LUT has expired.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 96A", "area": "tax", "also": ["Firm profile holds LUT number, date and expiry; 30 days before expiry a banner warns, and after expiry export invoices without tax are blocked with a message."]}
- {"id": "A085", "text": "Supply to an SEZ unit or developer is zero-rated: with LUT no tax, or with IGST; the invoice marks SEZ and place of supply is the SEZ state.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in IGST Act Section 16", "area": "tax", "also": []}
- {"id": "A086", "text": "Export and SEZ invoices of e-invoice firms carry the matching e-invoice supply type (export or SEZ, with or without payment) in the IRN request.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": []}
- {"id": "A087", "text": "Reverse-charge supply: the supplier's invoice shows no tax and 'Tax payable on reverse charge: Yes'; a firm-level RCM category list pre-sets it, and an invoice cannot mix reverse-charge and normal lines.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 9(3)", "area": "tax", "also": ["Reverse charge invoices show Tax payable on reverse charge: Yes, and the tax is not added to the total; a mixed invoice is blocked.", "rules: reverse charge (deferred)"]}
- {"id": "A088", "text": "Legal services by an advocate or firm of advocates to a business entity are on reverse charge, so such invoices default to no tax charged.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in Notification 13/2017-CT(R)", "area": "tax", "also": []}
- {"id": "A089", "text": "Composition firm issues a Bill of Supply reading 'Composition taxable person, not eligible to collect tax on supplies'; tax invoices are blocked.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 49, Section 10", "area": "tax", "also": ["Composition-scheme firms issue a Bill of Supply with the line Composition taxable person, not eligible to collect tax; selecting composition removes all tax fields.", "rules: composition scheme firm (deferred)"]}
- {"id": "A090", "text": "Composition firm shows a tax-on-turnover report at 6 percent for services, with quarterly figures, and never shows GST on documents.", "d": "later", "at": [], "why": "turnover tax report is composition-only", "src": "https://cbic-gst.gov.in Notification 2/2019-CT(R)", "area": "tax", "also": []}
- {"id": "A091", "text": "Registration threshold tracker warns the owner when an unregistered firm's year turnover nears Rs 20 lakh (Rs 10 lakh in special-category states).", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 22", "area": "tax", "also": ["A firm with turnover crossing the registration limit sees a banner when its 12-month billed total reaches 90 percent of Rs 20 lakh (Rs 10 lakh in special states)."]}
- {"id": "A093", "text": "Late payment charges are taxable consideration; a late fee billed on a debit note or invoice line carries the service's tax rate.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Schedule II para 5(e)", "area": "tax", "also": []}
- {"id": "A094", "text": "Interest on delayed payment to a micro or small supplier is three times the RBI bank rate with monthly rests; the payment period can be agreed up to 45 days, 15 days without agreement.", "d": "later", "at": [], "why": "interest rules need legal review", "src": "https://www.dcmsme.gov.in/publications/LegalFramework.pdf", "area": "tax", "also": []}
- {"id": "A095", "text": "Invoice prints the Udyam registration number when the firm has one; buyers use it to meet the 45-day payment rule.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in MSMED Act Section 15", "area": "tax", "also": ["MSME Udyam number prints under the firm address on every PDF; the format UDYAM-XX-00-0000000 is validated on save."]}
- {"id": "A096", "text": "TDS on fees is stored by section 393(1) serial number of the Income-tax Act 2025 for payments from 1 April 2026 (Sl.6(iii) old 194J, Sl.6(i) old 194C), shown with the old number as an alias; the user can type another rate.", "d": "now", "at": [], "why": "", "src": "https://wm.incometaxindia.gov.in/w/section-393-5", "area": "tax", "also": ["TDS on professional fees is offered at 10 percent and on technical services at 2 percent, named by section, and the user can type another rate.", "Payment form TDS section list suggests rate (194J 10 percent, 194J 2 percent, 194C 1 or 2 percent) on taxable value excluding GST, editable."]}
- {"id": "A097", "text": "Suggested TDS amount is computed on the amount before GST when GST is shown separately on the invoice; the user can override it.", "d": "now", "at": [], "why": "", "src": "https://www.incometax.gov.in CBDT Circular 23/2017", "area": "tax", "also": ["TDS is computed on the value without GST when GST is shown separately on the invoice, and the receipt shows the base used."]}
- {"id": "A098", "text": "The TDS table holds section 393(1) serial number, old alias, rate and yearly threshold with effective dates; the product owner edits it, never a firm. Fees threshold is Rs 50,000.", "d": "now", "at": [], "why": "", "src": "https://wm.incometaxindia.gov.in/w/section-393-5", "area": "tax", "also": ["Section 194Q, 194C, 194J and 194H TDS rates are kept in a table with dates and edited by the product team, not by the user."]}
- {"id": "A099", "text": "A TDS rate of 20 percent applies to a payee without PAN; the TDS helper shows this when the firm has no PAN on file.", "d": "later", "at": [], "why": "owner rarely lacks a PAN", "src": "https://www.incometax.gov.in Section 206AA", "area": "tax", "also": []}
- {"id": "A100", "text": "TDS recorded on a payment appears in a receivable ledger by customer, section and financial year, with a flag for certificate received: Form 131 for payments from 1 April 2026, Form 16A before.", "d": "now", "at": [], "why": "", "src": "https://www.taxaj.com/learn/?p=90968", "area": "tax", "also": ["A TDS certificate record stores customer, TAN, section (194J, 194C, 194H, 194O, other), quarter, FY, certificate number, certificate date, TDS amount and uploaded PDF."]}
- {"id": "A101", "text": "A TDS-by-customer report for the year lists deducted amounts by quarter so the owner can match them with Form 168 (old 26AS) or AIS.", "d": "now", "at": [], "why": "", "src": "https://www.taxaj.com/learn/?p=90968", "area": "tax", "also": ["TDS receivable report lists TDS deducted by customer per quarter and financial year, to match Form 26AS.", "A TDS summary by customer, quarter and section lists amounts so the firm can match its certificates and Form 26AS.", "TDS receivable report totals TDS deducted by customer and quarter against certificates received, for claiming credit in the income tax return."]}
- {"id": "A102", "text": "TDS on a payment has a type, income-tax or GST TDS at 2 percent from government customers; each shows on its own line and both settle the invoice.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 51", "area": "tax", "also": ["GST TDS at 2 percent from government deductors is separate from income-tax TDS, and each shows on its own line."]}
- {"id": "A103", "text": "An optional TCS line sits outside GST taxable value for firms that collect it; it never changes the tax split.", "d": "later", "at": [], "why": "TCS is rare for services", "src": "https://www.incometax.gov.in Section 206C", "area": "tax", "also": ["rules: TCS (deferred)"]}
- {"id": "A104", "text": "E-invoice applies when the firm's turnover crossed Rs 5 crore in any year since 2017-18; the firm profile stores that flag.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": ["The e-invoice turnover band in firm profile decides if e-invoice is required and if the 30-day block applies.", "The e-invoice applicability threshold is held as a dated setting (currently Rs 5 crore turnover in any year since 2017-18) and the firm's declared turnover chooses e-invoice mode.", "rules: e-invoice threshold by turnover (fake portal skips threshold)"]}
- {"id": "A105", "text": "E-invoice must be reported within 30 days of invoice date for firms with turnover Rs 10 crore or more; generation after that is blocked with a reason.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": []}
- {"id": "A106", "text": "IRN cancellation is allowed only within 24 hours of generation and only if the invoice is not yet in a filed return; reason is mandatory.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": ["An e-invoice IRN can be cancelled only within 24 hours on the portal; after that, the product offers a credit note and disables Cancel IRN with the reason.", "Cancel IRN is allowed only within 24 hours of generation with a coded reason; after that the screen says to issue a credit note instead."]}
- {"id": "A107", "text": "A credit or debit note against an e-invoiced invoice must itself get an IRN; the issue flow does this or blocks with the portal error.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": ["Credit note on an e-invoiced invoice requests its own IRN referencing the original IRN; failure leaves it issued and retryable."]}
- {"id": "A108", "text": "B2C invoices need no IRN; the generate button appears only for B2B, export, SEZ and deemed export documents.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": ["Invoice to a customer without GSTIN shows \"e-invoice not applicable\" and never calls the portal."]}
- {"id": "A109", "text": "E-invoice documents print the IRN, acknowledgement number and date, and the signed QR code returned by the portal.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": ["Signed QR and IRN print on the invoice PDF as soon as they exist, and the PDF is regenerated.", "The product stores the e-invoice signed JSON, the QR code and the acknowledgement number and date, and prints the QR code on the PDF.", "Each e-invoice record stores IRN, acknowledgement number, acknowledgement date, signed QR and status; the QR prints on the invoice PDF."]}
- {"id": "A110", "text": "E-invoice data limits apply on save for e-invoice firms: legal name 100 characters, address line 100, city 3 to 50, item description 300.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "tax", "also": []}
- {"id": "A111", "text": "HSN or SAC digits depend on turnover: 4 digits up to Rs 5 crore, 6 digits above; the firm's turnover band sets the minimum.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in Notification 78/2020-CT", "area": "tax", "also": []}
- {"id": "A112", "text": "SAC field validates against the official code master and shows its description; unknown codes are refused, with a search-by-words picker.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["SAC directory search by code or words returns description and standard rate; unknown code is refused with \"Not a valid SAC\"."]}
- {"id": "A113", "text": "A Council rate or SAC change takes effect by date of supply; drafts saved earlier are rechecked at issue, and the issue screen shows old and new tax and needs a click before issuing.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["Rate changes between draft save and issue; the issue screen shows the old and new tax and needs a click before issuing."]}
- {"id": "A114", "text": "Discount before supply may reduce taxable value only if shown on the invoice; post-supply discount needs a credit note with the buyer's ITC adjustment noted.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 15(3)", "area": "tax", "also": []}
- {"id": "A115", "text": "Credit note for post-sale discount asks 'Was this agreed before the supply?' and records the answer on the document.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 15(3)(b)", "area": "tax", "also": []}
- {"id": "A116", "text": "Debit note carries its own number series DBN, links to the invoice, adds tax at the original rate, and has no 30 November limit.", "d": "later", "at": [], "why": "debit notes follow credit notes", "src": "https://cbic-gst.gov.in CGST Section 34(3)", "area": "tax", "also": []}
- {"id": "A117", "text": "A credit note dated after the limit (30 November, or the annual return date if earlier) is refused with the exact date, unless the owner records it as a commercial, non-GST credit with no tax effect.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section34_v1.00.html", "area": "tax", "also": ["Credit note issued past the 30 November deadline is refused with the exact deadline date and a suggestion to record a commercial discount instead."]}
- {"id": "A118", "text": "Reimbursed expense lines are taxable at the main service's rate; pure-agent treatment is wave 2.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 33", "area": "tax", "also": []}
- {"id": "A119", "text": "Reimbursed expense lines marked pure-agent need receipt, customer-authorised-payment and no-markup ticks; missing one turns the line taxable.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (pure-agent ticks)", "src": "https://cbic-gst.gov.in CGST Rule 33", "area": "tax", "also": ["Lawyer can add a reimbursable expense line with no tax on the invoice (pure agent) and a separate line for professional fee with 18 percent.", "Reimbursable expense lines are marked as pure agent only when the firm picks it and the conditions (separate in books, client's expense) are shown as a checklist."]}
- {"id": "A120", "text": "A cash receipt that would reach Rs 2,00,000 from one person in a day, for one transaction, or for one event is blocked with the warning of section 186 of the Income-tax Act 2025 (old 269ST).", "d": "now", "at": [], "why": "", "src": "https://wm.incometaxindia.gov.in/w/section-186-41", "area": "tax", "also": []}
- {"id": "A121", "text": "Rounding follows one rule everywhere: line tax half-up to paise, document total to nearest rupee with a round-off line, GSTR figures use stored paise.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Section 170", "area": "tax", "also": ["Rounding differences between the invoice total and the sum of lines and tax are stored as a labelled round-off, never added as a hidden line.", "rules: rounding per line half up to paise, total to whole rupee with round-off line"]}
- {"id": "A122", "text": "B2C inter-state invoices above Rs 1 lakh are reported invoice-wise (B2CL); smaller ones fall in state-wise summary; register tags each document.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["A sales register splits supplies into B2B, B2C large, B2C small, export, nil and exempt as the return tables do."]}
- {"id": "A123", "text": "Registers cut by tax period follow the firm's filing mode, monthly or QRMP quarterly, set in the profile.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["A firm can mark itself a quarterly filer; the return screens then group by quarter and show the two monthly invoice-furnishing months."]}
- {"id": "A124", "text": "A documents-issued summary per series lists first number, last number, total issued and cancelled for the period, as GSTR-1 table 13 needs.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": []}
- {"id": "A125", "text": "HSN summary report groups taxable value and tax by SAC and rate for the period, matching GSTR-1 table 12.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["A tax summary report totals tax collected per tax name and rate for any range, with CGST, SGST and IGST shown apart.", "HSN or SAC summary shows quantity, taxable value and tax per code as asked for in the return."]}
- {"id": "A126", "text": "Outward summary matches GSTR-3B table 3.1: taxable, zero-rated, nil-rated or exempt, non-GST, and reverse-charge, with tax per head.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "tax", "also": ["GST summary per month shows taxable value, CGST, SGST and IGST on sales, less credit notes, plus rate-wise table."]}
- {"id": "A127", "text": "Foreign-currency invoices convert at the rate of the date of time of supply per the firm's accounting policy; the rate source is stored.", "d": "now", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 34", "area": "tax", "also": []}
- {"id": "A128", "text": "Export payment reduced by bank charges or forex difference is closed through a bank-charge adjustment, not left as a small balance due.", "d": "later", "at": [], "why": "write-off closes the gap meanwhile", "src": "judge", "area": "tax", "also": []}
- {"id": "A130", "text": "Continuous-supply contracts get an invoice on or before the payment due date set in the contract; the schedule uses that date.", "d": "later", "at": [], "why": "contract dates need a contract record", "src": "https://cbic-gst.gov.in CGST Section 31(5)", "area": "tax", "also": []}
- {"id": "A132", "text": "No tax line can appear on documents of an unregistered firm; when it registers it gives the GSTIN and an effective date, documents from that date use the tax invoice title, and older ones stay plain invoices.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section31_v1.00.html", "area": "tax", "also": ["The date a firm's GSTIN started is stored; issuing a tax invoice dated before it is blocked.", "Changing the firm's registration status (unregistered to registered) takes effect from a chosen date; documents before it stay Bills of Supply, documents after are tax invoices."]}
- {"id": "A133", "text": "GSTIN change or new registration of the firm starts a fresh series for that GSTIN; old series stay readable and untouched.", "d": "room", "at": [], "why": "", "src": "judge", "area": "tax", "also": []}
- {"id": "A135", "text": "Subscription states are trial, free, active, past_due, grace, read_only and cancelled; each state names exactly which actions stay allowed.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": []}
- {"id": "A136", "text": "Cheque payments carry received, deposited, cleared or bounced; only cleared cheques count toward settled in strict mode, if the firm turns it on.", "d": "later", "at": [], "why": "strict clearing is an option", "src": "judge", "area": "states", "also": []}
- {"id": "A137", "text": "Recurring schedule states are active, paused, ended and failed; a failed run shows its reason and does not retry blindly.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": ["A recurring profile has states draft, pending and stopped; nothing is generated until Start is pressed on a draft."]}
- {"id": "A138", "text": "Time entries are open, approved, billed; billed to open happens only when the linked invoice is voided.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time entry states)", "src": "judge", "area": "states", "also": []}
- {"id": "A139", "text": "Payment link states are created, opened, paid, expired and cancelled; a paid link cannot be used again.", "d": "later", "at": [], "why": "link states follow payment links", "src": "judge", "area": "states", "also": []}
- {"id": "A140", "text": "Invoice carries a separate flag disputed on or off; it never changes status or balance, only reminders and list filters.", "d": "later", "at": [], "why": "disputes follow share-page actions", "src": "judge", "area": "states", "also": []}
- {"id": "A141", "text": "Email delivery states are queued, sent, delivered, bounced, complained; opened is a flag set by the share link visit.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": []}
- {"id": "A142", "text": "Import job states are uploaded, validated, importing, done, failed; failed leaves no half-imported rows.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": []}
- {"id": "A144", "text": "Receipt voucher states are issued, adjusted and refunded; adjusted ones cannot be refunded again.", "d": "room", "at": [], "why": "", "src": "https://cbic-gst.gov.in CGST Rule 50, 51", "area": "states", "also": []}
- {"id": "A145", "text": "Every object has a table of allowed transitions; a test tries each disallowed pair through the API and expects a 409.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": []}
- {"id": "A146", "text": "Written-off balance sets invoice status paid-with-write-off in reports and can be undone by an owner within the same open period.", "d": "later", "at": [], "why": "undo needs period lock proven", "src": "judge", "area": "states", "also": []}
- {"id": "A147", "text": "E-invoice states add cancelled to none, generated, failed; cancelled IRN cannot be reused and the invoice then needs a credit note or void.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "states", "also": ["states: e-invoice none, generated, failed"]}
- {"id": "A148", "text": "Recurring and imported drafts carry a 'needs review' mark that the user clears before issuing them.", "d": "now", "at": [], "why": "", "src": "judge", "area": "states", "also": []}
- {"id": "A149", "text": "Issuing at 00:30 IST on 1 April uses the new FY number even though UTC is still 31 March.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A150", "text": "Gateway webhook arrives twice or out of order; the payment is recorded once and later events never undo a newer state.", "d": "later", "at": [], "why": "webhooks arrive with the gateway", "src": "judge", "area": "exception", "also": ["A gateway webhook delivered twice, or out of order, creates one payment only, keyed on the gateway payment id.", "Gateway webhooks are idempotent: the same gateway payment id arriving twice records one payment only."]}
- {"id": "A151", "text": "Gateway webhook with an amount different from the link amount creates a flagged payment for review, not an auto-settled invoice.", "d": "later", "at": [], "why": "amount checks belong to gateway", "src": "judge", "area": "exception", "also": []}
- {"id": "A152", "text": "Webhook with a bad signature is rejected with 401 and logged; the payment is not recorded.", "d": "later", "at": [], "why": "signature check belongs to gateway", "src": "judge", "area": "exception", "also": []}
- {"id": "A153", "text": "E-invoice request times out after the portal accepted it; before retrying the app fetches the IRN by document details and reuses it.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "exception", "also": []}
- {"id": "A154", "text": "Portal says duplicate IRN: the app stores the IRN it returns and marks the invoice generated instead of showing failure.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "exception", "also": []}
- {"id": "A155", "text": "A customer's GSTIN shows cancelled or suspended on the portal at issue time; the user sees a warning and may continue with a reason.", "d": "later", "at": [], "why": "needs a GSTIN status lookup", "src": "https://www.gst.gov.in", "area": "exception", "also": ["Selling services to a client whose GSTIN is cancelled or suspended shows a warning at Issue, from a portal check done within the last 24 hours."]}
- {"id": "A156", "text": "Payment and credit note posted to the same invoice at the same moment cannot together exceed balance; the invoice row is locked.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A158", "text": "Customer archived while a draft for them is open; the draft can still be issued but a notice says the customer is archived.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A159", "text": "Recurring run on a day when the customer is archived or firm is read-only skips with a logged reason and tells the owner.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A160", "text": "Recurring job down for two days: on restart it creates each missed period once, never duplicates, using a unique key of schedule and period.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A161", "text": "Plan limit reached mid-bulk action: documents already issued stay, the rest stay draft, and the result says how many of each.", "d": "later", "at": [], "why": "bulk issue is not in launch", "src": "judge", "area": "exception", "also": []}
- {"id": "A162", "text": "Plan limit never blocks credit notes, payments, voids or exports; only creating new issued invoices counts toward it.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A163", "text": "Trial or paid period ends while a user is typing: the save succeeds as a draft, then the firm turns read-only on next load.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A164", "text": "Firm has no GSTIN, state or address yet; issuing is blocked with a checklist of what to fill and a link to each field.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A165", "text": "PDF render fails or times out: the invoice stays issued, the share page shows 'preparing', and a retry runs automatically.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A166", "text": "Share link opened after the invoice is voided shows a plain 'This invoice was cancelled' page with number and date only.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A167", "text": "Recurring day 29 to 31 is not offered; a schedule imported with such a day is clamped to 28 and tells the owner.", "d": "later", "at": [], "why": "imported schedules are not offered", "src": "judge", "area": "exception", "also": []}
- {"id": "A168", "text": "Database failover mid-issue: the number is either committed with the invoice or not at all, and a retry cannot make a second invoice.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": ["If the network drops after the Issue tap and before the reply, reopening the draft shows the true result (issued with number, or still draft), never both.", "Retrying Issue after a timeout uses one idempotency key so it never produces two invoices or two numbers.", "A user who taps Issue twice quickly gets one invoice; the second tap shows the same invoice.", "A draft that fails to save at the moment of Issue never leaves a half-issued record: the invoice, its lines, number and history are written in one transaction."]}
- {"id": "A169", "text": "API requests carry an idempotency key; repeating the key with the same body returns the first result, a different body returns 422.", "d": "later", "at": [], "why": "external clients arrive with the API", "src": "judge", "area": "exception", "also": ["POST requests accept an Idempotency-Key header; the same key within 24 hours returns the first result without creating a second record."]}
- {"id": "A170", "text": "Too many requests from one user or token return 429 with a Retry-After header; the page shows a calm wait message.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": ["A rate limit of 100 requests a minute per user and 1,000 per firm applies on the API, with a clear 429 message and a retry time.", "Rate limit above 100 requests per minute per key returns 429 with a Retry-After header, and the call is not applied."]}
- {"id": "A171", "text": "Voiding an invoice that has draft credit notes is blocked until those drafts are deleted or issued.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A172", "text": "Reversing a payment whose invoice already carries a later credit note recalculates both, and customer credit never goes negative.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A173", "text": "Currency rate missing for the invoice date: save is blocked with a prompt to enter a rate, never a stale rate.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A174", "text": "Pasting text with line breaks into one-line fields strips breaks; pasting beyond the limit shows the count, not silent cut-off.", "d": "now", "at": [], "why": "", "src": "judge", "area": "exception", "also": []}
- {"id": "A175", "text": "PAN must match five letters, four digits, one letter; the 4th letter must be a valid holder-type code such as C, P, F, H or T.", "d": "now", "at": [], "why": "", "src": "https://www.incometax.gov.in", "area": "validation", "also": ["validate: PAN (deferred)"]}
- {"id": "A176", "text": "TAN must match four letters, five digits, one letter.", "d": "later", "at": [], "why": "TAN is not stored yet", "src": "https://www.incometax.gov.in", "area": "validation", "also": []}
- {"id": "A177", "text": "IFSC must be four letters, a zero, then six letters or digits; bank account is 9 to 18 digits.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": ["validate: bank IFSC (deferred)"]}
- {"id": "A178", "text": "UPI ID must match handle@provider; it is checked for format only and never sent anywhere on save.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A179", "text": "Udyam number must match UDYAM-XX-00-0000000, with a valid state code.", "d": "now", "at": [], "why": "", "src": "https://udyamregistration.gov.in", "area": "validation", "also": []}
- {"id": "A180", "text": "No field stores a 12-digit Aadhaar number; pasting one into a note or ID field is refused.", "d": "now", "at": [], "why": "", "src": "https://uidai.gov.in", "area": "validation", "also": []}
- {"id": "A181", "text": "Pincode's first two digits are checked against the state; a mismatch is a warning, not a block.", "d": "now", "at": [], "why": "", "src": "https://www.indiapost.gov.in", "area": "validation", "also": []}
- {"id": "A182", "text": "Phone accepts +91, 91 or 0 prefixes and spaces, then stores 10 digits.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A183", "text": "Text fields are trimmed, inner whitespace is collapsed, and whitespace-only values count as empty; limits count characters, not bytes.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A184", "text": "Exchange rate must be above 0 with up to 4 decimals; foreign amounts allow 2 decimals except for currencies with none.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A185", "text": "Dates reject impossible days such as 29 February in non-leap years; date pickers and typed dates give the same result.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A186", "text": "Possible duplicate customer, same name and state or same phone, shows a warning with a link to the existing one, not a block.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": ["The assistant who types a wrong customer name gets a warning when a similar existing customer exists (Did you mean ...?) before a duplicate is created."]}
- {"id": "A187", "text": "HSN or SAC with leading zeros is kept as text everywhere; codes never lose zeros through import, export or JSON.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": ["Invoice report CSV opens with leading zeros kept in invoice numbers, and the export note tells Excel users to choose Don't Convert."]}
- {"id": "A188", "text": "TDS amount cannot exceed the invoice taxable value; payment mode, amount and TDS all show together in one error summary.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A189", "text": "Customer note and PDF text strip control characters but keep Hindi, Bengali, Tamil and other Indian scripts.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A190", "text": "Write-off amount must be above 0 and at most the balance due, with a reason of 5 to 200 characters.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A191", "text": "Quote validity date must be on or after the quote date; a proforma needs at least one line with a rate.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A192", "text": "Email send checks the recipient format and the suppression flag before queueing; blocked sends say which check failed.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A193", "text": "Share link expiry chosen by the owner must be between 1 and 365 days; the default is 30.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": []}
- {"id": "A194", "text": "Uploaded logo accepts PNG or JPG up to 1 MB and 2000 pixels wide; others are refused with the limits stated.", "d": "now", "at": [], "why": "", "src": "judge", "area": "validation", "also": ["Logo upload accepts JPG or PNG up to 1 MB and appears on PDFs and emails; deleting it never changes PDFs already sent.", "Logo upload accepts PNG or JPG up to 2 MB with minimum 200 pixels wide; the print preview updates before saving.", "settings: logo upload (deferred)"]}
- {"id": "A195", "text": "Invoice email subject reads 'Invoice <number> from <firm> for Rs <amount>, due <date>'; the body gives balance due, pay link, PDF and firm contact.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A196", "text": "Attached PDF file name replaces slashes with hyphens, for example INV-26-27-00001.pdf; no slash reaches a file name or URL path.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Client can view the invoice in the page itself and download the PDF with a file name like FirmName-INV-26-27-00012.pdf."]}
- {"id": "A197", "text": "Email is sent from a product address with the firm's name as sender and the firm's email as Reply-To, used only after a verification email to that address is confirmed.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Email sending can use the firm's own reply-to address; a verification email to that address is required before it is used."]}
- {"id": "A198", "text": "The sending domain has SPF, DKIM and DMARC set before launch and a sample message is checked for all three.", "d": "now", "at": [], "why": "", "src": "https://support.google.com/a/answer/81126", "area": "message", "also": ["Sending invoices from the product's domain uses SPF, DKIM and DMARC aligned for the firm's reply-to, and the firm's name appears as sender name with no spoofable address."]}
- {"id": "A199", "text": "A hard bounce adds the address to a suppression list for that firm; later sends to it are blocked with the reason shown.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A200", "text": "A spam complaint stops all reminders to that address across the firm and tells the owner.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A201", "text": "Customer reply to the email goes to the firm, not to the product.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A202", "text": "WhatsApp invoice message uses a pre-approved template with named fields and a PDF; free text is not sent outside the 24-hour reply window.", "d": "later", "at": [], "why": "WhatsApp API needs template approval", "src": "https://developers.facebook.com/docs/whatsapp", "area": "message", "also": ["msg: WhatsApp / SMS (out: external)"]}
- {"id": "A203", "text": "WhatsApp sends only to customers marked as opted in; the opt-in source and date are stored.", "d": "later", "at": [], "why": "opt-in tied to WhatsApp API", "src": "https://developers.facebook.com/docs/whatsapp", "area": "message", "also": []}
- {"id": "A204", "text": "Customer replying STOP to a WhatsApp or SMS message sets the opt-out flag and no further reminders go on that channel.", "d": "later", "at": [], "why": "STOP replies need WhatsApp API", "src": "judge", "area": "message", "also": []}
- {"id": "A205", "text": "Templates are shown in preview with sample values; a template with a missing field cannot be saved.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Reminder preview shows the exact email for a chosen invoice before the rule is saved, with variables filled.", "Saving a template with an unknown variable is refused and names the variable; missing data at send time renders blank, never the raw braces."]}
- {"id": "A206", "text": "SMS goes only through a registered sender ID and template with an entity ID; text not matching the template is not sent.", "d": "no", "at": [], "why": "SMS is not a channel here", "src": "https://www.trai.gov.in", "area": "message", "also": []}
- {"id": "A207", "text": "SMS text uses 'Rs' instead of the rupee sign, and a message that would exceed one segment shows its segment count before send.", "d": "no", "at": [], "why": "SMS text rules go with SMS", "src": "judge", "area": "message", "also": []}
- {"id": "A208", "text": "Reminders send between 9 am and 7 pm IST only; ones queued outside the window wait until 9 am.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Reminders send only at the set hour on working days, skipping Sundays and listed holidays, and never more than one per invoice per day."]}
- {"id": "A209", "text": "One consolidated reminder per customer lists all overdue invoices; a customer with three overdue invoices gets one message, not three.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A210", "text": "Reminder wording has three tones for day 1, 7 and 15; each shows balance due, not original total, and the pay link.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Reminder tone has three presets (gentle, firm, final) and the firm can edit the text once as a default."]}
- {"id": "A211", "text": "Reminders can be switched off per customer and per invoice; an off switch shows on the invoice header.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["A customer can be excluded from reminders with a toggle on the customer page; excluded invoices show a small \"reminders off\" marker.", "Customer-level toggle stops reminders; statement email can be set monthly to the customer's billing contacts."]}
- {"id": "A212", "text": "Before-due reminder, 3 days ahead, is optional per firm and off by default.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["A before-due reminder (for example 3 days before) can be set; it is skipped when the invoice is already paid."]}
- {"id": "A213", "text": "Payment receipt message goes automatically after a payment unless the box is unticked, and states amount, TDS, balance left and receipt number.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Receipt email to the customer is a checkbox at record time, default on when the customer has an email, and goes to the outbox.", "msg: outbox payment receipt email (deferred)"]}
- {"id": "A214", "text": "Owner gets a weekly email on Monday 9 am IST with total overdue, newly paid, and top 5 late customers.", "d": "later", "at": [], "why": "digest email is a nicety", "src": "judge", "area": "message", "also": []}
- {"id": "A215", "text": "Owner gets alerts for e-invoice failure, trial ending in 7 and 1 days, and plan limit at 80 and 100 percent; LUT expiry 30 days ahead.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A216", "text": "The share page shows invoice, balance due, a Pay with UPI button that opens the customer's UPI app with payee, balance and invoice number, a QR on desktop, and a PDF download; it stays usable after the due date, says plainly when the invoice is paid or voided, needs no login, carries no internal notes and stays light on slow phones.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["A hosted invoice page shows details, amounts and status, offers PDF of invoice and receipt, and lives at a long random private URL.", "The invoice link opens a mobile page with amount, firm name, a Pay with UPI button and a PDF download, with no login and no app install.", "The Pay with UPI button opens the client's installed UPI app by intent with amount, payee and invoice number in the note preset.", "On a desktop, the pay page shows a UPI QR code of the exact balance due that any UPI app can scan.", "The pay page lists balance due, not total, so a part-paid invoice shows only what is still owed.", "Pay link remains usable after the due date and shows the same balance, unless the invoice was voided or paid, when it states so plainly.", "Client opening the WhatsApp link on a 2G connection sees the amount and Pay button in under 3 seconds because the page is under 100 KB before the PDF."]}
- {"id": "A217", "text": "Amount in words follows the Indian system (lakh, crore) with paise, for example 'Twelve Lakh Rupees and Fifty Paise Only'.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A218", "text": "PDF embeds fonts with the rupee glyph and Indian scripts; a customer name in Devanagari prints correctly.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["The invoice PDF prints on A4 in under 2 pages for up to 12 lines, in a font that shows the rupee symbol on every device.", "PDF generation completes in under 3 seconds and works for names in Hindi, Bengali, Tamil and other Indian scripts without broken boxes."]}
- {"id": "A219", "text": "A 50-line invoice paginates with repeated headers, no split rows, and the tax summary and totals on the last page.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": []}
- {"id": "A220", "text": "Every error message names the field, the limit and the fix; no message shows a code or stack trace.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["Every error message says what to do next in plain words, in the app's language, with no codes shown first.", "msg: field-level error text states field and limit"]}
- {"id": "A221", "text": "Void invoices print with a diagonal CANCELLED mark and the void date; their number stays visible.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["PDF carries a DRAFT watermark on drafts, VOID on voided and PAID on paid invoices, and labels copy as \"Original for Recipient\"."]}
- {"id": "A222", "text": "Pre-debit notice emails go to the owner at least 24 hours before our own subscription auto-debit.", "d": "now", "at": [], "why": "", "src": "https://www.rbi.org.in", "area": "message", "also": []}
- {"id": "A223", "text": "Our own subscription invoice to each firm is a GST invoice with the firm's GSTIN so the firm can claim input credit.", "d": "now", "at": [], "why": "", "src": "judge", "area": "message", "also": ["The product issues its own GST invoice to the firm for each subscription payment, with the firm's GSTIN, listed under Billing with PDF download."]}
- {"id": "A224", "text": "Every job takes a lock so two app instances never run the same job at once; a test starts two runners and expects one set of results.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A225", "text": "Each job run stores start, end, counts and errors.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A226", "text": "Jobs use a unique key per unit of work, such as invoice and reminder step, so re-running a job sends nothing twice.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A227", "text": "A reminder job that missed its day sends at most one catch-up message per invoice, never the whole backlog.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A228", "text": "A nightly integrity job checks that stored totals equal a recomputation from lines, balances equal payments plus credits, allocations never exceed payments, counters match the highest issued number with gaps listed, and stored PDF hashes equal their files, and alerts engineers on any difference.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": ["Totals stored at issue equal a fresh recomputation from stored lines; a nightly check lists any document where they differ.", "Counter table stores per firm, document type, prefix and FY the last number; a nightly job compares it to the highest issued number and lists gaps.", "Invoice numbers are verified by a daily check that finds gaps or duplicates per firm, and a gap raises an alert to the product team, not only to the user.", "Numbering screen offers Check gaps, which lists any missing sequence numbers in a series and why (none expected); a gap is a defect report.", "Ledger balance always equals credits issued minus credits applied minus refunds; a mismatch is shown as an error banner and logged."]}
- {"id": "A229", "text": "Daily job checks e-invoice window: documents near 30 days without an IRN are listed to the owner.", "d": "now", "at": [], "why": "", "src": "https://einvoice1.gst.gov.in", "area": "job", "also": ["The 30-day reporting rule applies from 1 April 2025 to firms with turnover of 10 crore or more; the product warns before day 30.", "Request: a daily warning when an invoice is nearing the 30-day limit for e-invoice.", "List flag shows invoices that need an IRN and the days left of the reporting window, with a warning when 3 or fewer remain."]}
- {"id": "A230", "text": "Month-end job on the 1st at 08:00 IST builds the accountant pack: sales register, credit and debit notes, receipts, TDS and ageing, emailed or linked.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": ["A month-end pack, with sales register, aging, payments and credit notes, goes to the accountant by email in one click.", "Accountant gets a monthly pack per firm with sales register, payment register, credit notes and TDS in one zip, in one tap, with period preset to last month.", "Monthly accountant pack: owner schedules a monthly email to a chosen address with the sales register, receipts register, TDS list and aged receivables as CSV.", "workflow: month-end register export for accountant"]}
- {"id": "A231", "text": "Filing calendar job sends owner reminders for GSTR-1 on the 11th, GSTR-3B on the 20th, and QRMP dates 13th and 22nd or 24th.", "d": "now", "at": [], "why": "", "src": "https://www.gst.gov.in", "area": "job", "also": []}
- {"id": "A232", "text": "Trial-end job moves the firm to the Free plan, never to a blocked state, and no job deletes any firm's books.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A233", "text": "Webhook delivery to outside systems retries with growing waits for 24 hours, then lands in a dead-letter list the owner can replay.", "d": "later", "at": [], "why": "outbound webhooks follow the API", "src": "judge", "area": "job", "also": ["Webhook endpoint setup takes URL, chosen events and a signing secret; each delivery has an HMAC signature, timestamp and event id.", "Delivery log per endpoint shows each attempt with status code and response time; failed ones retry on a backoff for 24 hours, and can be resent by hand."]}
- {"id": "A234", "text": "Daily reconciliation job compares gateway settlements with recorded online payments and flags payments missing on either side.", "d": "later", "at": [], "why": "reconciliation needs the gateway", "src": "judge", "area": "job", "also": []}
- {"id": "A236", "text": "Backup runs nightly, encrypted and kept in a second region in India, and a restore test into a clean database runs weekly and checks counts of invoices and payments; one firm can be restored alone.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": ["A database restore test from backup runs every month and the restore time and the data loss window (at most 15 minutes) are recorded.", "Backups are encrypted, kept in a second region in India, and a firm's backup can be restored alone without touching other firms.", "job: nightly backup (deferred)"]}
- {"id": "A237", "text": "FY rollover job runs on 1 April 00:05 IST, creates new counters at 00001, and does not reset any pending draft.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": ["exception: FY rollover resets counter"]}
- {"id": "A238", "text": "Job clock tests use a fixed IST clock, including 31 March to 1 April and month ends, so schedules are testable.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": []}
- {"id": "A239", "text": "PDF and e-invoice calls run as queued jobs with a retry limit of 5 and an owner-visible failed state, never inline in a user request.", "d": "now", "at": [], "why": "", "src": "judge", "area": "job", "also": ["Portal timeouts retry automatically with a pause and an attempt count shown on the invoice.", "Failed invoice emails are retried by the product a set number of times, and the outbox shows the attempt count.", "Gateway or WhatsApp provider outage never blocks issuing: invoices are issued and queued, and the user sees which sends are waiting."]}
- {"id": "A241", "text": "Opening-balance import adds unpaid old invoices with original number, date, customer and balance, marked migrated and read-only.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Imported invoices need a unique number; lines sharing one number group into one invoice; a missing quantity or rate falls back to one unit.", "Opening balances import: one row per unpaid invoice with customer, number, date, amount and balance, creating imported invoices that can take payments.", "move: invoice opening balances import (deferred)"]}
- {"id": "A242", "text": "Migrated invoices keep their original numbers even if longer or differently formatted, up to 16 characters, never touch the counters, and a number that clashes with an existing one in the same series is rejected.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["A user who pastes the same invoice number into a manual-number field cannot set it; numbers are never typed by users except at the first opening balance.", "Imported invoice numbers that clash with an existing number in the same series are rejected; numbers that do not fit the firm's format are accepted but flagged."]}
- {"id": "A243", "text": "Customer CSV import maps columns, shows a dry run with row errors, and imports nothing until the user confirms.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Import wizard steps: upload, map columns, preview first 20 rows with problems marked, run; mapping choices are remembered per file layout.", "move: customer CSV import (deferred)", "customer: import / export (deferred)"]}
- {"id": "A244", "text": "Import error report downloads as CSV with row number, field and reason; fixing and re-uploading the file does not duplicate rows already added.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Result screen counts created, updated, skipped and failed rows; the failed rows download as a CSV with the original columns plus Row and Reason."]}
- {"id": "A245", "text": "Import detects duplicates by GSTIN and, for unregistered customers, by name and phone, then skips or updates by user choice.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Customer import match key choice: GSTIN, else email, else name plus pincode; choose whether a match updates the record or skips it.", "Customer import matches on GSTIN, else email, else name plus pincode; update or skip chosen once; bad rows download with reasons."]}
- {"id": "A246", "text": "Import reads UTF-8 and Windows-1252 files and Excel date formats, cleans amounts with commas, rupee sign or spaces, and keeps leading zeros in pincode, phone and HSN.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Amount cells with commas, rupee sign or spaces are cleaned; dates accept DD-MM-YYYY, DD/MM/YYYY and YYYY-MM-DD; anything else is a row error."]}
- {"id": "A247", "text": "Import accepts CSV and XLSX up to 5 MB and 5,000 rows and tells the user to split larger files before it reads anything.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["File limits 5 MB and 5000 rows; accepted CSV and XLSX in UTF-8; over-limit is refused before parsing with the limit stated."]}
- {"id": "A248", "text": "Tally export produces vouchers in Tally's XML import format with party ledgers, sales ledger, tax ledgers and round-off per document.", "d": "now", "at": [], "why": "", "src": "https://help.tallysolutions.com", "area": "move", "also": ["Data can be exported in Tally-readable XML so the accountant imports sales vouchers into Tally.", "An export for Tally gives sales vouchers with party, GSTIN, tax ledger split and round-off, so the accountant need not retype.", "Export Tally vouchers as XML for sales, credit notes and receipts for a date range, with party ledger names matched to customer names."]}
- {"id": "A249", "text": "Sales register, credit notes and receipts export as a zip with one CSV per month for the accountant, in the same column order every time.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Credit note export CSV: number, date, invoice, customer, reason, taxable, CGST, SGST, IGST, total, status; credit rows negative in registers."]}
- {"id": "A250", "text": "GSTR-1 JSON export validates against the GST offline tool's schema and lists errors per document before download.", "d": "later", "at": [], "why": "registers first, portal file after", "src": "https://www.gst.gov.in", "area": "move", "also": ["A GSTR-1 JSON file is built per month with a check that rejects rows the portal would reject.", "The accountant's export matches GSTR-1 sections (B2B, B2CS, CDNR, exports) with a checksum count of invoices and total taxable value per section.", "GSTR-1 JSON export for a month builds B2B, B2CS, credit notes, HSN summary and document-issued tables in the portal's schema.", "move: JSON export of GSTR-1 (deferred)"]}
- {"id": "A251", "text": "Customer ledger and payment CSV exports exist with the same filter options as the screen they come from.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Payments export CSV: date, receipt, customer, invoice numbers, mode, amount, TDS, reference, deposit account, status; filtered rows; large sets run in background."]}
- {"id": "A252", "text": "Exports prefix cells starting with =, +, - or @ with a single quote, and imports save such cells as text, so customer names cannot run formulas in Excel.", "d": "now", "at": [], "why": "", "src": "https://owasp.org/www-community/attacks/CSV_Injection", "area": "move", "also": ["An uploaded CSV for import is scanned for formula injection (cells starting with = + - @) and such cells are saved as text.", "The CSV export escapes cells starting with = + - @ by prefixing a single quote so spreadsheets never run client-entered text as a formula."]}
- {"id": "A253", "text": "Full firm export is one zip with CSVs of every object, all PDFs, and a read-me with field meanings; it works in read-only state.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["A backup of all data is a single compressed file of CSVs, link emailed, expires in 30 days, and one backup per 15 days.", "Owner who wants to leave gets Download everything in one tap: all invoices as PDF, registers as CSV, customers and payments, in one zip emailed as a link.", "Full-firm export is a zip with CSV of every object, PDFs of issued documents and attachments, plus a readme listing columns; owner only.", "Customer export CSV has name, type, GSTIN, state, address, contact email, phone, terms, outstanding, tags, archived, custom fields.", "move: customer export CSV (deferred)", "move: full firm data export (deferred)"]}
- {"id": "A254", "text": "Export is available after cancellation and during grace; requesting data export is never blocked by plan or unpaid dues.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["Complaint pattern: a licence change made users feel locked in; a full export in CSV and JSON stays available in every plan state.", "The leave-and-export zip needs no payment, no call and no waiting for sales, and arrives within 15 minutes for a firm with 5,000 invoices."]}
- {"id": "A255", "text": "DPDP erasure request on a customer contact removes name, email and phone from the contact but keeps financial records the law requires.", "d": "now", "at": [], "why": "", "src": "https://www.meity.gov.in", "area": "move", "also": ["Firm settings show what personal data is held about customers and let the owner correct or erase a person's contact data on request, with the action logged."]}
- {"id": "A256", "text": "Firm deletion is owner-only with typed firm name, a 30-day cooling period and a final export link; books are kept at least 8 years (GST law needs 72 months after the annual return), then may be removed.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter8/section36_v1.00.html", "area": "move", "also": ["Deleting a firm by the owner deletes personal data not needed by law (user phones, notes) within 30 days but keeps invoices and tax data for the 6-year period.", "Firm closure: owner requests it, gets a full export, sees a 30-day grace window to cancel, and records are kept readable by the owner until the retention period ends.", "move: firm delete (deferred)"]}
- {"id": "A257", "text": "Departing user's access ends at once, their name stays on history, and drafts they own can be reassigned in one step.", "d": "now", "at": [], "why": "", "src": "judge", "area": "move", "also": ["move: user leaves -> deactivate, history keeps name"]}
- {"id": "A258", "text": "Merge two customers moves invoices, payments, credit notes and credit balance to the kept one and leaves old snapshots unchanged.", "d": "later", "at": [], "why": "merge needs careful money moves", "src": "judge", "area": "move", "also": ["Merge two customers: pick the survivor, preview what moves, documents keep their issue-time snapshot, and the loser stays as a redirect; different GSTINs need a confirm.", "move: customer merge (deferred)", "customer: merge (deferred)"]}
- {"id": "A259", "text": "Bulk upload of payments from a bank statement CSV matches rows to invoices by amount and reference and shows unmatched rows for manual choice.", "d": "room", "at": [], "why": "", "src": "judge", "area": "move", "also": []}
- {"id": "A260", "text": "Bank statement matching suggests but never auto-records; the user confirms each batch.", "d": "room", "at": [], "why": "", "src": "judge", "area": "move", "also": []}
- {"id": "A263", "text": "A firm changing its legal name or address records an effective date; documents on or after it show the new details.", "d": "later", "at": [], "why": "legal-name history is rare", "src": "judge", "area": "move", "also": []}
- {"id": "B002", "text": "Dashboard shows total invoiced and total received for the current financial year; each figure opens its own report on tap.", "d": "later", "at": [], "why": "financial-year totals are a second row", "src": "https://www.zoho.com/in/invoice/help/dashboard/index.html", "area": "home", "also": []}
- {"id": "B003", "text": "Dashboard period switch offers this month, last quarter, this financial year and custom range, and keeps the last choice per user.", "d": "later", "at": [], "why": "dashboard period memory is polish", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "home", "also": []}
- {"id": "B004", "text": "Dashboard lists expected receipts in buckets 0-15, 16-30, 31-45 and above 45 days from today, per customer.", "d": "later", "at": [], "why": "expected-receipts buckets need history", "src": "https://www.zoho.com/in/invoice/help/reports/payments-received-reports.html", "area": "home", "also": []}
- {"id": "B005", "text": "A staff user without report rights sees a dashboard with no revenue totals, and those figures are not fetched by the page at all.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/users.html", "area": "home", "also": []}
- {"id": "B006", "text": "Invoice list has a quick filter for invoices the customer has opened, separate from sent, partially paid and overdue.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/invoice/more-with-invoice.html", "area": "views", "also": []}
- {"id": "B007", "text": "A filtered and sorted invoice list can be saved as a named custom view and reopened in one tap.", "d": "no", "at": [], "why": "filters cover small firms", "src": "https://www.zoho.com/in/invoice/help/invoice/more-with-invoice.html", "area": "views", "also": []}
- {"id": "B008", "text": "A report preview has a text box over each column that filters rows live, and the CSV button then exports only the visible rows.", "d": "later", "at": [], "why": "live column filters on reports", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "views", "also": []}
- {"id": "B009", "text": "Keyboard shortcuts exist for new transaction, and for email, print and download of all selected rows in the list.", "d": "no", "at": [], "why": "tap-first product skips keyboard shortcuts", "src": "https://www.zoho.com/in/invoice/help/getting-started/keyboard-shortcuts.html", "area": "quick_entry", "also": []}
- {"id": "B010", "text": "The send-email dialog accepts extra To, Cc and Bcc addresses for that one send without editing the customer record.", "d": "now", "at": [], "why": "", "src": "https://github.com/invoiceninja/invoiceninja/issues/1880", "area": "quick_entry", "also": []}
- {"id": "B011", "text": "A dry-run preview of an invoice shows final PDF, totals and number format without consuming an invoice number.", "d": "now", "at": [], "why": "", "src": "https://github.com/getlago/lago/issues/52", "area": "quick_entry", "also": ["Invoice screen shows live a plain preview of the final PDF without leaving the form, reachable in one tap.", "Preview shows exactly how the client will see the invoice page and email, in desktop and phone widths, before issue."]}
- {"id": "B012", "text": "One bulk action sets TDS on only the ticked lines of an invoice, so the user need not untick each line.", "d": "no", "at": [], "why": "TDS stays a payment figure", "src": "https://www.zoho.com/in/invoice/help/settings/gst-tds.html", "area": "quick_entry", "also": []}
- {"id": "B013", "text": "An issued invoice can be scheduled to email at an exact date and time chosen by the user, for example 9 am next morning.", "d": "later", "at": [], "why": "timed sending is extra", "src": "https://github.com/invoiceninja/invoiceninja/issues/1759", "area": "quick_entry", "also": ["Quote email can be scheduled for a chosen date and time; scheduled sends are listed and can be cancelled before they go.", "Schedule send: choose date and time to email an issued invoice; scheduled sends appear in outbox and can be cancelled."]}
- {"id": "B014", "text": "After saving an invoice the user can stay on a blank new invoice for the same customer, to enter several milestone invoices in a row.", "d": "no", "at": [], "why": "repeat entry rarely matters", "src": "https://www.zoho.com/in/invoice/help/invoice/new-invoice.html", "area": "quick_entry", "also": []}
- {"id": "B016", "text": "Recurring setting chooses create as draft or create and send, at firm level, and each recurring profile may override it.", "d": "later", "at": [], "why": "auto-send waits for review habit", "src": "https://www.zoho.com/in/invoice/help/recurring-invoice/recurring-invoice-preferences.html", "area": "modes", "also": []}
- {"id": "B017", "text": "Repeated CSV import column mappings can be saved as a named template and picked from a dropdown on the next import.", "d": "later", "at": [], "why": "saved mappings serve repeat imports", "src": "https://docs.invoiceninja.com/docs/advanced-topics/import-and-export", "area": "favourites", "also": []}
- {"id": "B018", "text": "One search key focuses the search box from any page; results group by module and an advanced search can narrow by field.", "d": "later", "at": [], "why": "global search is extra", "src": "https://www.zoho.com/in/invoice/help/getting-started/keyboard-shortcuts.html", "area": "search_all", "also": []}
- {"id": "B019", "text": "Shift plus question mark opens a popup listing every shortcut, and the same list opens from the help menu.", "d": "no", "at": [], "why": "no shortcuts to list", "src": "https://www.zoho.com/in/invoice/help/getting-started/keyboard-shortcuts.html", "area": "keyboard", "also": []}
- {"id": "B020", "text": "Go-to keys jump to the invoices, estimates and credit notes lists, and other keys open settings and the firm switcher.", "d": "no", "at": [], "why": "no go-to keys offered", "src": "https://www.zoho.com/in/invoice/help/getting-started/keyboard-shortcuts.html", "area": "keyboard", "also": []}
- {"id": "B021", "text": "Keys select all rows, and select a range between two rows, to feed bulk email or download.", "d": "no", "at": [], "why": "no range keys offered", "src": "https://www.zoho.com/in/invoice/help/getting-started/keyboard-shortcuts.html", "area": "keyboard", "also": []}
- {"id": "B023", "text": "Due dates and reminder offsets count calendar days; the product never shifts them for Sundays or bank holidays.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "time_off", "also": []}
- {"id": "B024", "text": "A sales-by-user report totals invoice count, amount and tax per creating user; invoices with no assigned user count for nobody and say so.", "d": "later", "at": [], "why": "per-user sales report is team-size feature", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "teams", "also": []}
- {"id": "B025", "text": "Custom roles are not offered; the Users page says roles are fixed and lists exactly what each of the four roles (owner, accountant, staff, viewer) can do.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/users.html", "area": "custom_roles", "also": []}
- {"id": "B026", "text": "Request pattern: a permissions grid with View, Create, Edit per category appears when the administrator switch is off.", "d": "no", "at": [], "why": "roles are fixed", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "custom_roles", "also": []}
- {"id": "B028", "text": "The user who created the firm is marked super owner; only that user can delete the firm, and transfer needs another active owner.", "d": "no", "at": [], "why": "owner-only deletion already covers it", "src": "https://www.zoho.com/in/invoice/help/settings/users.html", "area": "custom_roles", "also": []}
- {"id": "B029", "text": "The portal sign-in for a firm's customers can require a one-time code as a second step, switched by the firm.", "d": "later", "at": [], "why": "customer portal sign-in not built", "src": "https://github.com/invoiceninja/invoiceninja/issues/8319", "area": "signin_company", "also": []}
- {"id": "B030", "text": "Users can sign in with a passkey or a second factor, and the owner can require it for every user of the firm.", "d": "later", "at": [], "why": "passkeys after TOTP", "src": "https://github.com/invoiceninja/invoiceninja/issues/10967", "area": "signin_company", "also": []}
- {"id": "B031", "text": "Users can sign in with a Google or Microsoft account, and the owner can turn password sign-in off for the firm.", "d": "later", "at": [], "why": "social sign-in after password login", "src": "https://github.com/invoiceninja/invoiceninja/issues/10839", "area": "signin_company", "also": []}
- {"id": "B033", "text": "Each user picks own language, date format and number format; the invoice PDF follows the firm setting, not the viewer's.", "d": "no", "at": [], "why": "one language per firm is enough", "src": "https://docs.invoiceninja.com/docs/user-guide/basic-settings", "area": "preferences", "also": []}
- {"id": "B034", "text": "Firm setting for first month of the year anchors annual reports; India default is April and the setting shows the resulting financial year.", "d": "no", "at": [], "why": "Indian financial year is fixed April to March", "src": "https://docs.invoiceninja.com/docs/user-guide/basic-settings", "area": "preferences", "also": []}
- {"id": "B035", "text": "Company number format decides how imported amounts parse, comma or full stop as decimal, and the import preview shows the parsed result.", "d": "no", "at": [], "why": "Indian number formats only", "src": "https://docs.invoiceninja.com/docs/advanced-topics/import-and-export", "area": "preferences", "also": []}
- {"id": "B037", "text": "Two logo variants, one for white backgrounds and one for the coloured header bar, can be uploaded.", "d": "no", "at": [], "why": "one logo covers it", "src": "https://github.com/invoiceninja/invoiceninja/issues/5140", "area": "branding", "also": []}
- {"id": "B038", "text": "One brand colour setting applies to emails, the shared invoice page and PDFs.", "d": "now", "at": [], "why": "", "src": "https://docs.stripe.com/invoicing/customize", "area": "branding", "also": []}
- {"id": "B039", "text": "The downloaded invoice file name follows a pattern the firm sets, such as number plus customer name.", "d": "no", "at": [], "why": "file name stays fixed", "src": "https://github.com/invoiceninja/invoiceninja/issues/7119", "area": "branding", "also": []}
- {"id": "B041", "text": "The customer portal can run on the firm's own domain, with the firm's own sender address on invoice emails.", "d": "later", "at": [], "why": "custom domain is a paid extra", "src": "https://docs.invoiceninja.com/docs/hosted/hosted-custom-domain", "area": "branding", "also": []}
- {"id": "B042", "text": "The template gallery offers three style families (plain, standard, modern), all passing GST rules; switching never changes a figure, and editing a template changes only documents issued afterwards, since issued documents keep the template they were first printed with.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/invoice/more-with-invoice.html", "area": "templates", "also": ["Invoice templates number three at most (plain, standard, modern), all pass GST rules, and switching template never changes any figure."]}
- {"id": "B043", "text": "Invoice, credit note, payment receipt and email each have their own template, each editable, with one marked default.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/features/", "area": "templates", "also": []}
- {"id": "B044", "text": "Templates include multi-logo and multi-address variants for firms invoicing from more than one branch.", "d": "later", "at": [], "why": "multi-branch variants follow multi GSTIN", "src": "https://tallysolutions.com/tally-prime/", "area": "templates", "also": []}
- {"id": "B045", "text": "Email subject and body for invoice, receipt, credit note, quote and three reminders accept merge tags for number, amount and view link, with a live preview.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "templates", "also": ["Email templates per message type (invoice, reminder, receipt, credit note, quote) accept variables customer_name, invoice_number, amount_due, due_date, link."]}
- {"id": "B047", "text": "Line items can be grouped under a titled group that shows only the group subtotal on the PDF.", "d": "no", "at": [], "why": "line groups clutter small invoices", "src": "https://github.com/invoiceninja/invoiceninja/issues/2719", "area": "templates", "also": []}
- {"id": "B048", "text": "Reminders can run before due date, after due date or after invoice date, in up to three tiers plus an endless repeat with its own frequency.", "d": "later", "at": [], "why": "tier setup beyond fixed 1, 7, 15", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "automation", "also": []}
- {"id": "B049", "text": "Reminders can key off the expected payment date as well as the due date, with three preloaded reminder rules.", "d": "later", "at": [], "why": "expected-date rules are an extra", "src": "https://www.zoho.com/in/invoice/help/settings/reminders.html", "area": "automation", "also": []}
- {"id": "B050", "text": "A late fee added by a reminder appears as its own invoice line or note, never silently inside the balance, with consent text.", "d": "later", "at": [], "why": "late fee by reminder needs consent text", "src": "https://github.com/invoiceninja/invoiceninja/issues/11118", "area": "automation", "also": []}
- {"id": "B051", "text": "A thank-you note with the receipt is sent automatically when a customer pays online, and the owner gets a notice.", "d": "later", "at": [], "why": "thank-you note follows online payments", "src": "https://www.zoho.com/in/invoice/help/invoice/invoice-preferences.html", "area": "automation", "also": []}
- {"id": "B052", "text": "Manual reminders exist separately from automatic ones, with their own editable text for overdue and for sent-not-yet-due invoices.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/reminders.html", "area": "automation", "also": ["Send reminder now on an invoice or on selected overdue invoices; each send is logged on the invoice and shows in the outbox."]}
- {"id": "B053", "text": "Recurring invoices can auto-apply excess payments and open credit notes of the same customer when they are created.", "d": "later", "at": [], "why": "credit auto-apply is automation extra", "src": "https://www.zoho.com/in/invoice/help/recurring-invoice/recurring-invoice-preferences.html", "area": "automation", "also": []}
- {"id": "B054", "text": "A recurring profile shows next send date, frequency, remaining cycles and status on one summary tab, and a schedule tab lists upcoming dates with due dates.", "d": "no", "at": [], "why": "summary tabs add nothing", "src": "https://docs.invoiceninja.com/docs/user-guide/recurring-invoices", "area": "recurring", "also": []}
- {"id": "B057", "text": "One customer's several monthly profiles can merge into a single invoice on the same day.", "d": "no", "at": [], "why": "separate invoices read clearer", "src": "https://github.com/invoiceninja/invoiceninja/issues/10023", "area": "recurring", "also": []}
- {"id": "B059", "text": "An invoice can be scheduled to be created and sent on a future date as a one-off, separate from repeating profiles.", "d": "no", "at": [], "why": "same as timed sending", "src": "https://www.zoho.com/in/invoice/features/", "area": "recurring", "also": []}
- {"id": "B060", "text": "Aging summary buckets unpaid balances per customer into not yet due, 0-30, 31-60, 61-90 and over 90 days past due date, and each figure opens the invoices behind it.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/reports/receivable.html", "area": "reports", "also": ["Aged receivables report buckets balances by 0-30, 31-60, 61-90 and over 90 days past due, per customer, and each figure drills into the invoice list."]}
- {"id": "B061", "text": "Aging detail lists each unpaid invoice and open credit note with customer and balance, sorted by days overdue.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/reports/receivable.html", "area": "reports", "also": []}
- {"id": "B062", "text": "Sales by customer shows invoiced total per customer for a date range, switchable between invoices only, credit notes only or both.", "d": "later", "at": [], "why": "sales by customer is secondary report", "src": "https://www.zoho.com/in/invoice/help/reports/sales.html", "area": "reports", "also": ["Sales report groups taxable value by customer, item or month with period presets (this month, quarter, financial year, custom) and previous-period comparison."]}
- {"id": "B063", "text": "Sales by item or service shows quantity and amount per saved service or SAC code for any range.", "d": "later", "at": [], "why": "item-wise sales is secondary report", "src": "https://www.zoho.com/in/invoice/help/reports/sales.html", "area": "reports", "also": []}
- {"id": "B064", "text": "A payments-received report lists date, customer, invoice, mode, amount and TDS for a range, with refunds in a separate report.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/reports/payments-received-reports.html", "area": "reports", "also": []}
- {"id": "B065", "text": "A refund history report lists each refund by customer, date, amount and mode, apart from the payments received report.", "d": "later", "at": [], "why": "refunds report follows refund tracking", "src": "https://www.zoho.com/in/invoice/help/reports/payments-received-reports.html", "area": "reports", "also": []}
- {"id": "B067", "text": "A customer balance report shows per customer invoices, credits, payments and balance right now.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "reports", "also": ["Outstanding by customer report sorts by balance, shows oldest due date, and totals; export keeps the sort."]}
- {"id": "B068", "text": "Every report has a date-range preset and a customer filter, and exports exactly what is shown.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "reports", "also": []}
- {"id": "B069", "text": "Reports leave voided invoices out of totals, a switch lists them as marked rows so numbers reconcile, and the documents-issued summary always counts them as cancelled.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "reports", "also": []}
- {"id": "B071", "text": "System mail report lists every email sent by the firm's account with type, recipient, time and status.", "d": "no", "at": [], "why": "the outbox already lists mail", "src": "https://www.zoho.com/in/invoice/help/reports/activity.html", "area": "reports", "also": []}
- {"id": "B072", "text": "A portal activity report lists when each customer opened, viewed or paid, by time.", "d": "later", "at": [], "why": "portal activity needs a portal", "src": "https://www.zoho.com/in/invoice/help/reports/activity.html", "area": "reports", "also": []}
- {"id": "B074", "text": "An aging report, a statement or a sales report can be scheduled by email weekly, monthly or custom, to chosen addresses.", "d": "later", "at": [], "why": "scheduled reports are automation extra", "src": "https://docs.invoiceninja.com/docs/advanced-topics/schedules", "area": "scheduled_report", "also": []}
- {"id": "B075", "text": "A report run can be emailed to the logged-in user as an attachment instead of downloaded, and optionally with attached documents zipped.", "d": "later", "at": [], "why": "emailed reports are automation extra", "src": "https://docs.invoiceninja.com/docs/user-guide/reports", "area": "scheduled_report", "also": []}
- {"id": "B077", "text": "The hosted invoice page offers every enabled pay method in one place: UPI, card, net banking.", "d": "later", "at": [], "why": "pay methods follow the gateway", "src": "https://www.zoho.com/in/invoice/pricing/", "area": "public_page", "also": []}
- {"id": "B079", "text": "An owner can mark an invoice un-viewed again so the next customer view is tracked afresh.", "d": "no", "at": [], "why": "viewed flag must stay truthful", "src": "https://github.com/invoiceninja/invoiceninja/issues/7496", "area": "public_page", "also": []}
- {"id": "B080", "text": "A portal lets each customer see invoices, payments, credit notes and download a statement for any date range they choose.", "d": "now", "at": [], "why": "", "src": "https://docs.invoiceninja.com/docs/user-guide/client-portal", "area": "portal", "also": []}
- {"id": "B081", "text": "The client page is switched on per customer, with one password for that customer; the owner or accountant turns it on or off for each customer, never for all customers at once.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/customer-portal/index.html", "area": "portal", "also": []}
- {"id": "B082", "text": "Portal settings include welcome message, whether customers may edit their address and contacts, and whether they may forward documents.", "d": "later", "at": [], "why": "portal settings follow portal", "src": "https://www.zoho.com/in/invoice/help/customer-portal/index.html", "area": "portal", "also": []}
- {"id": "B083", "text": "A customer can pay money on account without picking an invoice; it lands as an unapplied payment the firm applies later.", "d": "later", "at": [], "why": "portal payments follow portal", "src": "https://docs.invoiceninja.com/docs/user-guide/client-portal", "area": "portal", "also": []}
- {"id": "B084", "text": "The owner is told by email when a customer opens an invoice or pays through the portal, if that notice is switched on.", "d": "later", "at": [], "why": "portal notices follow portal", "src": "https://www.zoho.com/in/invoice/help/customer-portal/index.html", "area": "portal", "also": []}
- {"id": "B085", "text": "Portal colours can be set by the firm, with a contrast check warning before save.", "d": "no", "at": [], "why": "portal colours need a portal", "src": "https://docs.invoiceninja.com/docs/user-guide/client-portal", "area": "portal", "also": []}
- {"id": "B086", "text": "The phone app is an installable web app; recent invoices, customers and drafts open readable with no network, and issuing needs the network.", "d": "now", "at": [], "why": "", "src": "https://vyaparapp.in/", "area": "phone_app", "also": ["Review pattern: mobile and desktop edits sync both ways without date or setting drift.", "The app is installable as a home-screen app (PWA) and the invoice list, customers and drafts open with no network from cache.", "Issuing an invoice needs the network; with none, Issue is disabled and the screen says \"Connect to issue; your draft is safe\"."]}
- {"id": "B087", "text": "Sharing an invoice from the phone to WhatsApp attaches a real, non-empty PDF or its share link; a blank file counts as a failure.", "d": "now", "at": [], "why": "", "src": "https://www.capterra.in/reviews/180579/vyapar", "area": "phone_app", "also": ["A blank attachment on a WhatsApp send must not happen; the product checks the file is non-empty before sending."]}
- {"id": "B091", "text": "Tally data can be imported into the product at first sign-up so old customers and invoices come across.", "d": "later", "at": [], "why": "Tally import is a migration extra", "src": "https://vyaparapp.in/", "area": "external_sync", "also": []}
- {"id": "B092", "text": "AI can read a PDF or photo of a purchase order and prefill customer, lines and amounts; the user reviews before issue.", "d": "no", "at": [], "why": "PO photos are not service work", "src": "https://tallysolutions.com/tally-prime/", "area": "ai", "also": []}
- {"id": "B093", "text": "AI answers questions such as who owes me most from the user's own data; answers cite the report they came from.", "d": "no", "at": [], "why": "reports already answer these", "src": "https://www.freshbooks.com/pricing", "area": "ai", "also": []}
- {"id": "B094", "text": "An MCP server or API lets an AI assistant read invoices only, with scoped keys the owner can revoke.", "d": "later", "at": [], "why": "assistant access follows the API", "src": "https://github.com/invoiceninja/invoiceninja/issues/11843", "area": "ai", "also": []}
- {"id": "B095", "text": "Invoices can be issued in the customer's language from 10 or more languages while the firm's screens stay in its own.", "d": "no", "at": [], "why": "English and Hindi are enough", "src": "https://www.zoho.com/in/invoice/features/", "area": "languages", "also": []}
- {"id": "B096", "text": "The app UI supports nine or more Indian languages including Hindi, Tamil and Bengali; numbers keep Indian grouping.", "d": "no", "at": [], "why": "nine languages exceed small-firm need", "src": "https://vyaparapp.in/", "area": "languages", "also": []}
- {"id": "B097", "text": "Amount in words follows the invoice language, and rupee and paise words are correct for numbers above one crore.", "d": "no", "at": [], "why": "depends on B095", "src": "https://www.zoho.com/in/invoice/help/invoice/new-invoice.html", "area": "languages", "also": []}
- {"id": "B098", "text": "Custom labels let a firm rename built-in words such as Item to Service or Customer to Client on its documents.", "d": "no", "at": [], "why": "renamed labels confuse accountants", "src": "https://docs.invoiceninja.com/docs/user-guide/basic-settings", "area": "languages", "also": []}
- {"id": "B100", "text": "A plan covers one business; adding a second business needs an upgrade, and the price page says so.", "d": "now", "at": [], "why": "", "src": "https://mybillbook.in/pricing", "area": "many_companies", "also": []}
- {"id": "B104", "text": "Every export and every PII-including backup is logged with user and time.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/backup-your-data.html", "area": "audit_all", "also": ["Every export writes a history entry with who, what object, filters, row count and time; viewers cannot run any export.", "export: audit of who exported (history)"]}
- {"id": "B108", "text": "CSV and XLSX files import with a choice of character encoding and field mapping, and a sample file is downloadable.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/import-export/index.html", "area": "import_all", "also": ["Sample template downloads for each object show the columns, an example row and the allowed values for lists."]}
- {"id": "B110", "text": "Import accepts a status value per row (draft, sent, paid) and an optional paid amount column, so history can arrive already settled.", "d": "later", "at": [], "why": "paid-history import is a second step", "src": "https://docs.invoiceninja.com/docs/advanced-topics/import-and-export", "area": "import_all", "also": []}
- {"id": "B111", "text": "The import result is emailed with counts of created and rejected rows and the reason for each rejected row.", "d": "no", "at": [], "why": "the result screen is enough", "src": "https://docs.invoiceninja.com/docs/advanced-topics/import-and-export", "area": "import_all", "also": []}
- {"id": "B112", "text": "A migration guide lists steps in order: firm profile, taxes, customers, items, then invoices and payments.", "d": "no", "at": [], "why": "the checklist replaces a guide", "src": "https://www.zoho.com/in/invoice/help/migration-guide/index.html", "area": "import_all", "also": []}
- {"id": "B113", "text": "Bank statement CSV imports map date, description and amount columns, and rows can be matched to invoices afterwards.", "d": "later", "at": [], "why": "statement import is bank matching", "src": "https://docs.invoiceninja.com/docs/user-guide/banking", "area": "import_all", "also": []}
- {"id": "B114", "text": "Request: payments can be imported from a CSV, not only invoices.", "d": "later", "at": [], "why": "payment import follows invoice import", "src": "https://github.com/invoiceninja/invoiceninja/issues/2534", "area": "import_all", "also": ["Import payments CSV matches rows to invoices by invoice number, else customer and amount; unmatched or over-balance rows go to an error file; duplicates follow the existing guard."]}
- {"id": "B115", "text": "Tally customers, items and open bills import from a Tally export, and fields that cannot map are listed in a report.", "d": "later", "at": [], "why": "Tally open bills import is migration extra", "src": "https://vyaparapp.in/", "area": "import_all", "also": []}
- {"id": "B116", "text": "A demo account with sample data opens before sign-up, and a button clears every sample record in one step.", "d": "no", "at": [], "why": "demo data is marketing", "src": "https://www.zoho.com/in/invoice/pricing/", "area": "demo", "also": []}
- {"id": "B117", "text": "Help lives inside the app, with email support hours stated; Zoho states 24/5 free email support on its India plan.", "d": "later", "at": [], "why": "help centre comes with launch content", "src": "https://www.zoho.com/in/invoice/pricing/", "area": "help", "also": []}
- {"id": "B118", "text": "Review pattern: support must solve a problem on first call; a customer reported two hour-long phone calls without a fix.", "d": "no", "at": [], "why": "support quality is not a feature", "src": "https://www.capterra.in/reviews/180579/vyapar", "area": "help", "also": []}
- {"id": "B119", "text": "A what's new page lists each release in plain words, and errors link to a help article.", "d": "no", "at": [], "why": "a changelog is marketing", "src": "https://github.com/resilient-tech/india-compliance/releases", "area": "help", "also": []}
- {"id": "B120", "text": "Error codes shown to customers on payment failure map to a plain action, for example customer deleted or merchant not enabled.", "d": "later", "at": [], "why": "gateway errors follow gateway", "src": "https://www.zoho.com/in/invoice/help/invoice/troubleshoot-guide.html", "area": "help", "also": []}
- {"id": "B121", "text": "The free plan allows a stated number of issued invoices per month, shown on the plan page and in the limit message.", "d": "now", "at": [], "why": "", "src": "https://refrens.com/pricing", "area": "plans", "also": []}
- {"id": "B123", "text": "Plans state their limits in users and issued invoices per firm; every paid plan includes one accountant seat that does not count as a user.", "d": "now", "at": [], "why": "", "src": "https://mybillbook.in/pricing", "area": "plans", "also": ["Zoho's India invoicing is free forever but limits an account to two users; the plan page states the user limit.", "Each paid plan includes one accountant seat that does not count in the user limit.", "The plan page states plainly whether the accountant seat costs extra; FreshBooks shows a per-user monthly price beside its accountant-access line.", "Plans page shows Free, Pro with limits (invoices per month, users, e-invoices) and what changes on upgrade."]}
- {"id": "B124", "text": "Inactive free accounts have a stated retention period, and an email arrives before data is removed.", "d": "no", "at": [], "why": "books are never removed for inactivity", "src": "https://www.zoho.com/in/invoice/pricing/", "area": "plans", "also": []}
- {"id": "B125", "text": "A setting group Taxes holds GST settings, TDS settings and MSME settings as separate switches.", "d": "no", "at": [], "why": "settings already group sensibly", "src": "https://www.zoho.com/in/invoice/help/settings/taxes.html", "area": "admin_settings", "also": []}
- {"id": "B126", "text": "Account page lists enabled modules so a firm can switch off those it does not use, such as quotes.", "d": "no", "at": [], "why": "unused modules just stay quiet", "src": "https://docs.invoiceninja.com/docs/user-guide/basic-settings", "area": "admin_settings", "also": []}
- {"id": "B127", "text": "Settings change history is searchable: setting name, old and new value, user and time.", "d": "no", "at": [], "why": "the audit log shows setting changes", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "admin_settings", "also": []}
- {"id": "B128", "text": "Group settings let a firm define different defaults for a group of customers, for example export clients versus domestic.", "d": "no", "at": [], "why": "customer groups are too heavy", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "admin_settings", "also": []}
- {"id": "B129", "text": "Numbering pattern variables include year, counter and customer fields, with a live example, and can be overridden per group or customer.", "d": "no", "at": [], "why": "number format is fixed by GST rules", "src": "https://docs.invoiceninja.com/docs/user-guide/advanced-settings", "area": "admin_settings", "also": []}
- {"id": "B130", "text": "Custom fields can be marked personal data and encrypted; only admins can view them and others cannot export them.", "d": "later", "at": [], "why": "custom fields wait for demand", "src": "https://www.zoho.com/in/invoice/help/settings/privacy.html", "area": "privacy", "also": []}
- {"id": "B132", "text": "Backup and export dialogs have an explicit tick for including personal data such as bank account numbers.", "d": "no", "at": [], "why": "an export tick is needless", "src": "https://www.zoho.com/in/invoice/help/settings/backup-your-data.html", "area": "privacy", "also": []}
- {"id": "B133", "text": "A user can export all their data and ask for deletion; the product states which records must stay under tax law.", "d": "later", "at": [], "why": "own-data request handled by support first", "src": "https://docs.invoiceninja.com/docs/legal/gdpr", "area": "privacy", "also": ["DPDP: a person can ask which of their data the product holds; the firm gets a Data request screen and answers within 30 days, with the actions logged."]}
- {"id": "B134", "text": "A payment link carries an expiry date; after it the link shows expired and cannot be paid, and the invoice stays payable another way.", "d": "later", "at": [], "why": "link expiry follows payment links", "src": "https://razorpay.com/docs/payments/payment-links/", "area": "payment_links", "also": []}
- {"id": "B135", "text": "A payment link can allow partial payment with a minimum first amount, and each part shows on the invoice as its own payment.", "d": "later", "at": [], "why": "part payment links follow gateway", "src": "https://razorpay.com/docs/payments/payment-links/", "area": "payment_links", "also": []}
- {"id": "B136", "text": "A payment link can send reminders before expiry by email and SMS to the customer.", "d": "later", "at": [], "why": "link reminders follow gateway", "src": "https://razorpay.com/docs/payments/payment-links/", "area": "payment_links", "also": []}
- {"id": "B137", "text": "Request pattern: Razorpay as a built-in gateway for Indian firms; its absence was a 15-reaction request in a global tool.", "d": "later", "at": [], "why": "gateway choice waits for owner", "src": "https://github.com/invoiceninja/invoiceninja/issues/2665", "area": "payment_links", "also": []}
- {"id": "B139", "text": "Gateway charges are the firm's own; the connect page states that, and notes input tax credit on the fee may apply.", "d": "later", "at": [], "why": "fee notes follow gateway", "src": "https://www.zoho.com/in/invoice/help/online-payments/razorpay.html", "area": "payment_links", "also": []}
- {"id": "B140", "text": "Any fee the product keeps on online payments is shown to the firm in rupees before the option is switched on.", "d": "later", "at": [], "why": "fee display follows gateway", "src": "https://refrens.com/pricing", "area": "payment_links", "also": []}
- {"id": "B141", "text": "A payment can record a bank or card fee so net money received differs from the amount settled against the invoice.", "d": "later", "at": [], "why": "gateway fee split follows gateway", "src": "https://github.com/invoiceninja/invoiceninja/issues/7788", "area": "payment_links", "also": []}
- {"id": "B142", "text": "The payment page offers more than one gateway and the firm sets their order; one gateway failing leaves the others usable.", "d": "no", "at": [], "why": "one gateway is enough", "src": "https://github.com/resilient-tech/india-compliance/releases", "area": "payment_links", "also": []}
- {"id": "B143", "text": "When an online payment fails, the customer gets an email with the same link and the firm sees the failure on the invoice.", "d": "later", "at": [], "why": "failed-payment mails follow gateway", "src": "https://docs.stripe.com/invoicing/automatic-collection", "area": "payment_links", "also": []}
- {"id": "B144", "text": "A standalone payment link, not tied to an invoice, can be created for a fixed amount and is switched on in settings.", "d": "later", "at": [], "why": "standalone links follow gateway", "src": "https://www.zoho.com/in/invoice/help/payment-links/basic-functions.html", "area": "payment_links", "also": []}
- {"id": "B145", "text": "Imported bank lines move through three states: unmatched, matched to an invoice, and converted into a payment.", "d": "later", "at": [], "why": "bank matching is not in launch", "src": "https://docs.invoiceninja.com/docs/user-guide/banking", "area": "bank_match", "also": []}
- {"id": "B146", "text": "A rule matches incoming money by description text and amount to an invoice, and may convert it into a payment without a click.", "d": "later", "at": [], "why": "auto-match rules are risky early", "src": "https://docs.invoiceninja.com/docs/user-guide/banking", "area": "bank_match", "also": []}
- {"id": "B147", "text": "Deleting an imported bank line never deletes the payment created from it.", "d": "later", "at": [], "why": "bank lines follow bank matching", "src": "https://docs.invoiceninja.com/docs/user-guide/banking", "area": "bank_match", "also": []}
- {"id": "B148", "text": "Request: bank reconciliation linking bank records to invoices and payments, which 18 users asked for in a global tool.", "d": "later", "at": [], "why": "reconciliation is its own module", "src": "https://github.com/invoiceninja/invoiceninja/issues/2481", "area": "bank_match", "also": []}
- {"id": "B149", "text": "Bank statement import accepts CSV and XLS of the formats Indian banks export, and lists lines it could not parse.", "d": "later", "at": [], "why": "statement formats need samples", "src": "https://github.com/invoiceninja/invoiceninja/issues/2295", "area": "bank_match", "also": []}
- {"id": "B150", "text": "Tally can read bank statement PDFs and match them with documents; a statement upload can show suggested invoice matches.", "d": "no", "at": [], "why": "PDF statements are too fragile", "src": "https://tallysolutions.com/tally-prime/", "area": "bank_match", "also": []}
- {"id": "B151", "text": "Request: bank integrations through third-party connectors, shown as a pick-list of banks and aggregators.", "d": "no", "at": [], "why": "bank connectors cost too much", "src": "https://github.com/frappe/erpnext/issues/35455", "area": "bank_match", "also": []}
- {"id": "B152", "text": "For one period the documents-issued summary, the outward summary and the HSN summary carry the same taxable total; any rupee mismatch shows as an error listing the invoices that differ.", "d": "now", "at": [], "why": "", "src": "https://github.com/resilient-tech/india-compliance/issues/3357", "area": "gst_returns", "also": ["HSN summary taxable total matches the sum of the B2B and B2C tables for the same period, or the screen lists the invoices that differ."]}
- {"id": "B156", "text": "An error list names invoices that block a return, such as a missing HSN or SAC, with a link to fix each.", "d": "now", "at": [], "why": "", "src": "https://github.com/resilient-tech/india-compliance/issues/4865", "area": "gst_returns", "also": ["Before GSTR-1 export a check lists invoices with missing HSN, bad GSTIN or rate mismatch, each opening the invoice; export is allowed with a confirm."]}
- {"id": "B157", "text": "The 3B summary exports to Excel as well as PDF and JSON, because users add quarterly figures themselves.", "d": "later", "at": [], "why": "Excel export of 3B is convenience", "src": "https://github.com/resilient-tech/india-compliance/issues/362", "area": "gst_returns", "also": []}
- {"id": "B160", "text": "User can mark a period as filed with the filing date and ARN; editing a draft dated in that period then shows a warning.", "d": "later", "at": [], "why": "filed marks need lock rules", "src": "https://github.com/resilient-tech/india-compliance/issues/5134", "area": "gst_returns", "also": []}
- {"id": "B161", "text": "Marking a return unfiled inside the product does not change the GST portal, and the screen says so.", "d": "later", "at": [], "why": "filed marks follow B160", "src": "https://www.zoho.com/in/books/help/gst/gstr1-filing.html", "area": "gst_returns", "also": []}
- {"id": "B162", "text": "A debit note raising value after issue is listed with credit notes in the notes section of the GSTR-1 data.", "d": "later", "at": [], "why": "debit notes come later", "src": "https://github.com/resilient-tech/india-compliance/issues/1803", "area": "gst_returns", "also": []}
- {"id": "B163", "text": "Only GSTR-1 data is produced from invoices; GSTR-2 and 3 need purchases, so the screen says which returns it can help with.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/gst/gst-filing.html", "area": "gst_returns", "also": []}
- {"id": "B164", "text": "User can override transaction values, such as a place of supply, before generating the GST data for one document.", "d": "no", "at": [], "why": "manual overrides invite wrong tax", "src": "https://github.com/resilient-tech/india-compliance/issues/4225", "area": "gst_returns", "also": []}
- {"id": "B170", "text": "The payment form states in one line what TDS is and shows net money expected before saving.", "d": "now", "at": [], "why": "", "src": "https://www.g2.com/products/vyapar/reviews_and_filters", "area": "tds", "also": []}
- {"id": "B171", "text": "TDS can be applied on quotes, invoices, credit notes, recurring invoices and payments, and shows the same on each.", "d": "no", "at": [], "why": "TDS belongs to payments only", "src": "https://www.zoho.com/in/invoice/help/settings/taxes.html", "area": "tds", "also": []}
