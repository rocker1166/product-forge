- {"id": "B228", "text": "A payment can carry an attached proof file, such as a UPI screenshot or a cheque photo.", "d": "later", "at": [], "why": "proof files are convenience", "src": "https://github.com/frappe/erpnext/issues/49730", "area": "payments", "also": ["Proof file such as UPI screenshot or cheque image attaches to a payment, JPG PNG or PDF up to 5 MB."]}
