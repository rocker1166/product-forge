- {"id": "C113", "text": "Phone contacts picker adds a customer from the address book with name and number, after the user grants contacts permission once.", "d": "no", "at": [], "why": "contact picker is a gimmick", "src": "judge", "area": "flow", "also": []}
- {"id": "C114", "text": "Voice or typed quick entry: typing Rahul 15000 design opens a draft for client Rahul, amount 15000, description design, ready to review.", "d": "no", "at": [], "why": "typed parsing misleads", "src": "judge", "area": "flow", "also": []}
- {"id": "C115", "text": "Quick-entry misparse never issues anything; it only opens a draft that the user reviews before Issue.", "d": "no", "at": [], "why": "depends on C114", "src": "judge", "area": "flow", "also": []}
- {"id": "C121", "text": "Customer names with Indian-language characters search correctly by typing the Latin transliteration or the original script.", "d": "no", "at": [], "why": "transliteration search is unreliable", "src": "judge", "area": "flow", "also": []}
- {"id": "C123", "text": "Amounts read back in words (lakh, crore) beside the number field as the user types, so an extra zero is seen.", "d": "later", "at": [], "why": "live words beside amount", "src": "judge", "area": "flow", "also": []}
- {"id": "C124", "text": "The user can type 1.5L or 2k in an amount field and it becomes 150000 or 2000 shown back before saving.", "d": "no", "at": [], "why": "shorthand invites errors", "src": "judge", "area": "flow", "also": []}
- {"id": "C126", "text": "The app's screens are available in English and Hindi at launch and the language choice is saved per user.", "d": "later", "at": [], "why": "Hindi screens follow translations", "src": "judge", "area": "flow", "also": []}
- {"id": "C127", "text": "Help is one tap from every screen and opens a short answer in context, with a WhatsApp chat to a human within 4 working hours.", "d": "later", "at": [], "why": "in-app help follows content", "src": "judge", "area": "flow", "also": []}
- {"id": "C128", "text": "Support replies carry the firm's last 5 actions, visible to support only with the user's consent per request, so the user never needs to explain the screen.", "d": "later", "at": [], "why": "support context needs consent tooling", "src": "judge", "area": "flow", "also": []}
- {"id": "C129", "text": "The 15-minute grace Cancel never deletes the number; it marks it void so numbering stays continuous, and states this in the dialog.", "d": "no", "at": [], "why": "void already keeps the number", "src": "judge", "area": "flow", "also": []}
- {"id": "C131", "text": "A user who presses back after Issue lands on the invoice, never on the issued form with editable fields.", "d": "now", "at": [], "why": "", "src": "judge", "area": "flow", "also": []}
- {"id": "C133", "text": "Bank details printed on the invoice are entered once; a UPI ID or account number is verified with a one-rupee check or name match before first use.", "d": "no", "at": [], "why": "penny-drop checks cost money", "src": "judge", "area": "flow", "also": []}
- {"id": "C134", "text": "After a bank-detail change, all new invoices use the new details for 24 hours with a banner Bank details changed; clients opening old links see the details at issue time.", "d": "later", "at": [], "why": "changed-bank banner needs design", "src": "judge", "area": "attack", "also": []}
- {"id": "C136", "text": "Only an owner can change the firm's bank details or UPI ID, and every change emails all owners at once with the old and new last four digits.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C137", "text": "Payouts from a payment gateway go only to a bank account that was verified in the owner's name or the firm's name by a penny-drop check.", "d": "later", "at": [], "why": "payout checks follow gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C138", "text": "Money collected through the product's gateway settles to the firm's account directly; the product holds no balance beyond the settlement window.", "d": "later", "at": [], "why": "settlement rules follow gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C139", "text": "Reversing a payment, voiding an invoice or issuing a credit note over Rs 10,000 emails all owners at once with the actor and amount.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C140", "text": "A staff member who records a cash payment sees a receipt number that goes to the owner's daily summary; unpaid-but-cash-marked invoices are listed.", "d": "no", "at": [], "why": "cash watching is trust detail", "src": "judge", "area": "attack", "also": []}
- {"id": "C141", "text": "The owner's daily summary lists every payment recorded by hand, by user, so a payment marked paid with no money in the bank can be spotted.", "d": "no", "at": [], "why": "daily by-hand digest is noisy", "src": "judge", "area": "attack", "also": []}
- {"id": "C142", "text": "A payment marked received by bank transfer can carry a bank statement match (CSV upload) and unmatched payments are listed as Unverified at month end.", "d": "later", "at": [], "why": "statement proof follows bank import", "src": "judge", "area": "attack", "also": []}
- {"id": "C143", "text": "Staff who issue invoices with a discount over the owner-set limit (default 20 percent) are blocked until the owner approves.", "d": "no", "at": [], "why": "discount approval suits bigger teams", "src": "judge", "area": "attack", "also": []}
- {"id": "C144", "text": "The owner can set a rule that invoices above a chosen amount need owner approval before Issue; it applies to every role except the owner.", "d": "no", "at": [], "why": "amount approval suits bigger teams", "src": "judge", "area": "attack", "also": []}
- {"id": "C148", "text": "Share links and exports a deactivated user held cannot be used after deactivation; API keys and integrations they created are revoked.", "d": "later", "at": [], "why": "API keys follow the API", "src": "judge", "area": "attack", "also": []}
- {"id": "C150", "text": "A share link opened from 20 different IP addresses in one hour is throttled and the owner is notified.", "d": "no", "at": [], "why": "throttling guesses add support load", "src": "judge", "area": "attack", "also": []}
- {"id": "C163", "text": "If a restore ever returns to an earlier point, the numbers issued after that point are detected and listed, and no number is handed out twice.", "d": "later", "at": [], "why": "restore edge case needs design", "src": "judge", "area": "attack", "also": []}
- {"id": "C168", "text": "A gateway payment that arrives after the invoice was voided is shown as unmatched money with a refund action, never silently dropped.", "d": "later", "at": [], "why": "late gateway money follows gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C169", "text": "A client paying twice by UPI on one invoice (two successful payments) leads to a visible overpaid state with a one-tap refund request, not a hidden credit.", "d": "later", "at": [], "why": "overpaid UPI follows gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C170", "text": "The pay page stops showing the Pay button for 5 minutes after a payment started and is pending, so a client does not pay twice while confirmation is slow.", "d": "later", "at": [], "why": "pending-state lock follows gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C171", "text": "A payment that stays pending at the gateway for over 30 minutes shows on the firm's screen as Pending with the gateway reference and checks status again every 10 minutes.", "d": "later", "at": [], "why": "status polling follows gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C172", "text": "A failed or reversed UPI payment returns the invoice to unpaid and sends the firm a message; the receipt is marked void, not deleted.", "d": "later", "at": [], "why": "failed UPI handling follows gateway", "src": "judge", "area": "attack", "also": []}
- {"id": "C173", "text": "Tax on a line is recomputed on the server at Issue; a client-side total that differs by even one paisa is rejected and the server value is shown.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C176", "text": "When GST rates change by notification, the product updates the list within 2 working days and warns every firm that issues an invoice dated on or after the change.", "d": "no", "at": [], "why": "an operations promise, not a feature", "src": "judge", "area": "attack", "also": []}
- {"id": "C182", "text": "Customer names, notes and lines are stored as plain text and shown escaped; a name containing HTML or script tags never runs on any screen, PDF or email.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C183", "text": "Email invoice text cannot be changed to include links to other domains; only the product's pay link domain and the firm's own domain are allowed.", "d": "no", "at": [], "why": "link limits harm honest templates", "src": "judge", "area": "attack", "also": []}
- {"id": "C185", "text": "A new firm's first 20 invoices to a new contact use the WhatsApp or email of the owner and show a mark so abuse by fake firms can be reviewed.", "d": "no", "at": [], "why": "new-firm review is internal ops", "src": "judge", "area": "attack", "also": []}
- {"id": "C186", "text": "A fake firm using someone else's GSTIN is blocked: GSTIN legal name must match the firm name within a similarity check, and a mismatch needs a manual proof.", "d": "no", "at": [], "why": "name similarity gives false blocks", "src": "judge", "area": "attack", "also": []}
- {"id": "C187", "text": "A firm cannot claim a GSTIN that another active firm already verified; the second claimant sees Contact support and the first firm's owner is notified.", "d": "no", "at": [], "why": "claim fights are support cases", "src": "judge", "area": "attack", "also": []}
- {"id": "C188", "text": "SIM-swap risk is reduced: a login from a new device on a phone number changed in the last 7 days needs the second recovery contact or a 24-hour hold.", "d": "later", "at": [], "why": "SIM-swap needs phone login", "src": "judge", "area": "attack", "also": []}
- {"id": "C189", "text": "Sensitive actions (change bank, change owner, export all, delete firm) ask for a fresh OTP even inside an open session.", "d": "later", "at": [], "why": "fresh OTP needs phone login", "src": "judge", "area": "attack", "also": []}
- {"id": "C192", "text": "Third-party tokens (gateway, WhatsApp, e-invoice portal) are stored encrypted and never returned to the browser or written in logs.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C193", "text": "Application logs hold no full GSTIN, phone, bank account or amounts together with a name; logs older than 30 days are deleted.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attack", "also": []}
- {"id": "C195", "text": "The product fails if the accountant dislikes it; the share of firms whose accountant exports a pack each month is tracked, with a goal of 60 percent.", "d": "no", "at": [], "why": "a business metric, not a feature", "src": "judge", "area": "attack", "also": []}
- {"id": "C196", "text": "Week-4 retention (firm issued an invoice in each of weeks 1 and 4) is tracked and reviewed monthly; a figure below 40 percent triggers a review of the first-session flow.", "d": "no", "at": [], "why": "a business metric, not a feature", "src": "judge", "area": "attack", "also": []}
- {"id": "C198", "text": "Free plan abuse is limited: one free plan per GSTIN and per phone number, and a firm on free that makes 10 accounts is detected by device and payment signals.", "d": "no", "at": [], "why": "free-plan abuse is an ops matter", "src": "judge", "area": "attack", "also": []}
- {"id": "C203", "text": "A B2C invoice to an unregistered buyer shows the dynamic UPI QR on it when turnover is above Rs 500 crore; below that the QR is optional and defaults on.", "d": "no", "at": [], "why": "applies only above Rs 500 crore", "src": "judge", "area": "law", "also": []}
- {"id": "C205", "text": "Export of services needs payment in convertible foreign exchange or permitted rupees, and the product shows a flag for export invoices unpaid in foreign currency after 12 months.", "d": "no", "at": [], "why": "realisation tracking is FEMA advice", "src": "judge", "area": "law", "also": []}
- {"id": "C208", "text": "The terms and privacy page state that the firm is the data fiduciary for its customers' data and the product is its processor.", "d": "now", "at": [], "why": "", "src": "judge", "area": "law", "also": []}
- {"id": "C210", "text": "DPDP: data of under-18 users is not collected; the signup states the user must be 18 or older.", "d": "now", "at": [], "why": "", "src": "judge", "area": "law", "also": []}
- {"id": "C211", "text": "Data of Indian firms is stored in India; the region of the database, backups and file store is stated on the privacy page.", "d": "now", "at": [], "why": "", "src": "judge", "area": "law", "also": []}
- {"id": "C223", "text": "Sensitive client documents (legal matter descriptions) are hidden from line text on the pay page if the firm marks the matter confidential, showing only Professional services.", "d": "later", "at": [], "why": "confidential text option is niche", "src": "judge", "area": "law", "also": ["Legal firms can hide the matter detail from the invoice and use the section Legal services SAC 9982; the matter is kept in the firm's own notes only."]}
- {"id": "D001", "text": "Quote numbers use series QT/YY-YY/NNNNN, gapless per firm, assigned when first sent; the invoice counter is never touched by quotes.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "quote", "also": []}
- {"id": "D003", "text": "On the client page, after signing in with the customer's password, the client presses Accept or Decline on a sent quote, types their name, gives an optional reason up to 300 characters; time, IP and name go into history. A plain quote document link does not accept.", "d": "now", "at": [], "why": "", "src": "Refrens", "area": "quote", "also": []}
- {"id": "D005", "text": "Convert part of a quote: pick lines or a percent milestone; quote shows billed and remaining value and stays open until fully billed.", "d": "later", "at": [], "why": "part billing of quotes is advanced", "src": "FreshBooks", "area": "quote", "also": ["An interim invoice (part bill) can be raised against a quote or fee agreement amount, showing billed so far and remaining of the total."]}
- {"id": "D006", "text": "Quote list filters by status (draft, sent, accepted, declined, expired, converted), customer and validity range; sorts by date, total and validity; default newest first.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "quote", "also": []}
- {"id": "D007", "text": "Editing a sent quote saves revision 2, 3 and so on; older revisions stay readable and the client link always shows the latest.", "d": "later", "at": [], "why": "quote revisions are an extra", "src": "Stripe", "area": "quote", "also": []}
- {"id": "D008", "text": "Quote PDF and page carry the words \"Not a tax invoice\", no tax-invoice number, and are excluded from every GST register and tax total.", "d": "now", "at": [], "why": "", "src": "judge", "area": "quote", "also": []}
- {"id": "D009", "text": "Quote duplicate copies customer, lines, terms and notes; it never copies number, status, acceptance record or validity date.", "d": "no", "at": [], "why": "quote copy is minor", "src": "Zoho Books", "area": "quote", "also": []}
- {"id": "D010", "text": "Only draft quotes can be deleted; sent quotes can only be cancelled with a reason, and the number stays used.", "d": "now", "at": [], "why": "", "src": "judge", "area": "quote", "also": []}
- {"id": "D011", "text": "Webhooks quote.sent, quote.accepted, quote.declined and quote.expired carry quote id, number, total and customer id.", "d": "later", "at": [], "why": "webhooks come with the API", "src": "Stripe", "area": "quote", "also": []}
- {"id": "D016", "text": "A service item has name, SAC code, unit, default rate, default tax rate, description and active flag, with the name unique per firm ignoring case; picking an item copies its values into the line, and later catalogue edits never change drafts or issued invoices.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "item", "also": ["Picking an item copies its values into the line; later price changes never alter existing drafts or issued invoices.", "line: saved items catalogue (deferred)"]}
- {"id": "D017", "text": "The invoice line item picker searches name and SAC by substring from 1 character, shows rate and tax, and lists recently used items first.", "d": "now", "at": [], "why": "", "src": "Vyapar", "area": "item", "also": []}
- {"id": "D018", "text": "Creating a new item inline from a line asks only name, rate and SAC, saves it to the catalogue, and fills the line.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "item", "also": []}
- {"id": "D021", "text": "Units list holds hours, days, months, nos, sessions, and lets the owner add units up to 20 characters; unit prints beside quantity.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "item", "also": []}
- {"id": "D022", "text": "Item list columns: name, SAC, unit, rate, tax rate, times used, last used; filters: active, tax rate, unit; sorts by name, rate, times used.", "d": "no", "at": [], "why": "standard columns suffice", "src": "Invoice Ninja", "area": "item", "also": []}
- {"id": "D023", "text": "Per-customer price list overrides an item's rate for that customer; the line shows the override and a small marker that it differs from the catalogue.", "d": "later", "at": [], "why": "customer price lists are an extra", "src": "Zoho Books", "area": "item", "also": []}
- {"id": "D024", "text": "Bulk change rate for selected items by percent or amount with a preview of old and new rate; failed rows are listed with reasons.", "d": "no", "at": [], "why": "bulk rate edits are rare", "src": "Shopify", "area": "item", "also": []}
- {"id": "D025", "text": "Item CSV import matches on item name; shows rows to create, update and skip before running; bad SAC or rate rows download as an error file.", "d": "now", "at": [], "why": "", "src": "Shopify", "area": "item", "also": []}
- {"id": "D026", "text": "An item used on any document cannot be deleted; the screen says how many documents use it and offers archive, which hides it from the picker only.", "d": "now", "at": [], "why": "", "src": "Invoice Ninja", "area": "item", "also": []}
- {"id": "D028", "text": "Item export CSV has code, name, SAC, unit, rate, tax rate, active, created date; filtered rows only; UTF-8 with byte-order mark.", "d": "no", "at": [], "why": "full export holds items", "src": "Zoho Books", "area": "item", "also": []}
- {"id": "D029", "text": "Items support firm-defined custom fields of text, number, date or dropdown, shown in list, form, import and export.", "d": "later", "at": [], "why": "fixed fields cover launch needs", "src": "Twenty", "area": "item", "also": ["data: custom fields (deferred)"]}
- {"id": "D030", "text": "Item duplicate copies all fields except code and appends \"(copy)\" to the name.", "d": "no", "at": [], "why": "item copy is minor", "src": "Zoho Books", "area": "item", "also": []}
- {"id": "D031", "text": "An expense records date, vendor, category, amount, GST paid, paid-through account, notes and receipt, and is filtered by category, vendor, date and billable flag.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (expense record)", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D032", "text": "Mark an expense billable to a customer; it then appears as an unbilled item that can be added to that customer's next invoice as a line.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (mark an expense billable)", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D033", "text": "Re-billed expense lines can carry a markup percent; a pure-agent reimbursement line is printed separately and flagged with no markup allowed.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (markup and pure agent)", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D034", "text": "Receipt upload accepts JPG, PNG or PDF up to 5 MB, 3 files per expense; larger or other types are refused with the limit stated.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (receipt upload)", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D035", "text": "Expense categories are a firm list with defaults (travel, software, rent, salaries, professional fees); renaming keeps old expenses; used categories cannot be deleted, only archived.", "d": "no", "at": [], "why": "category lists belong in accounting software", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D036", "text": "Bulk actions on expenses: categorise, mark billable, delete; result says \"12 done, 1 failed\" with reason per failed row and leaves failed rows selected.", "d": "no", "at": [], "why": "bulk expense edits are bookkeeping", "src": "Shopify", "area": "expense", "also": []}
- {"id": "D037", "text": "An expense billed on an invoice is locked and links that invoice; voiding the invoice or deleting its draft returns the expense to unbilled.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (billed expense lock)", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D038", "text": "Expense export CSV has date, vendor, category, amount, GST, billable, customer, invoice number, paid through, one row per expense.", "d": "no", "at": [], "why": "expense reports are an accounting job", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D039", "text": "Deleted expenses stay in a trash for 30 days and restore with receipts; billed expenses cannot be deleted.", "d": "no", "at": [], "why": "expense trash is bookkeeping", "src": "judge", "area": "expense", "also": []}
- {"id": "D040", "text": "Vendor is its own record with name, GSTIN, PAN, state; expense GST split into CGST, SGST or IGST by vendor state, with an input-tax-credit eligible flag.", "d": "no", "at": [], "why": "vendor books belong to the accountant", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D041", "text": "A bank statement line can be turned into an expense in one click, prefilled with date, amount and description.", "d": "no", "at": [], "why": "bank-to-expense is accounting work", "src": "Xero", "area": "expense", "also": []}
- {"id": "D042", "text": "Expense duplicate copies vendor, category, amount and notes but not date, receipt or billing link.", "d": "no", "at": [], "why": "expense copy is bookkeeping", "src": "Zoho Books", "area": "expense", "also": []}
- {"id": "D043", "text": "A time entry holds date, person, customer, item or task, hours in 0.25 steps, note and billable flag; entries over 24 hours a day per person are refused.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time entry fields)", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D044", "text": "A start and stop timer on the time page creates an entry; only one timer runs per person and stopping saves the elapsed hours rounded up to the firm's step.", "d": "later", "at": [], "why": "timers need time module", "src": "FreshBooks", "area": "time", "also": []}
- {"id": "D045", "text": "Add unbilled time to a draft invoice grouped by person, task or day; each group becomes one line with quantity as hours and rate from person or customer.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (unbilled time on a draft)", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D046", "text": "Time rate order: customer-specific rate, then person rate, then item rate; the line shows which rate was used.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time rate order)", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D047", "text": "Billed entries are locked and show the invoice number; returning an invoice to void or deleting its draft frees the entries again.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (billed time lock)", "src": "FreshBooks", "area": "time", "also": []}
- {"id": "D048", "text": "Time list filters by person, customer, date range, billable and billed state; weekly view totals hours per day and per customer.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time list)", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D049", "text": "Staff see and edit only their own entries; owner and accountant see all; viewer sees none.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (own-entries rule)", "src": "judge", "area": "time", "also": []}
- {"id": "D050", "text": "Time export CSV has date, person, customer, task, hours, rate, amount, billed invoice; bulk mark as non-billable lists failures such as already billed rows.", "d": "room", "at": [], "why": "owner: maybe wave 1, decide before build (time export)", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D051", "text": "Retainer hours: a customer can have monthly included hours; the customer page shows used and remaining hours and flags overage.", "d": "later", "at": [], "why": "included hours need time module", "src": "Zoho Books", "area": "time", "also": []}
- {"id": "D052", "text": "A recurring plan has customer, lines, frequency (monthly, quarterly or yearly), start date and an optional end date or run count; every run creates a draft for review and never issues it.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D053", "text": "Plan page shows the next 3 run dates and amounts before saving, including the effect of a day above 28.", "d": "no", "at": [], "why": "preview adds screen weight", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D054", "text": "A recurring plan can be paused and resumed; resuming asks whether to skip the missed periods or create each of them once; Skip next run is a separate one-click action.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D055", "text": "Plan has a run history listing each run date, result and generated invoice link; failed runs state the reason such as archived customer or invalid GSTIN.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D056", "text": "If a run fails the owner is notified and the plan stays active; the next day retries once without creating a duplicate for the same period.", "d": "now", "at": [], "why": "", "src": "judge", "area": "recurring", "also": []}
- {"id": "D057", "text": "Editing a plan changes only future runs; invoices already created are untouched.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D058", "text": "A plan can raise its rate by a set percent on each anniversary, shown in the preview of future amounts.", "d": "no", "at": [], "why": "anniversary rises are contract matters", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D059", "text": "First period can be prorated by days from start date to the end of the month, with the calculation shown on the line.", "d": "no", "at": [], "why": "proration is done by hand", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D060", "text": "Plan list filters by status (active, paused, ended), customer and next run date; sorts by next run, customer, amount.", "d": "no", "at": [], "why": "few plans per firm", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D061", "text": "Plan delete is only allowed when it has never run; otherwise Stop ends it and keeps history.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D062", "text": "Auto-issued recurring invoices use the run date as issue date and the current financial year's counter, so numbering stays consecutive.", "d": "later", "at": [], "why": "auto-issue is not in launch", "src": "judge", "area": "recurring", "also": []}
- {"id": "D063", "text": "Webhook recurring_plan.run fires with plan id and invoice id for every run, success or failure.", "d": "later", "at": [], "why": "events follow the API", "src": "Stripe", "area": "recurring", "also": []}
- {"id": "D064", "text": "Duplicate plan copies customer, lines and mode but not run history, next run or end date.", "d": "no", "at": [], "why": "plan copy is minor", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D065", "text": "A plan can bill in advance: create the draft a set number of days before the invoice date.", "d": "later", "at": [], "why": "advance drafting is an extra", "src": "Zoho Books", "area": "recurring", "also": []}
- {"id": "D066", "text": "On an issued invoice, Create payment link produces a hosted page with UPI, card and netbanking; the link amount equals balance due, with an option to allow partial payment.", "d": "later", "at": [], "why": "hosted gateway page needs a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D067", "text": "Payment link has expiry date, status (created, paid, partially paid, expired, cancelled) and can be cancelled; a cancelled link shows a plain \"link no longer active\" page.", "d": "later", "at": [], "why": "link states need a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D068", "text": "Gateway payment success records a payment automatically with mode, gateway payment id, fee and net amount, and a receipt number.", "d": "later", "at": [], "why": "auto-recording needs a gateway", "src": "Stripe", "area": "paylink", "also": []}
- {"id": "D070", "text": "A gateway payment above the balance due, as when two links race, records the excess as customer advance instead of failing.", "d": "later", "at": [], "why": "race handling needs a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D071", "text": "Gateway fee and its GST are recorded on the payment and can be listed as an expense of category payment fees.", "d": "later", "at": [], "why": "fee books need a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D072", "text": "Payment link list filters by status, customer and date; columns invoice, amount, link status, created, paid on, gateway reference.", "d": "later", "at": [], "why": "link list needs a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D073", "text": "The invoice PDF and share page print a UPI QR with the firm's UPI ID, the balance due as amount and the invoice number in the note; the QR shows only while the balance due is above 0.", "d": "now", "at": [], "why": "", "src": "Vyapar", "area": "paylink", "also": ["A UPI QR on the invoice is generated for that invoice with the amount fixed; payment through it marks the invoice without typing a reference.", "PDF text is real text, searchable and copyable, not an image, and includes a UPI QR code for the balance due."]}
- {"id": "D074", "text": "Failed payment attempts appear on the invoice timeline with gateway reason, but never change status.", "d": "later", "at": [], "why": "attempt timeline needs a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D075", "text": "Refund through the gateway is started from the payment row, needs owner role, and records a refund linked to the payment.", "d": "later", "at": [], "why": "gateway refunds need a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D076", "text": "Payout settlement report lists gateway payments per settlement with gross, fee, net and bank credit date to reconcile against statement lines.", "d": "later", "at": [], "why": "settlement report needs a gateway", "src": "Razorpay", "area": "paylink", "also": []}
- {"id": "D077", "text": "Gateway keys are stored per firm, shown masked, tested on save, and replacing them leaves existing links working.", "d": "later", "at": [], "why": "key storage needs a gateway", "src": "judge", "area": "paylink", "also": []}
- {"id": "D079", "text": "Invoice can pick which firm bank account prints; the choice is stored on the invoice at issue.", "d": "room", "at": [], "why": "", "src": "Vyapar", "area": "bank", "also": []}
- {"id": "D080", "text": "Statement import accepts CSV with column mapping saved per account, with presets for common bank layouts; rows show date, narration, debit, credit, balance.", "d": "later", "at": [], "why": "statement mapping is bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D081", "text": "Import skips lines already imported, matching on date, amount, reference and balance; the result states how many were new and skipped.", "d": "later", "at": [], "why": "re-import checks are bank matching", "src": "Xero", "area": "bank", "also": []}
- {"id": "D082", "text": "Bad statement rows (no date, both debit and credit) are listed with row numbers and reasons and can be corrected and re-run without re-uploading.", "d": "later", "at": [], "why": "bad-row repair is bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D083", "text": "Credit lines show suggested invoice matches ranked by exact amount, invoice number in narration, then customer name.", "d": "later", "at": [], "why": "match suggestions are bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D084", "text": "One statement line can match several invoices, with a split amount per invoice; the total must equal the line amount.", "d": "later", "at": [], "why": "split matches are bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D085", "text": "A credit line can be matched as payment, ignored with a reason, or marked as not income (loan, transfer); each is reversible by Unmatch.", "d": "later", "at": [], "why": "ignore actions are bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D086", "text": "Statement list filters by matched, unmatched, ignored, credit or debit, date range and amount; default shows unmatched newest first.", "d": "later", "at": [], "why": "statement lists are bank matching", "src": "Xero", "area": "bank", "also": []}
- {"id": "D087", "text": "Bulk accept suggested matches for selected lines; the result states how many matched and lists skipped lines with the reason.", "d": "later", "at": [], "why": "bulk accept is bank matching", "src": "Xero", "area": "bank", "also": []}
- {"id": "D088", "text": "Net receipt after TDS: a line smaller than the invoice by about the TDS percent offers to record payment plus TDS automatically.", "d": "later", "at": [], "why": "net-of-TDS guess is bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D089", "text": "Reconciliation page shows opening balance, matched total, unmatched total and difference against the closing balance entered by the user.", "d": "later", "at": [], "why": "reconciliation page is accountant work", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D090", "text": "Deleting an import batch is allowed only when none of its lines is matched; the batch name, file and uploader stay in history.", "d": "later", "at": [], "why": "batch deletion is bank matching", "src": "judge", "area": "bank", "also": []}
- {"id": "D091", "text": "Statement export CSV carries match status, matched document number and receipt number beside each line.", "d": "later", "at": [], "why": "statement export is bank matching", "src": "Zoho Books", "area": "bank", "also": []}
- {"id": "D092", "text": "Statement lines are never edited after import; corrections happen by ignore and match actions, which are logged.", "d": "later", "at": [], "why": "immutability rule is bank matching", "src": "judge", "area": "bank", "also": []}
- {"id": "D093", "text": "A refund of customer credit records an amount up to the credit balance, date, mode, reference and bank account, is numbered REF/YY-YY/NNNNN without gaps, and two refunds at once can never exceed the balance.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "refund", "also": ["Refund above available credit is refused with the available figure shown; two refunds at once cannot together exceed the balance.", "workflow: customer credit refunded manually (deferred)", "credit note: refund (deferred)"]}
- {"id": "D094", "text": "Refund list filters by customer, mode and date; columns number, date, customer, amount, mode, reference; exports to CSV.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "refund", "also": []}
- {"id": "D095", "text": "A refund can be reversed by an owner with a reason, returning the amount to the customer's credit balance.", "d": "later", "at": [], "why": "refund reversal is rare", "src": "Zoho Books", "area": "refund", "also": []}
- {"id": "D096", "text": "Refund print page shows number, date, customer, amount, mode, reference and the credit note or advance it settles.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "refund", "also": []}
- {"id": "D098", "text": "Webhooks refund.created and refund.reversed carry refund id, customer id and amount.", "d": "later", "at": [], "why": "refund events follow the API", "src": "Stripe", "area": "refund", "also": []}
- {"id": "D099", "text": "Receipt voucher is issued when money arrives before an invoice; number RV/YY-YY/NNNNN, with customer, amount, GST rate and tax split by place of supply.", "d": "room", "at": [], "why": "", "src": "ClearTax", "area": "advance", "also": ["Advance received: issue a receipt voucher with GST on the advance; the later invoice adjusts it and shows only the balance payable.", "Advance for services is taxable on receipt: a receipt voucher states advance amount, rate, tax and place of supply, with its own series.", "A required advance for services can be recorded as an advance receipt with GST, then adjusted on the final invoice.", "Lawyer can record an advance received from a client before an invoice exists, with a receipt, and later adjust it against an invoice in 2 taps.", "Advance received for services needs a receipt voucher with tax at the time of receipt only where applicable; the product follows the current notification and states the rule applied."]}
- {"id": "D100", "text": "Advance on a customer shows as unapplied; applying it to an invoice offers the amount up to the smaller of advance and balance due.", "d": "room", "at": [], "why": "", "src": "Zoho Books", "area": "advance", "also": ["The advance balance for a client shows on the client page and on the invoice screen as Apply advance, prefilled with the lesser of advance and total.", "Payment recorded against a proforma is held as advance on the customer and applied when the tax invoice is issued."]}
- {"id": "D101", "text": "One advance can be split across several invoices; one invoice can use several advances; each application is a listed row.", "d": "room", "at": [], "why": "", "src": "Zoho Books", "area": "advance", "also": []}
- {"id": "D102", "text": "Applying an advance to an invoice reduces tax payable on that invoice by the tax already paid on the receipt voucher, shown on the print.", "d": "room", "at": [], "why": "", "src": "ClearTax", "area": "advance", "also": []}
- {"id": "D103", "text": "Unapply an advance returns it to unapplied balance and restores the invoice balance, with a logged reason.", "d": "later", "at": [], "why": "unapplying advances follows advances", "src": "Zoho Books", "area": "advance", "also": []}
- {"id": "D104", "text": "Refund voucher is issued when an advance is returned without supply; it numbers RFV/YY-YY/NNNNN and appears negative in the register.", "d": "later", "at": [], "why": "refund vouchers follow advances", "src": "ClearTax", "area": "advance", "also": []}
- {"id": "D105", "text": "Report of unapplied advances by customer with age in days, total, and link to each voucher.", "d": "later", "at": [], "why": "advance ageing follows advances", "src": "Zoho Books", "area": "advance", "also": []}
- {"id": "D106", "text": "GST sales register export includes receipt vouchers and refund vouchers as separate sections for the advances table of the return.", "d": "later", "at": [], "why": "advance register tables follow advances", "src": "ClearTax", "area": "advance", "also": []}
- {"id": "D108", "text": "Issuing a debit note increases the invoice balance due and status can move from paid back to partially paid.", "d": "later", "at": [], "why": "debit note balance follows debit notes", "src": "ClearTax", "area": "debit", "also": []}
- {"id": "D109", "text": "Debit note print page is titled \"Debit Note\" and states the original invoice number and date, reason and tax split.", "d": "later", "at": [], "why": "debit note print follows debit notes", "src": "ClearTax", "area": "debit", "also": []}
- {"id": "D110", "text": "Debit notes appear positive in the sales register with their own type column; void ones are excluded.", "d": "later", "at": [], "why": "debit note register follows debit notes", "src": "ClearTax", "area": "debit", "also": []}
- {"id": "D111", "text": "Debit note on an e-invoiced invoice requests its own IRN; failure leaves the note issued and retryable.", "d": "later", "at": [], "why": "debit note IRN follows debit notes", "src": "ClearTax", "area": "debit", "also": []}
- {"id": "D112", "text": "Only owner can void a debit note with no payment applied; reason of 5 to 200 characters is required and the number stays used.", "d": "later", "at": [], "why": "debit note void follows debit notes", "src": "judge", "area": "debit", "also": []}
- {"id": "D115", "text": "TDS list filters by FY, quarter, customer, section and certificate received or pending; default shows pending certificates oldest first.", "d": "later", "at": [], "why": "certificate lists follow certificates", "src": "judge", "area": "tds", "also": []}
- {"id": "D116", "text": "System matches certificates to payments' TDS amounts by customer and quarter, showing difference when totals disagree.", "d": "later", "at": [], "why": "certificate matching follows certificates", "src": "ClearTax", "area": "tds", "also": []}
- {"id": "D118", "text": "Form 26AS or AIS CSV import compares deductor TAN, section and amount with recorded TDS and lists mismatched rows.", "d": "later", "at": [], "why": "26AS import is advanced", "src": "ClearTax", "area": "tds", "also": []}
- {"id": "D119", "text": "Reminder to request a missing certificate can be queued to the customer contact 15 days after quarter-end TDS filing deadline.", "d": "no", "at": [], "why": "chasing certificates is the accountant's job", "src": "judge", "area": "tds", "also": []}
- {"id": "D120", "text": "TDS export CSV has customer, TAN, section, quarter, deducted, certificate number, certificate status and linked payment receipts.", "d": "later", "at": [], "why": "TDS export follows certificates", "src": "ClearTax", "area": "tds", "also": []}
- {"id": "D121", "text": "A certificate with matched payments cannot be deleted; it can be replaced with a new upload and the old file stays in history.", "d": "later", "at": [], "why": "certificate replacement follows certificates", "src": "judge", "area": "tds", "also": []}
- {"id": "D125", "text": "Download e-invoice JSON for an invoice, built to the portal schema, for manual upload when the live connection is down.", "d": "later", "at": [], "why": "manual JSON is a fallback", "src": "ClearTax", "area": "einv", "also": []}
- {"id": "D126", "text": "Bulk generate e-invoices for selected invoices; the result lists each as done or failed with the portal message, and failures can be retried together.", "d": "later", "at": [], "why": "bulk e-invoicing is an extra", "src": "ClearTax", "area": "einv", "also": []}
- {"id": "D128", "text": "Invoice list filters by e-invoice status: not needed, pending, generated, failed, cancelled.", "d": "now", "at": [], "why": "", "src": "ClearTax", "area": "einv", "also": []}
- {"id": "D130", "text": "Webhooks einvoice.generated, einvoice.failed and einvoice.cancelled carry invoice id and IRN.", "d": "later", "at": [], "why": "e-invoice events follow the API", "src": "ClearTax", "area": "einv", "also": []}
- {"id": "D131", "text": "A reminder rule has offset in days before or after due date, channel (email), template, and active flag; the firm can hold up to 10 rules.", "d": "no", "at": [], "why": "fixed steps suffice for small firms", "src": "Zoho Books", "area": "remrule", "also": []}
- {"id": "D140", "text": "Escalation rule notifies the owner, not the customer, when an invoice is over 30 days late.", "d": "no", "at": [], "why": "owner sees the overdue list", "src": "judge", "area": "remrule", "also": []}
- {"id": "D141", "text": "Invoice template settings hold logo, accent colour, footer text, signature image and A4 paper, with a live preview using a sample invoice.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "template", "also": ["Branding is set once: logo from gallery cropped square, a colour choice and a footer note; all invoices use it with no per-invoice setup."]}
- {"id": "D144", "text": "Reset template to default restores the built-in text; the edited version is kept as a revision for 30 days.", "d": "no", "at": [], "why": "template history is overkill", "src": "Zoho Books", "area": "template", "also": []}
- {"id": "D146", "text": "Terms and conditions text up to 1000 characters prints at the foot of invoices and quotes; a different text can be set per document type.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "template", "also": []}
- {"id": "D147", "text": "Template language option for labels in English or Hindi; amount in words follows the chosen language.", "d": "later", "at": [], "why": "Hindi labels follow translations", "src": "Zoho Books", "area": "template", "also": []}
- {"id": "D148", "text": "Test send emails a rendered template to the user's own address only.", "d": "no", "at": [], "why": "the preview already shows it", "src": "Zoho Books", "area": "template", "also": []}
- {"id": "D152", "text": "When a line rate differs from the SAC's standard rate the form shows a visible warning that the invoice will go out with that rate.", "d": "now", "at": [], "why": "", "src": "judge", "area": "taxrate", "also": ["SAC field offers a searchable directory of service codes with description; picking one suggests the standard rate and warns when the chosen rate differs."]}
- {"id": "D155", "text": "Invoice currency can be chosen from a firm-enabled list (USD, EUR, GBP, AED, SGD, AUD); the symbol, name and 2 decimals are fixed per currency.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "currency", "also": ["Exporter creates an invoice in USD with the currency chosen in one field after the customer; the customer's country sets currency by default."]}
- {"id": "D157", "text": "Exchange rate defaults from the last entered rate for that currency and can be edited only on draft; at issue it is locked.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "currency", "also": []}
- {"id": "D160", "text": "Payment in foreign currency records amount received, INR credited, bank charges and the exchange gain or loss line.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "currency", "also": ["Payment received in dollars records the dollar amount, the rupee credited to the bank, the bank charge and the foreign exchange gain or loss as separate figures.", "Payment from a payment platform (Wise, PayPal, Payoneer) can be recorded with the platform fee as a separate deduction, and the invoice settles at the dollar value."]}
- {"id": "D161", "text": "Foreign inward remittance advice reference (FIRC) can be attached to a payment with number and date.", "d": "later", "at": [], "why": "remittance tracking is an export extra", "src": "ClearTax", "area": "currency", "also": ["Exporter can attach the foreign inward remittance advice number (FIRC or e-FIRA) to a payment and see invoices still lacking one."]}
- {"id": "D162", "text": "Invoice list shows currency; filter by currency; totals row shows INR and foreign totals separately.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "currency", "also": ["An invoice list shows foreign-currency invoices with both amounts, and totals are shown separately per currency and in rupees."]}
- {"id": "D164", "text": "Registers show taxable value in INR using the stored exchange rate; the exchange rate is a column in the sales register export.", "d": "now", "at": [], "why": "", "src": "judge", "area": "currency", "also": []}
- {"id": "D165", "text": "A customer holds several contacts with name, email, phone, designation and a flag for each of: gets invoices, gets reminders, gets receipts.", "d": "room", "at": [], "why": "", "src": "Zoho Books", "area": "contact", "also": []}
- {"id": "D166", "text": "Emails for invoices go to every contact flagged for invoices; the send screen shows the recipients and lets the user remove or add one for that send.", "d": "later", "at": [], "why": "multi-contact sends need contacts", "src": "Zoho Books", "area": "contact", "also": []}
- {"id": "D167", "text": "The same email twice on one customer is refused; one email may sit on several customers.", "d": "later", "at": [], "why": "contact rules need contacts", "src": "judge", "area": "contact", "also": []}
- {"id": "D168", "text": "A contact whose email bounced shows a red marker and is skipped until corrected, and the owner sees the bounce in the outbox.", "d": "later", "at": [], "why": "contact bounce marks need bounce tracking", "src": "judge", "area": "contact", "also": []}
- {"id": "D169", "text": "Each contact records consent to be messaged: source, date and a channel list; withdrawing consent stops sends and is logged.", "d": "later", "at": [], "why": "contact consent needs WhatsApp", "src": "DPDP", "area": "contact", "also": []}
- {"id": "D170", "text": "Contact delete is allowed unless it is the only invoice recipient; contact history keeps the name on past emails.", "d": "later", "at": [], "why": "contact delete rules need contacts", "src": "Zoho Books", "area": "contact", "also": []}
- {"id": "D171", "text": "Contact import is part of customer import; match is by customer GSTIN then contact email; extra contacts attach, none are overwritten.", "d": "later", "at": [], "why": "contact import needs contacts", "src": "Zoho Books", "area": "contact", "also": []}
- {"id": "D172", "text": "A client opens the client page with the password the firm set or sent; no email code. The password is kept only as a hash, 10 to 64 characters; a forgotten password is reset by a one-hour link to the email on file.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "portal", "also": []}
- {"id": "D173", "text": "The client page shows only that customer's issued invoices, quotes, payments with receipts, credit notes and statement, with PDF download and Pay with UPI; drafts and internal notes never show.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "portal", "also": []}
- {"id": "D174", "text": "Client can mark an invoice Disputed with a reason and message; the owner is notified, reminders for that invoice pause, and status shows \"Disputed\" beside the invoice.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "portal", "also": []}
- {"id": "D175", "text": "Owner can revoke a portal user, or switch portal off for a customer; sessions end immediately.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "D176", "text": "Portal records \"viewed\" time on each invoice and shows it to the owner on the invoice timeline.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "portal", "also": []}
- {"id": "D177", "text": "Client page sessions end after 2 hours without a click or 24 hours in all; the page never shows drafts, internal notes, tags or other customers.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "D178", "text": "Portal pages carry the firm's name and logo and a plain \"Contact\" line with the firm email and phone.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "D180", "text": "Invoice form has an Issue from branch field; place of supply is compared with that branch's state, not the head office.", "d": "later", "at": [], "why": "branch issuing needs multi GSTIN", "src": "ClearTax", "area": "branch", "also": []}
- {"id": "D181", "text": "Counters run per branch, prefix and financial year; two branches may never share a prefix.", "d": "later", "at": [], "why": "branch counters need multi GSTIN", "src": "ClearTax", "area": "branch", "also": []}
- {"id": "D182", "text": "A branch used by any document cannot be deleted; it can be deactivated, hiding it from new documents.", "d": "later", "at": [], "why": "branch lifecycle needs multi GSTIN", "src": "judge", "area": "branch", "also": []}
- {"id": "D183", "text": "Each branch GSTIN is validated for format and check character, and its first two digits must equal the branch state's code.", "d": "later", "at": [], "why": "branch GSTIN checks need multi GSTIN", "src": "ClearTax", "area": "branch", "also": []}
- {"id": "D184", "text": "Register exports can be filtered by branch GSTIN, since returns are filed per GSTIN.", "d": "later", "at": [], "why": "per-GSTIN filters need multi GSTIN", "src": "ClearTax", "area": "branch", "also": []}
- {"id": "D186", "text": "Firm profile also holds the PAN (derived from GSTIN characters 3 to 12, a mismatch is refused), the Udyam number and the tax scheme: regular, composition or unregistered.", "d": "now", "at": [], "why": "", "src": "ClearTax", "area": "branch", "also": []}
- {"id": "D193", "text": "A CA or external accountant role can be given access to reports, registers and exports only, with an end date after which access stops.", "d": "later", "at": [], "why": "end-dated outside access is an extra", "src": "Zoho Books", "area": "role", "also": ["roles: auditor/CA read-only external role (deferred)"]}
- {"id": "D195", "text": "Staff role sees only invoices they created and customers assigned to them, for firms that turn this setting on.", "d": "later", "at": [], "why": "own-records view is a team feature", "src": "judge", "area": "role", "also": []}
- {"id": "D198", "text": "An invited email that already has a login attaches the firm to that login after sign-in, and no message ever reveals which other firms that person belongs to.", "d": "now", "at": [], "why": "", "src": "judge", "area": "invite", "also": []}
- {"id": "D199", "text": "Invite page shows the firm name, role and inviter before the person sets a password.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "invite", "also": []}
- {"id": "D200", "text": "Up to 10 emails can be invited at once, comma-separated; the result lists each as sent or refused with the reason.", "d": "later", "at": [], "why": "bulk invites are an extra", "src": "judge", "area": "invite", "also": []}
- {"id": "D203", "text": "API list endpoints page with a cursor, 100 maximum per page; filters include updated_since, status and external reference.", "d": "later", "at": [], "why": "cursor paging follows the API", "src": "Stripe", "area": "integ", "also": []}
- {"id": "D208", "text": "An endpoint failing 20 times in a row is disabled and the owner is emailed; it can be re-enabled after a test delivery succeeds.", "d": "later", "at": [], "why": "endpoint auto-disable follows webhooks", "src": "Stripe", "area": "integ", "also": []}
- {"id": "D211", "text": "Connected integrations list shows name, status, connected by, date and a Disconnect action; disconnecting never deletes records it created.", "d": "later", "at": [], "why": "integration list follows integrations", "src": "judge", "area": "integ", "also": []}
- {"id": "D212", "text": "Every record has an optional external_ref field up to 60 characters, unique per object type and firm, for matching with other software.", "d": "later", "at": [], "why": "external refs follow the API", "src": "Stripe", "area": "integ", "also": []}
- {"id": "D213", "text": "API errors return a machine code, a human message and the field name; versions are pinned per key and a changelog is listed.", "d": "later", "at": [], "why": "API error format follows the API", "src": "Stripe", "area": "integ", "also": []}
- {"id": "D219", "text": "State names and old spellings (Orissa, Pondicherry) map to the GST state list; unmapped values stop that row with the value shown.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "import", "also": []}
- {"id": "D220", "text": "Historical invoices import as issued with their original number, date and totals, never use the counter, are marked Imported and cannot be edited.", "d": "later", "at": [], "why": "full history import is second step", "src": "judge", "area": "import", "also": []}
- {"id": "D222", "text": "Whole import can be undone within 24 hours: records created by it are removed if untouched; touched ones are listed and left.", "d": "later", "at": [], "why": "import undo is rare", "src": "Shopify", "area": "import", "also": []}
- {"id": "D223", "text": "Import history lists file name, who, when, counts and status; uploading a file with the same hash warns that it was already imported.", "d": "later", "at": [], "why": "import history page is polish", "src": "Shopify", "area": "import", "also": []}
- {"id": "D226", "text": "Statement and payments imports show a matched-versus-unmatched summary before anything is saved, with a Confirm step.", "d": "later", "at": [], "why": "payment imports follow bank matching", "src": "Xero", "area": "import", "also": []}
- {"id": "D227", "text": "Export screen shows row count for the current filter before download, offers columns to include, and remembers the column choice per person.", "d": "no", "at": [], "why": "column memory is polish", "src": "Shopify", "area": "export", "also": []}
- {"id": "D228", "text": "Exports over 5,000 rows run as a background job with states queued, ready and expired, an email with the link when ready, and a link that dies after 7 days with the file deleted while the job record stays.", "d": "now", "at": [], "why": "", "src": "Shopify", "area": "export", "also": ["Export job states are queued, ready, expired; a ready file link expires after 7 days and the file is then deleted.", "Export files are deleted 7 days after creation and their links die with them; the export record stays.", "Export files are kept 7 days then removed; the job row stays with row count, who ran it and filters used.", "data: export job record (deferred)"]}
- {"id": "D230", "text": "Download invoice PDFs for a date range as one zip named FIRM_INVOICES_YYYY-MM; each file name carries number and customer with slashes replaced by dashes.", "d": "no", "at": [], "why": "full export holds PDFs", "src": "Zoho Books", "area": "export", "also": []}
- {"id": "D233", "text": "Excel export option (XLSX) keeps amounts as numbers, dates as dates, and freezes the header row.", "d": "no", "at": [], "why": "CSV opens in Excel", "src": "Zoho Books", "area": "export", "also": []}
- {"id": "D236", "text": "Custom fields are exported as columns named after the field label; columns for archived fields appear only when asked.", "d": "later", "at": [], "why": "custom field columns need fields", "src": "Twenty", "area": "export", "also": []}
- {"id": "D241", "text": "Collections report shows receipts per day and per mode, TDS separately, and the share paid within terms.", "d": "no", "at": [], "why": "aging already covers it", "src": "Zoho Books", "area": "report", "also": []}
- {"id": "D243", "text": "Days sales outstanding and average days to pay are shown per customer and for the firm for a chosen period.", "d": "no", "at": [], "why": "days-to-pay is analytics", "src": "Zoho Books", "area": "report", "also": []}
- {"id": "D244", "text": "Each report states \"as of\" time, scope (firm or branch) and the filters used; changing a filter reloads without losing the others.", "d": "no", "at": [], "why": "stamps are cosmetic", "src": "judge", "area": "report", "also": []}
- {"id": "D248", "text": "Dashboard tiles show outstanding, overdue, collected this month and drafts count, each opening the matching filtered list.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "report", "also": ["Dashboard splits receivables into Current and Overdue; tapping either figure opens the aging report already filtered to that part.", "The home screen shows only four numbers: unpaid total, overdue total, paid this month, drafts; each opens its list in one tap."]}
- {"id": "D250", "text": "A saved view stores filters, sort and columns under a name of up to 40 characters; names unique per list per person.", "d": "no", "at": [], "why": "filters and search suffice", "src": "Shopify", "area": "saved", "also": []}
- {"id": "D251", "text": "Saved views are private or shared with the firm; only the creator or an owner edits a shared view.", "d": "no", "at": [], "why": "views are not shared", "src": "Twenty", "area": "saved", "also": []}
- {"id": "D252", "text": "One view can be the default for a person and opens first; a locked All view always exists and cannot be deleted.", "d": "no", "at": [], "why": "no default views", "src": "Linear", "area": "saved", "also": []}
- {"id": "D253", "text": "Views appear as tabs above the list with a count; at most 20 per person per list, with a clear message at the limit.", "d": "no", "at": [], "why": "no view tabs", "src": "Shopify", "area": "saved", "also": []}
- {"id": "D254", "text": "A view that filters on a deleted or archived record shows a notice and still loads with that filter removed.", "d": "no", "at": [], "why": "no views to go stale", "src": "judge", "area": "saved", "also": []}
- {"id": "D255", "text": "Starter views for invoices: Drafts, Unpaid, Overdue, Paid this month; for customers: With balance, Archived.", "d": "no", "at": [], "why": "no starter views", "src": "Shopify", "area": "saved", "also": []}
- {"id": "D256", "text": "A bell lists events: payment received, invoice viewed, quote accepted or declined, e-invoice failed, import finished, reminder skipped; unread count shown, mark all read.", "d": "later", "at": [], "why": "bell centre is polish", "src": "Zoho Books", "area": "notif", "also": ["msg: in-app notifications (deferred)"]}
- {"id": "D257", "text": "Per person settings choose in-app, email or none for each event type; owner events default on, others off.", "d": "later", "at": [], "why": "notice settings are polish", "src": "Salesforce", "area": "notif", "also": []}
- {"id": "D258", "text": "Daily summary email at 8 AM IST lists new overdue invoices, payments received and failed e-invoices, and is skipped on days with nothing.", "d": "later", "at": [], "why": "daily digest is an extra", "src": "judge", "area": "notif", "also": []}
- {"id": "D259", "text": "Notifications link to the record and are kept 90 days; opening one marks it read.", "d": "no", "at": [], "why": "bell history is not kept", "src": "Chatwoot", "area": "notif", "also": []}
- {"id": "D260", "text": "Mute a customer to stop viewed and payment alerts for it; the customer page shows the mute state.", "d": "no", "at": [], "why": "customer muting is clutter", "src": "judge", "area": "notif", "also": []}
- {"id": "D262", "text": "The audit log lists time, actor, action, object, record number and summary, filterable by actor, object type, action and date range, searchable by record number such as INV/26-27/00012, newest first.", "d": "now", "at": [], "why": "", "src": "Salesforce", "area": "audit", "also": ["One activity log lists who created, edited, issued, voided or exported what and when, and is itself filterable by user and type.", "Audit log search finds by record number, such as INV/26-27/00012, and returns every entry touching it."]}
- {"id": "D264", "text": "Audit also records sign-ins, failed sign-ins, role changes, exports and permission-denied attempts, with IP address and device.", "d": "now", "at": [], "why": "", "src": "judge", "area": "audit", "also": []}
- {"id": "D265", "text": "Audit CSV export is owner only and is itself logged; each row includes actor email and IP.", "d": "no", "at": [], "why": "audit CSV is rarely needed", "src": "judge", "area": "audit", "also": []}
- {"id": "D269", "text": "Free plan shows \"7 of 10 invoices this month\" on the invoice list; at the limit, issuing is blocked with an upgrade prompt while drafts, payments and all reading stay open.", "d": "now", "at": [], "why": "", "src": "judge", "area": "plan", "also": ["Free plan limit is shown as a counter on home (for example 7 of 10 invoices this month) and the limit never blocks recording a payment or exporting.", "At the free limit, the user can still view, pay, export and print; only creating the next invoice shows the upgrade, with a price in rupees including GST."]}
- {"id": "D271", "text": "Trial shows days left in a banner; at the end the firm moves to Free automatically, never to a blocked state.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": []}
- {"id": "D272", "text": "Plan change takes effect now for upgrades, with proration shown before confirming, and at period end for downgrades.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": []}
- {"id": "D273", "text": "Downgrade is blocked when active users exceed the new plan's seats; the message names how many to deactivate.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": []}
- {"id": "D275", "text": "A failed subscription payment gives a 7-day grace with a banner and emails on day 1, 3 and 6 before read-only mode; the firm can pay by UPI AutoPay, card or one-time UPI.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": ["The firm can pay the plan by UPI AutoPay, card, or one-time UPI, and a failed renewal retries for 3 days without locking access before the grace ends."]}
- {"id": "D276", "text": "Cancel at period end keeps full use until the date, shows the date, and offers Undo cancel until then.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": ["Cancel plan takes at most 3 taps from settings, asks one optional reason, and shows the exact last paid day and what stays accessible."]}
- {"id": "D277", "text": "Billing page lists payment method, next charge date and amount; annual and monthly toggle shows the saving.", "d": "now", "at": [], "why": "", "src": "Stripe", "area": "plan", "also": []}
- {"id": "D278", "text": "Usage count for the free limit counts issued invoices only, resets on the 1st IST, and voided invoices still count.", "d": "now", "at": [], "why": "", "src": "judge", "area": "plan", "also": []}
- {"id": "D282", "text": "Support access never exposes password hashes, API secrets, gateway keys or the full bank account number.", "d": "now", "at": [], "why": "", "src": "judge", "area": "support", "also": []}
- {"id": "D284", "text": "Tags are free labels up to 30 characters, shared per firm per object type; same tag in different case is one tag.", "d": "no", "at": [], "why": "tags suit bigger teams", "src": "Shopify", "area": "tag", "also": []}
- {"id": "D285", "text": "Renaming a tag renames it everywhere; deleting a tag removes it from records but never touches them, after a confirm that states the count.", "d": "no", "at": [], "why": "no tags to rename", "src": "Shopify", "area": "tag", "also": []}
- {"id": "D286", "text": "Tags are searchable, filterable and exportable on customers, invoices, expenses and items; up to 10 per record.", "d": "no", "at": [], "why": "no tags to filter", "src": "Shopify", "area": "tag", "also": []}
- {"id": "D287", "text": "Files can be attached to invoice, customer, expense, payment and credit note: PDF, JPG, PNG, XLSX, DOCX up to 5 MB, 10 per record.", "d": "later", "at": [], "why": "attachments are a file feature", "src": "Zoho Books", "area": "attach", "also": ["data: attachments on invoice (deferred)"]}
- {"id": "D288", "text": "An attachment can be marked Send with email; those files go with the invoice email up to a 10 MB total.", "d": "later", "at": [], "why": "emailed attachments follow attachments", "src": "Zoho Books", "area": "attach", "also": []}
- {"id": "D289", "text": "Attachments on issued documents can be added and removed after issue; each add and remove is logged with file name and user.", "d": "later", "at": [], "why": "post-issue files follow attachments", "src": "judge", "area": "attach", "also": []}
- {"id": "D290", "text": "Uploaded files are checked by content, not name; an executable renamed to .png or .pdf is refused.", "d": "now", "at": [], "why": "", "src": "judge", "area": "attach", "also": []}
- {"id": "D291", "text": "A dispute on an invoice records raised by, reason, amount in question and status (open, resolved, written off); open disputes pause reminders.", "d": "later", "at": [], "why": "dispute records follow share-page actions", "src": "Zoho Books", "area": "dispute", "also": []}
- {"id": "D292", "text": "Resolving a dispute offers: no change, issue credit note for the amount in question, or note; the choice is logged.", "d": "later", "at": [], "why": "dispute outcomes follow disputes", "src": "judge", "area": "dispute", "also": []}
- {"id": "D293", "text": "Numbering settings show per series the next number, last issued number and date, and the year; the next number moves only upward, as A009 allows.", "d": "now", "at": [], "why": "", "src": "judge", "area": "numser", "also": []}
- {"id": "D295", "text": "A second series (for example a branch or export prefix) can be created before first use only; the prefix cannot be changed once any document uses it.", "d": "room", "at": [], "why": "", "src": "judge", "area": "numser", "also": []}
- {"id": "D296", "text": "Late fee setting: flat amount or percent per month on overdue balance; when on, it adds a fee line to a draft, never changes an issued invoice.", "d": "later", "at": [], "why": "late fees need consent text", "src": "Zoho Books", "area": "latefee", "also": ["rules: late fee / interest (deferred)"]}
- {"id": "D297", "text": "Late fee drafts are created monthly per overdue customer for review, never issued automatically; GST on the fee uses the invoice's rate.", "d": "later", "at": [], "why": "late fee drafts follow late fees", "src": "judge", "area": "latefee", "also": []}
- {"id": "D298", "text": "Customer credit ledger lists each credit in, amount applied, refund and balance after, newest first, each row linking to its document.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditled", "also": ["data: customer credit ledger"]}
- {"id": "D300", "text": "Unapply credit from an invoice returns it to the ledger, restores balance due, and records who and why.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditled", "also": ["Unapply credit from an invoice returns the amount to the customer credit balance and restores that invoice's balance due, logged with reason."]}
- {"id": "D301", "text": "Setup checklist shows firm profile, bank account, first customer, first invoice, invite accountant; each item links to its form and ticks when done.", "d": "now", "at": [], "why": "", "src": "Vyapar", "area": "onboard", "also": ["The next-thing-they-want after paying plan or first invoice is a short checklist (add logo, add bank, send first reminder) with each item one tap and a progress bar."]}
- {"id": "D302", "text": "GSTIN entry fetches legal name, address and state from the portal and fills the profile, with the status shown (active or cancelled).", "d": "later", "at": [], "why": "needs a GSTIN lookup provider", "src": "Zoho Books", "area": "onboard", "also": ["Entering a GSTIN fills legal name, address and state from the portal data, and state names match the GST state list, including Puducherry.", "GSTIN status such as cancelled or suspended is checked on save and shown as a warning on the customer.", "Entering a 15-character GSTIN fetches legal name, address and state from the GST portal lookup and prefills them; the user edits only if wrong.", "A GSTIN lookup that fails because the portal is down never blocks; the user can continue with a Not verified mark that is cleared on the next successful check.", "GSTIN lookup on the customer form fills name, address and state and warns in red when the registration is cancelled."]}
- {"id": "D303", "text": "Sample data can be loaded to explore and removed in one action; sample records never count toward invoice numbers or plan limits.", "d": "no", "at": [], "why": "sample data muddles real books", "src": "judge", "area": "onboard", "also": []}
- {"id": "D304", "text": "Global search finds customers, invoices, payments, quotes and items from one box; typing an exact document number jumps straight to it.", "d": "later", "at": [], "why": "one search box is an extra", "src": "Stripe", "area": "search", "also": []}
- {"id": "D305", "text": "Search results group by object with 5 per group, show a match reason (number, GSTIN, name), and a View all link keeps the query.", "d": "no", "at": [], "why": "grouped results follow no global search", "src": "Stripe", "area": "search", "also": []}
- {"id": "D306", "text": "Search ignores spaces and slashes inside numbers, so INV2627 00001 finds INV/26-27/00001, and matches amounts typed as 12500 or 12,500.", "d": "now", "at": [], "why": "", "src": "judge", "area": "search", "also": []}
- {"id": "D307", "text": "Outbox shows delivered, opened and bounced where known; a bounce marks the contact and names the invoice that failed.", "d": "later", "at": [], "why": "delivery and open states need callbacks", "src": "Zoho Books", "area": "outbox2", "also": []}
- {"id": "D308", "text": "Queued emails can be cancelled before send; a cancelled row stays in the list with who cancelled it.", "d": "no", "at": [], "why": "queue cancel is rare", "src": "judge", "area": "outbox2", "also": []}
- {"id": "D309", "text": "Outbox filters by status, type (invoice, reminder, receipt, invite), customer and date; each row opens the exact body and attachments sent.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "outbox2", "also": []}
- {"id": "D310", "text": "Customer detail first shows outstanding, overdue amount, unused credit, average days to pay and last payment date, ahead of tabs.", "d": "later", "at": [], "why": "payment-speed headline needs history", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D311", "text": "Customer list columns: name, GSTIN, state, outstanding, overdue, last invoice date, terms, tags; chosen and ordered per person.", "d": "no", "at": [], "why": "standard columns suffice", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D312", "text": "Customer filters: state, has balance, has overdue, has GSTIN yes or no, tag, owner, created date; sorts by name, outstanding, last invoice date.", "d": "no", "at": [], "why": "search is enough for customers", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D315", "text": "Bulk on customers: tag, set terms, archive; result reads \"18 done, 2 failed\" with each failed customer and reason, failed rows stay selected.", "d": "no", "at": [], "why": "bulk customer edits are rare", "src": "Shopify", "area": "customer", "also": []}
- {"id": "D318", "text": "Deleted customers with no documents stay in trash for 30 days and restore with contacts and notes.", "d": "no", "at": [], "why": "archive already acts as trash", "src": "Shopify", "area": "customer", "also": []}
- {"id": "D319", "text": "Customer duplicate copies address, terms, tags and settings but leaves GSTIN, id, balances and documents blank.", "d": "no", "at": [], "why": "customer copy is minor", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D321", "text": "Customer attachments for agreement, KYC and work order, 10 files of 5 MB, with name, date and uploader shown.", "d": "no", "at": [], "why": "customer files go in agreements elsewhere", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D322", "text": "Customer custom fields: text, number, date, dropdown, up to 10, optionally printed on invoices; shown in list, import and export.", "d": "no", "at": [], "why": "fixed fields cover launch needs", "src": "Twenty", "area": "customer", "also": []}
- {"id": "D323", "text": "Customer owner field assigns a staff member; list filter Mine shows only theirs.", "d": "no", "at": [], "why": "customer owners suit bigger teams", "src": "Salesforce", "area": "customer", "also": []}
- {"id": "D325", "text": "API customers carry external_ref; GET by GSTIN or ref returns the record; events customer.created, updated and archived carry changed fields.", "d": "later", "at": [], "why": "customer events follow the API", "src": "Stripe", "area": "customer", "also": []}
- {"id": "D326", "text": "The client page shows a read-only statement for a period the client picks (opening balance, invoices, payments, credit notes, running and closing balance, open invoices) with a PDF; there is no separate statement link.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "customer", "also": []}
- {"id": "D329", "text": "Invoice list extra columns to pick: place of supply, tags, owner, sent date, viewed date, e-invoice status, currency, branch, PO number.", "d": "no", "at": [], "why": "extra columns clutter phones", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D330", "text": "Invoice extra filters: amount range, due date range, overdue by days, sent or not sent, viewed or not, tag, owner, branch, e-invoice status.", "d": "no", "at": [], "why": "extra filters clutter phones", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D331", "text": "Invoice list can group by customer or month showing a subtotal per group; the totals row sums total and balance for the filtered rows.", "d": "no", "at": [], "why": "grouped lists clutter phones", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D332", "text": "Starter saved views: Drafts, Unpaid, Overdue, Due this week, Paid this month; each shows a count.", "d": "no", "at": [], "why": "no starter views", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D333", "text": "Bulk email on selected issued invoices queues one message each; result lists queued and skipped (no email, draft) with reasons.", "d": "later", "at": [], "why": "bulk email follows bulk actions", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D334", "text": "Bulk issue of selected drafts issues in issue-date order, skips drafts failing checks with the reason, and consumes numbers only for those issued.", "d": "later", "at": [], "why": "bulk issue is not in launch", "src": "judge", "area": "invoice", "also": ["invoice: bulk issue, bulk email (deferred)"]}
- {"id": "D335", "text": "Bulk PDF download of selected invoices gives one zip; bulk tag, bulk send reminder and bulk delete drafts follow the same partial-result report.", "d": "no", "at": [], "why": "single downloads suffice", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D337", "text": "At issue the PDF is rendered once and stored with its content hash and template version; reopening or resending later serves that file with the same layout, logo and wording, and its name is the document number with slashes replaced by hyphens.", "d": "now", "at": [], "why": "", "src": "judge", "area": "invoice", "also": ["Each issued document stores the template version and a content hash; reprint matches the first print, and a mismatch raises an integrity alert.", "An issued invoice's PDF is stored at issue; changing the template later never changes how an old invoice looks when reopened."]}
- {"id": "D341", "text": "The share page records the first and last time it was viewed and shows both on the invoice.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "invoice", "also": ["The firm sees on the invoice when the client opened the link (first and last open time) so the owner can say the client saw it."]}
- {"id": "D342", "text": "Invoice owner field defaults to creator; list filter Mine; owner shown in history.", "d": "no", "at": [], "why": "invoice owner suits bigger teams", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D343", "text": "Comments thread on an invoice, internal only, with @mention of a user that notifies them; comments cannot be edited after 5 minutes.", "d": "later", "at": [], "why": "internal comments are team feature", "src": "Zoho Books", "area": "invoice", "also": ["Accountant can leave a comment on an invoice visible to the owner, with a Resolved tick, and see unresolved comments for each firm."]}
- {"id": "D344", "text": "Invoice attachments up to 10 files of 5 MB, optionally sent with the email; add and remove after issue logged.", "d": "later", "at": [], "why": "invoice files follow attachments", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D345", "text": "Custom invoice fields (PO number, project code, work order) of text, number, date or dropdown print on the invoice and are searchable and exportable.", "d": "no", "at": [], "why": "fixed PO fields cover it", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D346", "text": "Draft autosaves every 30 seconds and on leaving; the draft shows \"Saved 10:42\" and a lost connection shows \"Not saved, retrying\".", "d": "now", "at": [], "why": "", "src": "judge", "area": "invoice", "also": ["Every form keeps typed data when the app is backgrounded, the phone call interrupts, the browser tab reloads, or the session expires.", "exception: session timeout mid-form (draft preserved)"]}
- {"id": "D347", "text": "Invoice related panel shows payments, credit notes, debit notes, e-invoice record, source quote, recurring plan, emails sent and time entries billed.", "d": "no", "at": [], "why": "related panel is clutter", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D349", "text": "Deleted drafts sit in trash 30 days and restore with their lines; issued and void invoices have no delete.", "d": "no", "at": [], "why": "drafts are simply deleted", "src": "judge", "area": "invoice", "also": []}
- {"id": "D351", "text": "API: create draft, update draft, issue as a separate call; GET by number; filter updated_since; issue returns the number and PDF link.", "d": "later", "at": [], "why": "draft API follows the API", "src": "Stripe", "area": "invoice", "also": []}
- {"id": "D352", "text": "Webhooks invoice.issued, invoice.paid, invoice.voided, invoice.overdue with signed delivery, event id and full invoice body.", "d": "later", "at": [], "why": "invoice events follow the API", "src": "Stripe", "area": "invoice", "also": []}
- {"id": "D353", "text": "Issue screen shows a final check list (customer GSTIN, SAC present, place of supply, tax split) with a plain warning for anything unusual before the number is taken.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "invoice", "also": ["Invoice with a different customer GSTIN state than place of supply shows a visible note \"Place of supply differs from customer state\" on the draft."]}
- {"id": "D355", "text": "Invoice notify: owner is told when the customer views an invoice for the first time, if the setting is on.", "d": "later", "at": [], "why": "first-view alerts follow notices", "src": "Zoho Books", "area": "invoice", "also": []}
- {"id": "D357", "text": "The payments list shows date, receipt, customer, invoice, mode, amount, TDS, reference and recorded-by, newest first, filterable by mode, date, customer and reversed; reversed rows are greyed and left out of totals.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "payment", "also": ["Payments filter shows reversed rows greyed with a reversed chip and excluded from totals unless asked.", "payment: filter by mode, date (deferred)"]}
- {"id": "D358", "text": "Search payments by receipt number, reference, customer name, or exact amount.", "d": "no", "at": [], "why": "lists already filter", "src": "Zoho Books", "area": "payment", "also": []}
- {"id": "D360", "text": "Payment mode list is firm-extendable with custom modes (wallet, gateway name) of up to 20 characters; used modes can be hidden, not deleted.", "d": "no", "at": [], "why": "fixed modes cover India", "src": "Zoho Books", "area": "payment", "also": []}
- {"id": "D361", "text": "Deposit account chosen per payment from the firm's bank accounts and Cash in hand; filter and export by it.", "d": "later", "at": [], "why": "deposit accounts need several accounts", "src": "Zoho Books", "area": "payment", "also": []}
- {"id": "D363", "text": "Payment has received date and bank clearing date separately; clearing date optional and used for reconciliation.", "d": "no", "at": [], "why": "clearing dates are accountant detail", "src": "Zoho Books", "area": "payment", "also": []}
- {"id": "D370", "text": "API POST payments with an Idempotency-Key; response gives receipt number; GET filters by invoice, customer and updated_since.", "d": "later", "at": [], "why": "payment API follows the API", "src": "Stripe", "area": "payment", "also": []}
- {"id": "D371", "text": "Webhooks payment.recorded and payment.reversed with amount, invoice ids, receipt number and mode.", "d": "later", "at": [], "why": "payment events follow the API", "src": "Stripe", "area": "payment", "also": []}
- {"id": "D373", "text": "Unmatched amount typed above balance shows the balance and offers \"Record rest as advance\" rather than only an error.", "d": "later", "at": [], "why": "rest-as-advance follows advances", "src": "judge", "area": "payment", "also": ["Overpayment above the balance is held as customer credit, shown on the payment and on the customer."]}
- {"id": "D374", "text": "Group payments by day for a daybook view with a total per day and per mode.", "d": "no", "at": [], "why": "daybook is accountant detail", "src": "Zoho Books", "area": "payment", "also": []}
- {"id": "D375", "text": "Payment recorded by a gateway shows its source and cannot be reversed here; a refund through the gateway is the path.", "d": "later", "at": [], "why": "gateway rows follow gateway", "src": "judge", "area": "payment", "also": []}
- {"id": "D377", "text": "The credit note list shows number, date, customer, original invoice, reason, total and status, filterable by status, date and customer.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditnote", "also": ["Search credit notes by number, original invoice number and customer name; default sort newest issue date first."]}
- {"id": "D379", "text": "Email a credit note to the customer's contacts with PDF and share link; goes through the outbox like invoices.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditnote", "also": []}
- {"id": "D380", "text": "Credit note preview shows the resulting invoice balance and new customer credit before issue.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditnote", "also": []}
- {"id": "D382", "text": "Draft credit notes can be deleted after a confirm; issued ones cannot.", "d": "now", "at": [], "why": "", "src": "Zoho Books", "area": "creditnote", "also": []}
- {"id": "D383", "text": "Attach a supporting document (return slip, approval email) to a credit note, 5 MB each, kept with it.", "d": "no", "at": [], "why": "credit note files are clutter", "src": "Zoho Books", "area": "creditnote", "also": []}
- {"id": "D384", "text": "Credit note related panel lists the original invoice, each application to other invoices, refunds and the e-invoice record.", "d": "no", "at": [], "why": "related panel is clutter", "src": "Zoho Books", "area": "creditnote", "also": []}
- {"id": "D386", "text": "API creates a credit note against an invoice, with webhooks credit_note.issued and credit_note.voided carrying invoice id and amount.", "d": "later", "at": [], "why": "credit note API follows the API", "src": "Stripe", "area": "creditnote", "also": []}
- {"id": "K014", "text": "roles: per-customer assignment of accountants (deferred)", "d": "no", "at": [], "why": "accountant sees the whole firm", "src": "known", "area": "core", "also": []}
- {"id": "K039", "text": "data: money stored as integer paise", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K041", "text": "data: invoice: number, series, FY, dates, customer snapshot, place of supply, status, notes, IRN fields, totals", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K042", "text": "data: line: description, HSN/SAC, qty, rate, discount, tax rate, taxable, cgst, sgst, igst", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K043", "text": "data: payment: invoice, amount, TDS, date, mode, reference, receipt number, reversed flag", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K056", "text": "Foreign-currency invoices for export of services are in wave 1: money is stored as integer paise in INR, with the foreign amount, currency and rate kept beside it.", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K107", "text": "When two users edit the same draft, the second save is refused with a notice that shows the newer version.", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K135", "text": "msg: toast on success", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K165", "text": "customer: saved view (deferred)", "d": "no", "at": [], "why": "saved views are not offered", "src": "known", "area": "core", "also": []}
- {"id": "K166", "text": "customer: bulk archive (deferred)", "d": "no", "at": [], "why": "bulk customer edits are rare", "src": "known", "area": "core", "also": []}
- {"id": "K168", "text": "customer: notes, history", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K177", "text": "invoice: saved view (deferred)", "d": "no", "at": [], "why": "saved views are not offered", "src": "known", "area": "core", "also": []}
- {"id": "K187", "text": "invoice: merge (n/a)", "d": "no", "at": [], "why": "invoices are never merged", "src": "known", "area": "core", "also": []}
- {"id": "K190", "text": "Lines can be added, edited and removed on a draft; reordering and duplicating a line are wave 2.", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "K206", "text": "A user who forgot the password asks for a reset link by email; the link comes through the outbox, expires in 1 hour and works once.", "d": "now", "at": [], "why": "", "src": "known", "area": "core", "also": []}
- {"id": "W001", "text": "A customer needs a name of 1 to 100 characters, a type (business or individual) and a billing state from the GST state list; saving without any is rejected with a field-level error.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["data: customer: name, type, GSTIN, state, address, email, phone, terms days, archived at", "validate: name 1-100"]}
- {"id": "W002", "text": "A customer GSTIN, if given, must match the 15-character GST format and pass the standard check-character test; otherwise the save is rejected with the message \"Invalid GSTIN\".", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: GSTIN format + check char"]}
- {"id": "W003", "text": "When a customer GSTIN is given, its first two digits must equal the GST code of the selected billing state, otherwise the save is rejected.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: GSTIN state code matches state"]}
- {"id": "W004", "text": "A GSTIN may belong to only one non-archived customer within a firm; a second customer with the same GSTIN is rejected, while another firm may use that GSTIN.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Entering a GSTIN already used by another customer in the firm shows that customer and offers to open it instead.", "validate: GSTIN unique per firm"]}
- {"id": "W005", "text": "Billing address needs line 1 (1 to 150 characters), city (1 to 60 characters) and a pincode of exactly 6 digits not starting with 0; line 2 is optional.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: pincode 6 digits"]}
- {"id": "W006", "text": "Customer email, if given, must be a valid address of at most 120 characters, and phone, if given, must be a 10-digit Indian mobile number starting with 6, 7, 8 or 9.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: phone 10 digits starting 6-9", "validate: email format, 120 chars"]}
- {"id": "W007", "text": "Default payment terms on a customer is a whole number of days from 0 to 90; when blank, the firm default terms apply to that customer's new invoices.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: terms 0-90 days"]}
- {"id": "W008", "text": "Editing a customer changes only drafts and future invoices; issued invoices and credit notes keep the name, address, GSTIN and state copied at the time of issue.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Moving a customer between states edits future invoices only; old invoices keep their place of supply and tax split.", "workflow: customer GSTIN changes after issue -> old invoices keep snapshot"]}
- {"id": "W009", "text": "Owner or accountant can archive a customer; archived customers leave the invoice customer picker and the default list, keep all their documents, and can be restored.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Archived records list with a status filter and a restore action that brings all data back unchanged.", "workflow: archive customer with open invoices -> still collectable", "states: customer active, archived", "move: archive/restore customer", "customer: create, edit, duplicate (skip), archive, restore, delete when empty", "customer: undo (none; archive is the undo)"]}
- {"id": "W010", "text": "Deleting a customer that has any invoice, payment or credit note is refused with a message to archive instead; a customer with none can be deleted after a confirm step.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Deleting a customer must not remove their invoices from totals; rivals do so, and here deletion is refused instead.", "exception: delete customer with documents blocked"]}
- {"id": "W011", "text": "Customer detail shows outstanding balance as the total balance due on that customer's issued and partially paid invoices, in rupees, with unused credit balance shown as a separate figure.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W012", "text": "Customer detail has tabs listing that customer's invoices, payments and credit notes, newest first, 25 rows per page.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W013", "text": "A draft invoice needs only a customer; it shows \"Draft\" instead of a number and may be saved with zero lines.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W014", "text": "Issue date defaults to today in Indian Standard Time and cannot be in the future.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: invoice date not future"]}
- {"id": "W015", "text": "Issue date cannot be earlier than the issue date of the latest issued invoice in the same number series, so numbers and dates rise together.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: backdated invoice blocked by number order", "exception: backdate before latest issued"]}
- {"id": "W016", "text": "Due date defaults to issue date plus the customer's payment terms (else the firm default) in days, and cannot be earlier than the issue date.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: due date not before issue"]}
- {"id": "W017", "text": "The financial year runs 1 April to 31 March by issue date and is labelled YY-YY, for example 26-27 for 1 April 2026 to 31 March 2027.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["The month of March belongs to the financial year ending that March; return period 03-2026 is FY 2025-26.", "rules: FY April to March, label YY-YY"]}
- {"id": "W018", "text": "Invoice number format is PREFIX/YY-YY/NNNNN, for example INV/26-27/00001, with a prefix of 1 to 4 characters and a 5-digit sequence, so no number exceeds 16 characters.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Stripe prefixes are 1 to 12 uppercase letters or numbers and unique; ours must stay within 16 characters in total.", "rules: number max 16 characters (CGST Rule 46)"]}
- {"id": "W019", "text": "An invoice number is assigned only when the invoice is issued, from a counter per firm, prefix and financial year that starts at 00001 each year and adds 1 per issue.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["data: counters per firm, prefix, FY"]}
- {"id": "W020", "text": "Invoice numbers have no gaps: deleting a draft or a failed issue attempt never uses a number, and two simultaneous issues never receive the same number.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: number unique per FY, consecutive", "exception: two users issue at once -> distinct numbers", "exception: issue fails midway -> no number consumed"]}
- {"id": "W021", "text": "An invoice needs 1 to 50 lines to be issued; issuing with zero lines is rejected.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: lines 1-50", "line: 50 line limit"]}
- {"id": "W022", "text": "A line needs a description of 1 to 200 characters, a quantity above 0 up to 999999.999 with 3 decimals, and a unit rate from 0 to 9999999.99 with 2 decimals.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: description 1-200", "validate: qty > 0, 3 decimals", "validate: rate 2 decimals"]}
- {"id": "W023", "text": "A line discount is a percentage from 0 to 100 with at most 2 decimals and is applied before tax.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: discount 0-100"]}
- {"id": "W024", "text": "When the firm has a GSTIN, every line needs an HSN or SAC code of 4, 6 or 8 digits, and the minimum digits follow the firm's turnover band (4 digits up to Rs 5 crore, 6 above).", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: HSN/SAC 4,6,8 digits"]}
- {"id": "W025", "text": "A line tax rate must be one of 0, 0.25, 3, 5, 18 or 40 percent, with 18 percent as the default for new lines.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Typing an amount on a line needs no tax typing: 18 percent and the firm's state logic apply and the live total updates on every keystroke.", "rules: allowed rates 0, 0.25, 3, 5, 18, 40", "line: tax rate, discount, HSN/SAC"]}
- {"id": "W026", "text": "Line taxable value equals quantity times rate times (1 minus discount percent divided by 100), rounded half up to 2 decimals.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Taxable value of a line excludes GST but includes incidental charges and late fee shown on the same invoice."]}
- {"id": "W027", "text": "Place of supply defaults to the customer's billing state, can be changed while the invoice is a draft, and is locked at issue.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: place of supply defaults to customer state"]}
- {"id": "W028", "text": "When place of supply equals the firm's state, each line's CGST and SGST are each taxable value times rate divided by 200, rounded half up to 2 decimals.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: intra-state = CGST + SGST half each"]}
- {"id": "W029", "text": "When place of supply differs from the firm's state, each line carries IGST equal to taxable value times rate divided by 100, rounded half up to 2 decimals, and no CGST or SGST.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: inter-state = IGST"]}
- {"id": "W030", "text": "Grand total is the sum of taxable values and taxes rounded half up to a whole rupee, and the signed round-off amount is shown on its own line.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W031", "text": "An invoice grand total above 99,99,99,999 rupees is rejected on save with a message that states the limit.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: total below 100 crore"]}
- {"id": "W032", "text": "A firm with no GST registration issues a plain document titled \"Invoice\", with no tax lines, no HSN or SAC requirement and no tax columns. \"Bill of Supply\" is used only by a registered firm on the composition scheme or for exempt supplies, and shows its GSTIN.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section31_v1.00.html", "area": "core", "also": []}
- {"id": "W033", "text": "After issue, the customer, lines, amounts, issue date and place of supply cannot be changed, and any attempt is refused with a clear error.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Rivals offer lock invoice never, when sent or when paid; here the lock is fixed at issue and the settings page states that plainly.", "exception: edit issued invoice blocked"]}
- {"id": "W034", "text": "After issue, only the due date (not before issue date), customer note and internal note can be edited, and each change is recorded in history.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W035", "text": "Invoice status is computed: issued when nothing is paid or credited, partially_paid when balance due is above 0 and below grand total, paid at 0; draft and void are set only by issue and void.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: draft -> issue -> pay -> paid", "states: invoice draft, issued, partially_paid, paid, void", "states: status computed from balance due"]}
- {"id": "W036", "text": "An issued or partially paid invoice whose due date is before today in IST is labelled overdue; overdue is a displayed label, not a stored status.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["states: overdue derived, not stored"]}
- {"id": "W037", "text": "Balance due equals grand total minus non-reversed payments and TDS, minus active credit notes and customer credit applied to this invoice, and is never below 0.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W038", "text": "Only an owner can void an invoice, and only if it has no active payment, credit note or IRN; a reason of 5 to 200 characters is required and the number stays used.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: issue with wrong data -> void (no payments) -> new invoice", "workflow: e-invoice generated -> void blocked -> credit note", "exception: void with payments blocked", "validate: reason 5-200", "invoice: undo issue (none; void or credit note)"]}
- {"id": "W039", "text": "Owner or accountant can hard-delete a draft invoice after a confirm step; an issued or void invoice can never be deleted.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["invoice: create draft, edit draft, delete draft, issue, void, duplicate"]}
- {"id": "W040", "text": "Duplicate creates a new draft with the same customer, lines, place of supply and notes, with today's date, no number and no payments.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Duplicate an invoice for the same client opens a draft at the edit screen in 1 tap, with dates updated and amounts editable.", "Duplicate copies customer, lines, notes, tags, custom fields, branch and place of supply; never copies number, dates, payments, attachments or IRN.", "workflow: duplicate invoice for repeat work"]}
- {"id": "W041", "text": "An invoice has a customer note of up to 500 characters that is printed, and an internal note of up to 1000 characters that is never printed or shared.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: notes lengths", "invoice: notes customer and internal"]}
- {"id": "W042", "text": "The invoice print page is A4 and shows firm name, address and GSTIN, number, dates, customer details, lines with HSN or SAC, tax summary per rate, round-off, grand total in Indian words and bank details.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["The tax breakup shows taxable amount per rate that equals the sum of line taxable values.", "invoice: print page A4, amount in words"]}
- {"id": "W043", "text": "Money shows with Indian digit grouping, the rupee sign and 2 decimals, for example ₹12,34,567.50, and dates show as DD-MM-YYYY everywhere in the interface and print pages.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Dates show as DD-MM-YYYY, and entering a date uses a day-month picker; typing 5/6 picks 5 June of this year, never 6 May."]}
- {"id": "W044", "text": "Owner or accountant can create a read-only share link for an issued invoice with a random token of at least 128 bits and no client name or amount in the address; it is not indexed by search engines or cached by shared proxies, expires after 30 days by default, can be revoked, and needs no login.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["The assistant sending the invoice to the wrong client can use Recall: link of that invoice is revoked in 1 tap and the owner is informed.", "Share link tokens are at least 128 bits random, never guessable by invoice number, and not listed in any URL shown by search engines (noindex and robots).", "A pay page URL contains no client name or amount in the readable path, and the page is not cacheable by shared proxies.", "data: share link: token, invoice, expiry, revoked", "states: share link active, expired, revoked", "exception: expired / revoked share link", "job: share link expiry sweep", "invoice: share link"]}
- {"id": "W045", "text": "With e-invoicing on, Generate e-invoice on an issued invoice to a customer with a GSTIN calls the e-invoice provider through one adapter and returns a 64-hex IRN; a fake adapter with modes succeed, fail and fail 1 in 5 serves tests and the sandbox.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W046", "text": "When the fake portal fails, the invoice stays issued and payable, the error code and message show on the invoice, and Retry is allowed any number of times.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: e-invoice generate -> portal fails -> retry", "exception: portal failure leaves invoice payable", "job: e-invoice retry queue (manual retry only)"]}
- {"id": "W047", "text": "Owner or accountant can mark an invoice to repeat monthly on a chosen day from 1 to 28; a daily job at 06:00 IST then creates a draft copy and never issues it.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: monthly retainer -> recurring draft", "data: recurring schedule: day, last run", "job: recurring invoice drafts daily 06:00 IST", "invoice: recurring"]}
- {"id": "W048", "text": "Owner or accountant can record a payment on an issued or partially paid invoice only; draft, paid and void invoices refuse payments with a clear message.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["exception: payment on void / draft invoice"]}
- {"id": "W049", "text": "Payment amount must be above 0 with 2 decimals, and amount plus TDS cannot exceed the invoice balance due; larger amounts are rejected with a message, because advance receipts are wave 2.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["If the client pays through the gateway and the firm also records a cash payment for the same invoice, the second one is refused when balance would go negative.", "rules: no advance payments in v1", "exception: payment above balance"]}
- {"id": "W050", "text": "Payment date cannot be in the future in IST and cannot be earlier than the invoice issue date.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: payment date between issue date and today"]}
- {"id": "W051", "text": "Payment mode must be one of cash, bank transfer, UPI, cheque, card or other.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W052", "text": "Payment reference holds up to 60 characters and is required for cheque, bank transfer and UPI payments.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: reference 60 chars"]}
- {"id": "W053", "text": "A payment may carry a TDS amount of 0 or more that counts toward settling the invoice but is not money received, and is shown separately in totals and on the receipt.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: client deducts TDS and pays net; record cash + TDS", "rules: TDS reduces cash but settles invoice", "payment: TDS"]}
- {"id": "W054", "text": "After a payment the invoice becomes partially_paid if balance due is still above 0 and paid when balance due is exactly 0.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: partial payment, then second payment"]}
- {"id": "W055", "text": "A payment matching an existing non-reversed payment on the same invoice, amount, date and reference within 24 hours is rejected unless the user explicitly confirms it.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["A duplicate payment recorded for the same invoice by two users within 60 seconds is caught and the second user sees who recorded the first.", "exception: double click on pay -> duplicate guard", "payment: duplicate guard"]}
- {"id": "W056", "text": "Each payment receives a receipt number REC/YY-YY/NNNNN from its own gapless counter per firm and financial year of the payment date.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W057", "text": "The receipt print page shows receipt number, payment date, invoice number or the invoices it settles with each allocation, customer, amount received in figures and words, TDS, mode, reference, balance after, and a note that it is not a tax document.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Receipt print shows allocations, amount in words, mode, reference, TDS, balance after and a note that it is not a tax document.", "payment: receipt print"]}
- {"id": "W058", "text": "A saved payment cannot be edited except its reference and note; a wrong amount is fixed by reversing and recording again.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["payment: record, reverse (no delete), edit reference only"]}
- {"id": "W059", "text": "Only an owner can reverse a payment with a reason of 5 to 200 characters, and the user who saved a payment can undo it within 10 seconds with no reason; the row stays listed as reversed, balance and status are recalculated, and its receipt number is never reused.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["After Save payment, an undo bar for 10 seconds reverses it without needing the owner reason text.", "Reversal reason is chosen from a list (wrong amount, bounced, duplicate, other) plus a note; reversal frees the invoice and shows on both timelines.", "Payment recorded on the invoice page shows a toast with Undo for 10 seconds; undo reverses it and keeps the receipt number as void.", "roles: owner only can void invoices, void credit notes, reverse payments", "workflow: payment recorded by mistake -> reverse and re-record", "states: payment active, reversed"]}
- {"id": "W060", "text": "A credit note can be created only from an issued, partially paid or paid invoice, stores a link to it, and an invoice may have many credit notes.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: issue with wrong data and payments -> credit note, re-invoice", "data: credit note: original invoice, reason, lines, number, dates, status", "rules: credit note linked to invoice, own series, reason", "credit note: create from invoice, draft, issue, void"]}
- {"id": "W061", "text": "A credit note needs one reason from sales return, post-sale discount, invoice correction or deficiency in service, plus an optional note of up to 300 characters; for a post-sale discount it reminds that the customer must reverse matching input tax.", "d": "now", "at": [], "why": "", "src": "https://cajournal.icai.org/article-details/gst-amendments-proposed-through-the-finance-bill-2026", "area": "core", "also": []}
- {"id": "W062", "text": "Credit note lines start as copies of the original lines; each may be lowered but never above that line's remaining creditable taxable value.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["rules: credit note cannot exceed original value", "exception: credit above remaining creditable value"]}
- {"id": "W063", "text": "Credit note tax uses each original line's rate, HSN or SAC and place of supply, giving CGST and SGST or IGST as the invoice did, with the same rounding.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W064", "text": "Credit note number format is CN/YY-YY/NNNNN from its own gapless counter per firm and financial year, assigned at issue, with the year taken from its issue date.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["credit note: history, number series"]}
- {"id": "W065", "text": "A credit note issue date cannot be before the original invoice date, in the future, or after 30 November following the end of the original invoice's financial year; if the firm records that its annual return was filed earlier, that date is the limit.", "d": "now", "at": [], "why": "", "src": "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter7/section34_v1.00.html", "area": "core", "also": ["workflow: credit note after 30 Nov deadline blocked", "rules: credit note deadline 30 Nov after FY end (Section 34)"]}
- {"id": "W066", "text": "Issuing a credit note lowers the invoice balance due, and any amount above that balance becomes the customer's credit balance.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: issue -> credit note -> reduced balance", "workflow: credit note larger than balance due -> customer credit"]}
- {"id": "W067", "text": "Owner or accountant can apply a customer's credit balance to another issued invoice of the same customer, up to the smaller of the credit balance and that invoice's balance due.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: customer credit applied to next invoice", "credit note: apply customer credit"]}
- {"id": "W068", "text": "The credit note print page is titled \"Credit Note\" and shows its number and date, the original invoice number and date, reason, lines, tax split, total, and each application to other invoices.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Credit note print shows applications (\"applied to INV/26-27/00044: 2,000.00\") and PDF is stored at issue like invoices.", "credit note: print"]}
- {"id": "W069", "text": "An issued credit note cannot be edited or deleted; only an owner can void it with a reason, restoring invoice balance, and only if none of its credit has been applied elsewhere.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["states: credit note draft, issued, void"]}
- {"id": "W070", "text": "Firm profile needs a legal name of 1 to 120 characters, address and state, with an optional GSTIN validated as for customers and starting with the firm state's code; only an owner can edit it.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["roles: owner can edit firm profile, numbering prefixes, defaults and e-invoice mode", "data: firm settings: profile, prefixes, defaults, e-invoice mode", "settings: profile, GSTIN, prefixes, defaults, e-invoice mode"]}
- {"id": "W071", "text": "Invoice and credit note prefixes are each 1 to 4 uppercase letters or digits, default INV and CN, and can change only while no document with that prefix is issued in the current financial year.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["validate: prefix 1-4 upper alphanumeric", "invoice: custom numbering prefix"]}
- {"id": "W072", "text": "Firm defaults hold payment terms of 0 to 90 days (initially 15), a default customer note up to 500 characters and bank details up to 300 characters for printing.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W073", "text": "Owner can invite a user by email with role owner, accountant, staff or viewer; one login can belong to several firms with one role in each, email is unique system-wide per login, and the invite link expires in 7 days and works only for the invited email.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["A firm invites its accountant by phone or email with a read-and-prepare role; the accountant accepts once and the firm appears in the accountant's list.", "roles: owner can invite, change role, deactivate users", "roles: one user belongs to one firm; email unique system-wide", "workflow: invite user -> set password -> login", "states: user invited, active, deactivated", "msg: outbox invite with set-password link"]}
- {"id": "W074", "text": "An owner can change a user's role, deactivate them or reactivate them, but the last active owner of a firm cannot be demoted or deactivated.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["roles: at least one active owner per firm", "exception: last owner demotion blocked", "user: invite, change role, deactivate, reactivate (deferred)"]}
- {"id": "W075", "text": "A viewer can only view, search and print; staff create and edit drafts only; an accountant can do everything except edit firm settings, manage users, void invoices or credit notes and reverse payments; forbidden actions return 403.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["A void, credit note or reversal needs the owner role and a reason; the reason text and the actor appear in history and in the owner's monthly exception list.", "Viewer can open reports but not export or schedule them; export buttons are not rendered for viewers.", "roles: accountant can create and edit customers, drafts, payments, credit notes", "roles: accountant cannot edit settings or users", "roles: viewer can view, search, print only", "roles: viewer cannot export, share, or email", "invoice: permissions"]}
- {"id": "W076", "text": "Login uses email and a password of at least 10 characters stored hashed; 5 failed attempts within 15 minutes lock the account for 15 minutes, and a session ends after 8 hours idle.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["data: user: email, password hash, role, active, failed attempts", "exception: invalid login lockout", "validate: password 10+ chars", "job: session / lockout cleanup"]}
- {"id": "W077", "text": "Every record belongs to one firm and users reach only their own firm's data; requesting another firm's record by ID, in lists, search, export or share link, returns 404, and the firm scope is enforced in the data layer with an automated test that tries one firm's token on other firms' IDs.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Request: invoicing from a company that has no e-invoice must not be blocked by another company's e-invoice rule.", "Two firms with the same customer GSTIN, phone or email never see each other's data, notes or balance; a search shows only the firm's own matches.", "Every database query is scoped by firm id by a rule enforced in the data layer, tested by an automated test that tries one firm's token on 100 other-firm IDs.", "roles: tenant isolation, other firm record returns 404", "data: firm id on every row", "exception: other firm's ID in URL"]}
- {"id": "W078", "text": "The invoice list shows number, customer, issue date, due date, total, balance due and status, 25 per page, newest issue date first, with drafts at the top.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": []}
- {"id": "W079", "text": "The invoice list filters by status (draft, issued, partially_paid, paid, void, overdue), customer and issue date range, and active filters combine with AND.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["invoice: filters status, customer, date range"]}
- {"id": "W080", "text": "Invoice search matches, case-insensitively and by substring, invoice number, customer name or customer GSTIN once at least 2 characters are typed, and combines with filters.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Every list has a sticky search box that finds a customer or invoice by typing 2 letters, with results while typing in under 1 second.", "invoice: search number, customer, GSTIN"]}
- {"id": "W081", "text": "Customer search matches name, GSTIN or phone by case-insensitive substring from 2 characters; archived customers appear only when \"Show archived\" is switched on.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["customer: search name/GSTIN/phone", "customer: filter by archived, state (state filter deferred)"]}
- {"id": "W082", "text": "Invoice list columns number, issue date, due date, grand total and balance due each sort ascending or descending, and the chosen sort stays in the page URL.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["invoice: sort date, number, total, due, balance"]}
- {"id": "W083", "text": "Owner or accountant can export the current filtered invoice list as CSV, UTF-8 with byte-order mark, ISO dates, plain 2-decimal amounts, up to 50,000 rows, with columns number, date, due, customer, GSTIN, place of supply, taxable, CGST, SGST, IGST, round-off, total, paid, TDS, credited, balance and status, and a line-level option with one row per line.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Invoice CSV export columns: number, date, due, customer, GSTIN, POS, taxable, CGST, SGST, IGST, round-off, total, paid, TDS, credited, balance, status; line-level option gives one row per line.", "move: CSV export of invoices", "invoice: CSV export", "export: invoice CSV"]}
- {"id": "W084", "text": "A GST sales register CSV for a date range has one row per invoice and credit note line with HSN or SAC, taxable value, CGST, SGST and IGST; credit note rows negative; void invoices excluded.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["GSTR-1 totals include credit notes as negatives in the B2B, B2C and nil-rated tables, and the HSN summary deducts them as well.", "move: GST sales register CSV", "export: GST register CSV"]}
- {"id": "W085", "text": "At 375 pixels wide every list, form and print preview uses one column with no sideways page scroll, and every button is at least 44 pixels tall.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["customer: phone width card layout"]}
- {"id": "W086", "text": "Emailing an issued invoice creates one outbox row with recipient, subject, body containing the share link, and status queued; draft invoices cannot be sent and the recipient email must be valid.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["data: outbox message: to, subject, body, status, reason, attempts", "msg: outbox invoice email with share link"]}
- {"id": "W087", "text": "The outbox page lists rows newest first with status queued, sent or failed; the sender job marks queued rows sent or failed from the email provider's answer within 60 seconds, test recipients ending @fail.test fail, and Retry requeues failed rows.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["workflow: email invoice -> outbox -> sent or failed -> retry", "states: outbox queued, sent, failed", "job: outbox sender, every minute", "outbox: list, status, retry, view body", "outbox: delete (none, append-only)"]}
- {"id": "W088", "text": "A daily job at 09:00 IST queues reminders 1, 7 and 15 days after due date, at most 3 per invoice, none after paid or void and none for invoices with a pause; one message per customer lists all their overdue invoices.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["A payment saved without choosing a reminder still stops pending reminders for the invoice it settles.", "workflow: overdue -> reminder at 1, 7, 15 days", "msg: outbox overdue reminder", "job: overdue reminders daily 09:00 IST", "invoice: reminders"]}
- {"id": "W089", "text": "History is append-only: each create, edit, issue, void, payment, reversal, credit note, e-invoice attempt and role change stores actor, time and old and new values, and shows on the document's page.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Each recurring profile keeps its own activity trail: who created, edited, stopped or restarted it, and when.", "Edits to allowed fields on an issued invoice keep old and new values, because buyers elsewhere ask for tamper-proof records.", "Item rate edits are recorded in history with old and new rate, who changed it and when.", "Attempt history on the invoice lists every portal call with time, result code and message, newest first.", "Entries show field-level old and new values and link to the record; entries cannot be edited or removed by anyone, including owner.", "roles: roles shown on user list; role change recorded in history", "data: history entries: actor, time, entity, old, new", "msg: history timeline on documents", "invoice: history", "payment: history", "user: history"]}
- {"id": "W090", "text": "An empty list shows a plain message and a create button only if the role may create; a failed load shows a plain error message with a Retry button instead of a blank page.", "d": "now", "at": [], "why": "", "src": "core90", "area": "core", "also": ["Report empty state says \"No data for these filters\" and offers the nearest preset; error state offers Retry.", "Customer list empty search says \"No customer matches\" and offers Create customer with the typed text prefilled.", "Invoice empty-search state says \"No invoices match\" with the active filters listed as removable chips.", "msg: empty list message with create button by role", "msg: error screen with retry", "customer: empty list screen", "invoice: empty / error screens, phone width"]}
- {"id": "W201", "text": "Owner or accountant turns the client page on for one customer by typing a password of 10 to 64 characters or pressing Make one for me (12 letters and digits, shown once); only a hash is kept, the page stays off until a password exists, and a wrong length says so in words.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W202", "text": "Send link goes by email or by WhatsApp click-to-chat with the client page link and no password in it; the password goes to the customer's email only if the firm presses Email the password, otherwise the firm tells it, and the link and the password never travel in one message.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W203", "text": "Forgot password asks for the email on file and always answers We sent a link if that email is on file, so the page never shows whether an email exists; the link works once for 60 minutes, takes a new password of 10 to 64 characters and ends every open session.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W204", "text": "Five wrong passwords within 15 minutes lock the client page for 30 minutes; the page says Too many tries, try again after the time shown or ask the firm for a new password, owners and accountants are mailed once per lock, and Set password by the firm unlocks it at once.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W205", "text": "The client page link is good for 90 days from the last send; an older link shows This link has expired with a Send me a fresh link button that mails the email on file only, and sending or resending from the customer page renews it.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W206", "text": "After a void or reversal the client page keeps the paper trail: a voided invoice stays listed as Cancelled with its replacement and no balance, a reversed payment shows Did not go through and its receipt is marked cancelled, a credit note shows against its invoice, and the statement lists each line with the running balance so the client's total equals the firm's.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W207", "text": "History records on the customer every client-page sign-in, wrong password, lock, unlock, reset, password set by the firm, turn on and off, document opened, quote accepted and declined with time, IP and device, never the password text; the customer page shows the last sign-in and the open count.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W208", "text": "The client page lists a receipt for each confirmed payment with a PDF download; a claim that waits for the firm shows Pending check and has no receipt until it is confirmed.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W209", "text": "On the client page the client ticks several open invoices, sees one total, pays it by one UPI transfer and files one I have paid claim of that amount; it waits as Pending check and the firm splits it across the invoices with the oldest-due-first default.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
- {"id": "W210", "text": "Switching the client page off, or deactivating the customer, ends every session at once and the page says This page is not available; document links already sent keep working for their own documents.", "d": "now", "at": [], "why": "", "src": "judge", "area": "portal", "also": []}
