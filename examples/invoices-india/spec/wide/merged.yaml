- {"id": "B212", "text": "A credit note's excess becomes customer credit; the owner can apply it to a later invoice of the same customer or record a manual refund that reduces it.", "d": "now", "at": [], "why": "", "src": "https://github.com/getlago/lago/issues/59", "area": "credit_notes", "also": []}
- {"id": "B215", "text": "Late interest on an overdue invoice is computed once per period and is not charged again after a partial payment.", "d": "no", "at": [], "why": "interest charging is legal advice", "src": "https://github.com/frappe/erpnext/issues/65778", "area": "payments", "also": []}
- {"id": "B218", "text": "No self-hosted edition in v1; the plan page says so and offers a full data export instead.", "d": "no", "at": [], "why": "no self-hosted edition in v1", "src": "https://github.com/invoiceninja/invoiceninja/issues/1052", "area": "self_host", "also": []}
- {"id": "B221", "text": "Invoice layout lets the firm show or hide columns, change font size and reorder blocks; reviewers call fixed layouts a limit.", "d": "later", "at": [], "why": "layout editing is a template extra", "src": "https://www.g2.com/products/vyapar/reviews_and_filters", "area": "templates", "also": []}
- {"id": "B222", "text": "Reminder email to a customer with no email address is skipped and listed on a screen for the owner to call.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/reminders.html", "area": "reminders", "also": ["A reminder for an invoice whose customer has no email is logged as skipped with the reason, and appears in a daily owner summary."]}
- {"id": "B223", "text": "Customer can opt out of reminder emails with a link; the opt-out is stored and shown on the customer.", "d": "now", "at": [], "why": "", "src": "https://www.zoho.com/in/invoice/help/settings/reminders.html", "area": "reminders", "also": ["Customer-facing emails state the firm name as sender and the firm email as reply-to; unsubscribing from reminders is a link, logged on the contact."]}
