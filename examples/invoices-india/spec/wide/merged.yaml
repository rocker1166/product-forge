- {"id": "C019", "text": "After Issue, the next screen offers Send on WhatsApp (opens WhatsApp with the customer's number and a message holding the share link), Send by email, Copy link and Download PDF, WhatsApp first.", "d": "now", "at": [], "why": "", "src": "judge", "area": "flow", "also": ["The WhatsApp button opens WhatsApp with the customer's number, a short message and the payment link filled, so the user taps only Send.", "If the customer has no phone saved, the WhatsApp button asks for it once, saves it to the customer and then opens WhatsApp."]}
