oice this customer now."}},{"id":"customer","name":"A customer","path":"/customers/:id","type":"detail","for":["owner","accountant","staff","viewer"],"from":["customers","invoice","search","credit_register"],"primary":"New invoice","shows":["customer","credit_ledger","refund"],"notes":["A Client page panel: state (Off, On, Locked, Expired), last sign-in and opens. Turn on asks for a password or Make one for me and shows it once. Send link goes by email or WhatsApp with no password in it, and Email the password sends it on its own. Set password also unlocks. Turn off ends every session."],"does":["customer.open_portal","customer.set_password","customer.send_portal_link","customer.close_portal","invoice.create","quote.create","recurring_plan.create","refund.create","refund.edit","customer.put_away","customer.bring_back","credit_ledger.apply","credit_ledger.unapply","refund.reverse_refund","credit_ledger.write_off_owed","refund.confirm_paid","refund.release_reserved"]},{"id":"items","name":"Services","path":"/services","type":"list","for":["owner","accountant","staff","viewer"],"from":["menu","invoice_form"],"primary":"New service","shows":["item"],"does":["item.edit","item.delete","item.archive","item.restore","item.duplicate","item.history","item.link_related","item.put_away","item.bring_back"],"states":{"first_use":"No saved services. Save the ones you bill often, and each invoice line fills itself.","no_match":"No service matches. Try part of the name or the SAC code."}},{"id":"payments","name":"Payments","path":"/payments","type":"list","for":["owner","accountant"],"from":["home","menu","customer"],"primary":"Record payment","shows":["payment","allocation"],"states":{"first_use":"No payments yet. When a customer pays, record it here or from the invoice.","no_match":"No payment matches these filters. Clear them or widen the dates."}},{"id":"payment_form","name":"Record a payment","path":"/payments/new","type":"form","for":["owner","accountant"],"from":["payments","invoice","customer"],"primary":"Save payment","shows":["payment","allocation"],"does":["payment.record","payment.undo_save"],"states":{"done":"Payment is saved and the invoice is updated. Send the receipt on WhatsApp, or undo within 10 seconds."}},{"id":"payment","name":"A payment","path":"/payments/:id","type":"detail","for":["owner","accountant"],"from":["payments","invoice","customer","search"],"primary":"Send receipt","shows":["payment","allocation"],"does":["message.create","payment.record","payment.confirm_claim","payment.decline_claim","payment.undo_save","payment.reverse","payment.bounce","allocation.reassign"]},{"id":"credit_register","name":"Customer credit","path":"/credit","type":"list","for":["owner","accountant","viewer"],"from":["menu","customer","credit_note"],"primary":"New refund","shows":["credit_ledger","refund"],"states":{"first_use":"No customer credit. It appears when you issue a credit note for an invoice that was paid.","no_match":"No row matches. Try the customer name or With balance."}},{"id":"outbox","name":"Sent mail and links","path":"/outbox","type":"list","for":["owner","accountant","support"],"from":["menu","invoice","support_console"],"primary":"Retry failed","shows":["message","share_link"],"does":["message.preview","message.attach","message.schedule","message.history","message.link_related","message.retry","message.lift_bounce","message.lift_complaint","message.skip","share_link.edit","share_link.preview","share_link.history","share_link.link_related","share_link.extend","share_link.renew","share_link.revoke"],"states":{"first_use":"Nothing sent yet. Every email and every link you share is listed here.","no_match":"No message matches. Try Failed, Bounced or the customer name."}},{"id":"shared_document","name":"Invoice page for the customer","path":"/d/:token","type":"public","for":["client"],"from":["link"],"primary":"Pay with UPI","notes":["Something is wrong, I deduct TDS (section and rate, changes the QR and claim amount), a receipt download after a confirmed payment, Request a fresh link on an expired page, UPI ID with Copy and an Open in browser hint inside an in-app browser, the last four digits of the account and the date the details last changed, and Replaced by on a cancelled invoice."],"does":["share_link.view","payment.create","invoice.print_pdf","share_link.report_problem","share_link.renew"]},{"id":"client_sign_in","name":"Your page from the firm","path":"/c/:token","type":"public","for":["client"],"from":["link"],"primary":"Open my page","notes":["One field, Password, and Open my page. Forgot password asks for the email on file and always answers We sent a link. After a wrong password: Wrong password, 3 tries left. After the fifth: Too many tries. Try again after 14:35 or ask the firm for a new password, with the firm's phone and email. An expired link says This link has expired with Send me a fresh link. A switched-off page and a wrong token both say This page is not available."],"does":["customer.sign_in","customer.wrong_password","customer.reset_password","customer.renew_portal"],"states":{"denied":"This page is not available. Ask the firm for a link."}},{"id":"client_page","name":"Your documents","path":"/c/:token/home","type":"public","for":["client"],"from":["client_sign_in","link"],"primary":"Pay selected","shows":["customer","invoice","quote","payment","credit_note"],"notes":["Top: the firm's name, logo, phone and email, and Sign out. Then Waiting for you (open invoices with a tick box and the total of the ticked ones, and quotes to answer), then Receipts, Credit notes, Cancelled and Statement. A cancelled invoice stays listed as Cancelled with its replacement; a payment that did not go through shows Did not go through. Pay selected opens one UPI payment of the ticked total and then I have paid for that amount; it waits as Pending check. Never drafts, internal notes or other customers."],"does":["payment.create","payment.print_pdf","invoice.print_pdf","credit_note.print_pdf","quote.print_pdf","customer.print_pdf","share_link.report_problem"],"states":{"first_use":"Nothing yet. Invoices and quotes from the firm will show here.","no_match":"No document in this period."}},{"id":"client_statement","name":"Your statement","path":"/c/:token/statement","type":"public","for":["client"],"from":["client_page"],"primary":"Download PDF","shows":["customer"],"notes":["Pick a period (this month, last month, this financial year or two dates). Shows opening balance, each invoice, payment, credit note and cancellation with a running balance, the closing balance, and the open invoices. Same figures the firm sees."],"does":["customer.print_pdf"]},{"id":"client_quote","name":"Quote from the firm","path":"/c/:token/quotes/:id","type":"public","for":["client"],"from":["client_page"],"primary":"Accept quote","shows":["quote"],"notes":["Lines, total, terms and the last day to answer. Accept quote asks for your name; Decline asks for an optional reason up to 300 letters. After an answer the page says Accepted on 3 Dec or Declined on 3 Dec and the buttons go. A passed validity date says This quote expired on 30 Nov, with the firm's contact."],"does":["quote.accept","quote.decline","quote.print_pdf"]},{"id":"time_entries","name":"Time","path":"/time","type":"list","d":"room","for":["owner","accountant","staff"],"from":["menu","customer"],"primary":"Add time","shows":["time_entry"],"notes":["MAYBE WAVE 1, owner decides before the build. Staff see only their own rows; a week view totals hours per day and customer; Approve and Bill selected sit on the list. Billed rows are locked and show the invoice number."],"does":["time_entry.approve","time_entry.unapprove","time_entry.delete","time_entry.history","time_entry.put_away","time_entry.bring_back"],"states":{"first_use":"No time logged. Add the hours you spend on a customer, then bill them on an invoice.","no_match":"No entry matches. Try another person, customer or week."}},{"id":"expenses","name":"Expenses to n","firm.preview","firm.schedule","firm.history","firm.link_related"]},{"id":"settings_tax","name":"Tax, numbers and period lock","path":"/settings/tax","type":"settings","for":["owner","accountant"],"from":["settings","month_end"],"primary":"Save","notes":["Says that opening invoices keep their old numbers and never take from the series, and that the next number can be raised only before the first document of the year."],"does":["firm.edit","number_series.create","number_series.edit","number_series.view","number_series.sort","number_series.version","number_series.preview","number_series.schedule","number_series.history","number_series.link_related","number_series.close_series","lut.create","lut.edit","lut.view","lut.sort","lut.delete","lut.duplicate","lut.version","lut.preview","lut.remind","lut.schedule","lut.history","lut.link_related","lut.withdraw"]},{"id":"templates","name":"Look of your documents","path":"/settings/templates","type":"list","for":["owner","accountant"],"from":["settings","setup_guide"],"primary":"Edit look","shows":["template"],"does":["template.edit","template.draft","template.restore","template.version","template.preview","template.assign","template.attach","template.tag","template.history","template.link_related","template.customise","template.save_version","template.reset"],"states":{"first_use":"Your invoices use the standard look. Add a logo and colour to make them yours.","no_match":"No template matches. Try Invoice, Credit note, Receipt or Email."}},{"id":"team","name":"People and roles","path":"/settings/team","type":"list","for":["owner"],"from":["settings","setup_guide"],"primary":"Invite person","shows":["membership","invite"],"does":["membership.edit","membership.archive","membership.restore","membership.assign","membership.history","membership.link_related","membership.cancel_invited","membership.reinvite","membership.change_role","membership.deactivate","membership.reactivate","membership.offer_ownership","invite.reverse","invite.schedule","invite.history","invite.link_related","invite.accept","invite.revoke","invite.resend"],"states":{"first_use":"Only you are in this firm. Invite your accountant or a colleague.","no_match":"No person matches. Try the name or the email."}},{"id":"settings_security","name":"Security, support access and closing","path":"/settings/security","type":"settings","for":["owner"],"from":["settings"],"primary":"Save","does":["firm.edit","firm.delete","firm.restore","firm.start_closing","firm.cancel_closing","firm.restore_paid"]},{"id":"settings_billing","name":"Plan and billing","path":"/settings/billing","type":"settings","for":["owner","accountant","support"],"from":["settings","home","support_console","link"],"primary":"Upgrade","does":["subscription.create","subscription.edit","subscription.view","subscription.version","subscription.reverse","subscription.preview","subscription.remind","subscription.schedule","subscription.history","subscription.link_related","subscription.upgrade","subscription.pay_again","subscription.cancel","subscription.undo_cancel","subscription.switch_to_free","subscription.refund_charge"]},{"id":"tax_tables","name":"Tax rates and codes","path":"/tax-tables","type":"list","for":["owner","accountant","staff","viewer","support"],"from":["settings","invoice_form","support_console"],"primary":"Search codes","shows":["rate_master"],"does":["rate_master.duplicate","rate_master.version","rate_master.preview","rate_master.schedule","rate_master.history","rate_master.link_related","rate_master.publish","rate_master.withdraw"],"states":{"first_use":"No rows yet. Support publishes GST rates, SAC codes and TDS sections here.","no_match":"No code matches. Try the SAC number or a word from the service."}},{"id":"account","name":"My account","path":"/account","type":"settings","for":["owner","accountant","staff","viewer"],"from":["menu"],"primary":"Save","does":["user.create","user.edit","user.view","user.archive","user.restore","user.reverse","user.history","user.link_related","user.close_account"]},{"id":"support_console","name":"Support console","path":"/support","type":"list","for":["support"],"from":["menu"],"primary":"Find a firm or user","shows":["firm","user","history_entry"],"does":["user.deactivate","user.reopen","export_job.create","user.reset_second_step"],"states":{"first_use":"No open tickets. Search a firm or a login to start.","no_match":"No firm or user matches. Check the ticket number and the owner's email."}}],"journeys":[{"id":"J01","role":"owner","moment":"first_hour","goal":"sign up and send the first real invoice from a phone in five minutes","steps":[{"screen":"sign_up","do":"user.create","sees":"Email and a password of 10 or more characters, nothing else. After Create account: Check your inbox, we sent a link.","prefilled":"Nothing to prefill. The email field opens the email keyboard.","fails":"Message at the field. An email that already has a login says Sign in instead and links to it. Wrong or lost link: Send the link again.","undo":"My account, Close account, until the first invoice is issued."},{"screen":"setup_guide","do":"firm.create","sees":"Three questions: firm name, state, GSTIN (optional). A fourth line asks the last invoice number used, so numbering carries on. Done lands on a new invoice screen, not on an empty home.","prefilled":"State fills from the first two digits of a GSTIN if one is typed. Payment terms 15 days, GST 18 percent, series INV/26-27/00001, today's date.","fails":"A GSTIN that fails the 15-character check says which part is wrong and lets the owner continue without it (plain Invoice, no tax lines).","undo":"Firm profile stays editable. After the first issue the GSTIN, state and tax scheme are frozen except the unregistered-to-registered switch."},{"screen":"invoice_form","do":"customer.create","sees":"A small sheet inside the invoice: name only. Type is business, state is the firm's state.","prefilled":"Business type, firm's state, 15 days terms, currency INR.","fails":"Message at the field. A GSTIN already used by another customer names that customer.","undo":"Customer can be edited or put away later; nothing is issued yet."},{"screen":"invoice_form","do":"invoice.issue","sees":"One line (description, quantity, rate), the tax split and total with round-off, then a preview and a check list: GSTIN, SAC, place of supply, tax split. Issue takes the number. A Practice invoice button shows the PDF with a PRACTICE watermark and takes no number.","prefilled":"Date today, due date, place of supply from the customer's state, 18 percent, SAC suggestion. Number is shown only after Issue.","fails":"A list of what is missing with a link to each field. A lost connection says Not saved, retrying, and a retry never takes a second number.","undo":"Only the owner can void it, with a reason. The number stays used."},{"screen":"invoice","do":"share_link.create","sees":"Send on WhatsApp first, then Send by email, Copy link, Download PDF. The link opens a page with the invoice and a UPI button.","prefilled":"WhatsApp message holds the firm name, amount, due date and the link. Email recipient is the customer's email.","fails":"A customer with no phone or email: Copy link and Download PDF still work, and the screen says which is missing.","undo":"Revoke the link from the invoice. The invoice itself stays."}],"budget":{"steps":5,"taps":12,"fields":9,"ref":"Stripe create and send, about 6 steps; our wide line A039 sets 12 taps on a phone","ref_steps":6,"e":["wide:A039","wide:C019"]},"done":"the customer has the link on WhatsApp, the invoice shows Sent and the setup guide ticks first customer and first invoice"},{"id":"J02","role":"owner","moment":"first_hour","goal":"finish setup so the invoice shows UPI, logo and bank details and the accountant is invited","steps":[{"screen":"setup_guide","do":"firm.edit","sees":"A checklist: firm profile, bank account, first customer, first invoice, invite accountant. Each line opens its own form and ticks when done.","prefilled":"Bank block asks account holder, account number, IFSC and UPI ID; the IFSC and UPI shapes are checked on save, nothing is sent anywhere.","fails":"Message at the field with the shape expected (IFSC is four letters, a zero, six letters or digits).","undo":"Editable any time. Before the first issue a bank or UPI change is at once; after it, it takes effect in 24 hours and any owner can cancel it from the mail (R62)."},{"screen":"templates","do":"template.customise","sees":"The standard look with a live preview. Logo (PNG or JPG, 1 MB, 2000 px), one colour, footer and terms.","prefilled":"Standard look, firm name as header, default terms.","fails":"A file too big or the wrong type says the limit; the old look stays.","undo":"Reset to the standard look. Edits apply to new documents only, so issued ones never change."},{"screen":"team","do":"invite.create","sees":"Email and role (accountant, staff, viewer or owner). One accountant seat is free.","prefilled":"Role accountant, because the checklist asked for it.","fails":"A bad email says so at the field. A person who is already in the firm is told, not invited twice.","undo":"Revoke or Send again from the same list. The link works 7 days and only for that email."}],"budget":{"steps":3,"taps":14,"fields":10,"ref":"setup checklist, wide line D301","e":["wide:D301"]},"done":"the checklist is all ticked and the next invoice prints the logo, bank details and UPI QR"},{"id":"J03","role":"owner","moment":"first_hour","goal":"bring the old customer list in from Excel without typing it again","steps":[{"screen":"customers","do":"customer.import","sees":"An Import button next to New customer opens a four-step page: file, check, confirm, result. A sample file to download.","prefilled":"Match on GSTIN, else email, else name plus pincode.","fails":"A file that is not .csv or .xlsx, or over 5 MB, says which limit it broke.","undo":"Nothing is written until the check is confirmed."},{"screen":"import_wizard","do":"i
