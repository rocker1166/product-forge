- {id: R1, area: money, rule: "Credit notes together never exceed the invoice total.", examples: [{given: "invoice 10,000, credit 6,000 then 5,000", expect: "second refused, 4,000 left"}, {given: "invoice 10,000, credit 10,000", expect: "allowed, balance 0"}], e: [stripe-002]}
- {id: R2, area: tax, rule: "Same state: CGST plus SGST. Other state: IGST.", examples: [{given: "Gujarat to Gujarat, 1,000 at 18%", expect: "CGST 90, SGST 90"}, {given: "Gujarat to Maharashtra, 1,000 at 18%", expect: "IGST 180"}], e: [ic-001]}
- {id: R3, area: law, rule: "An e-invoice may be cancelled only within 24 hours of the portal answer.", examples: [{given: "23 h 59 m later", expect: "cancel allowed"}, {given: "24 h 1 m later", expect: "credit note only"}], e: [ic-001]}
