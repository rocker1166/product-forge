# Requirements every product with screens gets, unless the PRD refuses one in words.
# Common sense (CS): in a blind test both builds failed about 12 of 40 of these because no PRD said them.
# Security (SEC): OWASP ASVS level 1 in plain words, plus what the attack passes kept finding.
# `forge baseline <spec>` copies the missing ones into spec/wide/baseline.yaml with no decision, so the check
# stays red until each is landed (now) or refused (no: why).
CS01: "Reload keeps the list's filters, search, sort and page; they live in the address."
CS02: "Back from a record returns to the same list, filters and page."
CS03: "Leaving a form with unsaved changes warns (menu link, Back, closing the tab); an untouched or saved form never warns."
CS04: "Enter submits a single-line form once; Enter in a multi-line field adds a line."
CS05: "On a failed submit, focus goes to the first wrong field, which scrolls into view, and each error is tied to its field."
CS06: "An unknown record or route shows a not-found page inside the app with a link back; the API answers 404 JSON; never a blank page or a stack trace."
CS07: "Signed out, a deep link goes to sign-in and then to that page; an outside return address is ignored."
CS08: "A disabled or removed user is signed out at their next action or reload."
CS09: "Long names and words never cause sideways scroll or break the layout, on phone and desktop."
CS10: "Every save button is busy at once and cannot be pressed twice; a slow network never makes two records."
CS11: "Each create, edit, delete and state change shows a short confirmation naming what happened."
CS12: "Number and money fields accept the local grouping and currency sign, and show them back the local way."
CS13: "Sortable columns show the direction and switch it on the second click."
CS14: "Active filters show as chips that can be removed one by one, with a Clear all."
CS15: "A failed save keeps everything typed and says what failed near the form; trying again works."
CS16: "Everything can be done by keyboard in reading order, with a visible focus outline."
CS17: "Every input has a real label, icon buttons have names, tables use header cells, and status is never shown by colour alone."
CS18: "Each page has its own title naming the page or record."
CS19: "Print pages hide the app around the document."
CS20: "Loading shows the page's shape; an error shows a Retry; an empty list says what to do first."
CS21: "No action takes more than one second without showing that it is working."
CS22: "Dates and times show in the user's time zone and format everywhere, including exports and emails."
CS23: "Lists hold 10,000 rows with paging, and stay fast with every filter."
CS24: "Undo is offered where a change can be reversed; otherwise the confirm names the consequence."
SEC01: "Every request checks the user's role and tenant on the server; hiding a button is not access control."
SEC02: "Another tenant's ids give 404 everywhere: pages, API, search, exports, files, links and counts."
SEC03: "Passwords are stored with a slow hash; sign-in failures are limited and slowed per account and per address."
SEC04: "Sessions expire when idle, end on sign-out everywhere chosen, and cookies are HttpOnly, Secure and SameSite."
SEC05: "Every input is checked on the server for type, length and range; the page check is only a help."
SEC06: "Output is escaped; users' rich text is cleaned to a safe subset; no user text runs as code."
SEC07: "Uploaded files are checked by content, limited in size, stored outside the web root and served through a checked link."
SEC08: "Shared links carry long random tokens, expire, can be revoked, and show only what they were made for."
SEC09: "Secrets live in the environment, never in code, logs, errors or the browser."
SEC10: "Logs never hold passwords, tokens, full card or bank numbers, or private message text."
SEC11: "Changes to money, bank details, roles and ownership are logged with who, when and old and new values, and the owner is told."
SEC12: "A change of payout or bank details takes effect only after a delay or a second confirmation."
SEC13: "State-changing requests are protected against cross-site forgery."
SEC14: "Rate limits on sign-in, sign-up, password reset, public pages and exports; the answer says when to retry."
SEC15: "Writes that may be retried carry an idempotency key, so a retry never doubles money or numbers."
SEC16: "Support or admin access to a customer's data needs their consent, is time-boxed, logged and visible to them."
SEC17: "Backups are encrypted, restore is tested, and deleting a customer follows the stated retention."
SEC18: "Dependencies are pinned and checked for known holes in CI."
SEC19: "Security headers set: content security policy, frame protection, no sniffing, strict transport."
SEC20: "A person can export their data and ask for deletion; what must stay by law is said before they confirm."
