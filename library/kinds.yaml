    scope: {q: "What can this role or key do, down to which actions and records?", case: "Shopify staff permissions; GitHub fine-grained tokens", src: [Shopify, GitHub]}
    expiry: {q: "When does an invite or key expire, and is expiry required?", case: "Stripe invites expire in 10 days; GitHub token expiry", src: [Stripe, GitHub]}
    last: {q: "Who is the last owner, and what stops removing them?", case: "Notion sole-admin workspace rule", src: [Notion]}
    leave: {q: "When a person is removed, what happens to their work and their keys?", case: "Notion member removal; GitHub token revoke", src: [Notion, GitHub]}
    proof: {q: "How does the person prove who they are: password, link, second step?", case: "Stripe login with two-step", src: [Stripe, GitHub]}
    layers: {q: "Which layers decide access: account, object, field, record?", case: "Salesforce four permission layers", src: [Salesforce]}
    audit: {q: "Which actions by this person or key are logged and for how long?", case: "Stripe and GitHub audit logs", src: [Stripe, GitHub]}

setting:
  name: "Setting"
  when: "Owner-defined rules and lists that shape how other things behave: plan, tax rate, category, template."
  tracks: []
  abilities:
    create: {d: now, how: "Simple form with the few fields that matter; a list entry can also be added inline.", src: [Shopify, Lago, Invoice Ninja]}
    edit: {d: now, how: "Editable, but the screen says what a change affects; past records keep what they used.", src: [Lago, Stripe, Shopify]}
    draft: {d: later, how: "Plans and templates may be drafted and published on request; most settings save at once.", src: [Lago, Stripe]}
    view: {d: now, how: "Value, where it is used, and when and by whom it last changed.", src: [Lago, Shopify, Invoice Ninja]}
    search: {d: later, how: "Only when the list passes a screen.", src: [judge]}
    filter: {d: later, how: "Active, archived and type, once lists grow.", src: [Lago, Stripe]}
    sort: {d: now, how: "Manual order where order shows to users, otherwise name.", src: [Shopify, Stripe]}
    group: {d: no, how: "Settings are short lists; grouping is a heading, not an ability.", src: [judge]}
    saved_view: {d: no, how: "Lists are short and not worth saving views for.", src: [judge]}
    columns: {d: no, how: "Fixed columns; the list is too short to need choice.", src: [judge]}
    bulk: {d: later, how: "Bulk archive or reorder on request.", src: [Shopify]}
    import: {d: later, how: "Tax rates or category trees from csv on request.", src: [Shopify, Zoho]}
    export: {d: later, how: "Config out for backup or copy between accounts on request.", src: [Salesforce, Shopify]}
    delete: {d: now, how: "Only if unused; otherwise archive, because old records still point to it.", src: [Lago, Stripe, Invoice Ninja]}
    archive: {d: now, how: "Hidden from new use, still shown on old records.", src: [Stripe, Lago, Invoice Ninja]}
    restore: {d: now, how: "Archived entry becomes usable again with the same id.", src: [Stripe, Lago]}
    duplicate: {d: now, how: "Copy a plan or template as a starting point; name must change.", src: [Shopify, Stripe, Zoho]}
    version: {d: now, how: "Money-affecting settings keep dated values so old documents compute the same.", src: [Stripe, Lago, Saleor]}
    reverse: {d: no, how: "A setting is changed forward, not reversed.", src: [judge]}
    print_pdf: {d: no, how: "Only templates have a printed form, and that belongs to the document.", src: [judge]}
    share_link: {d: no, how: "Settings are internal.", src: [judge]}
    preview: {d: now, how: "Templates and tax rules show a sample result before saving.", src: [Stripe, Invoice Ninja, Shopify]}
    assign: {d: no, how: "A setting belongs to the account, not a person.", src: [judge]}
    approve: {d: later, how: "Second-person approval for tax or price rule changes on bigger teams.", src: [Salesforce, ERPNext]}
    comment: {d: no, how: "A description field is enough.", src: [judge]}
    attach: {d: no, how: "Not a place for files; template images sit in the template itself.", src: [judge]}
    tag: {d: no, how: "Settings are structure, not things to label.", src: [judge]}
    follow: {d: no, how: "No one watches a setting.", src: [judge]}
    remind: {d: later, how: "Alert when a tax rate or contract end date nears.", src: [Zoho]}
    schedule: {d: now, how: "A new value can start on a set date; old records keep the old one.", src: [Stripe, Lago]}
    history: {d: now, how: "Who changed which setting, from what to what, and when.", src: [Salesforce, Shopify, Lago]}
    custom_fields: {d: no, how: "Settings are the structure that custom fields themselves are built from.", src: [judge]}
    merge: {d: later, how: "Join duplicate categories by moving members to one; the other is archived.", src: [Shopify, Zendesk]}
    link_related: {d: now, how: "Shows what uses it, such as customers on a plan or products in a category.", src: [Lago, Shopify]}
    notify: {d: later, how: "Alert admins on changes to sensitive settings.", src: [Salesforce, Shopify]}
    api: {d: now, how: "Read and write, so teams can keep settings in sync across accounts.", src: [Stripe, Lago, Shopify]}
    webhook: {d: later, how: "Created, updated and archived events for synced tools.", src: [Stripe, Lago]}
  questions:
    scope: {q: "Does it apply to the whole account, one site, one customer or one record?", case: "Lago per-customer plan override; billing entities", src: [Lago]}
    used: {q: "What already uses it, and what happens to those when it changes?", case: "Stripe prices are immutable once used", src: [Stripe, Lago]}
    default: {q: "Is there a default, and who can change which one it is?", case: "Shopify default tax and shipping", src: [Shopify, Invoice Ninja]}
    effective: {q: "From when does a change apply, and can it start later?", case: "Lago plan changes at next period", src: [Lago, Stripe]}
    order: {q: "Does order matter, and who can reorder?", case: "Stripe price and plan order; Shopify menu order", src: [Stripe, Shopify]}
    who: {q: "Who may see and change it?", case: "Salesforce setup permissions; Shopify staff permissions", src: [Salesforce, Shopify]}
    limit: {q: "Is there a count or value limit, and is it set per plan?", case: "Shopify variant limit 2,048; Salesforce governor limits", src: [Shopify, Salesforce]}

connection:
  name: "Connection"
  when: "A link from this product to an outside service, holding a secret and a health: payment gateway, email, calendar, accounting, webhook endpoint."
  tracks: [connection]
  abilities:
    create: {d: now, how: "Connect by sign-in screen where the service has one, or by pasting keys; test it before saving.", src: [Shopify, Stripe, Cal.com, Chatwoot]}
    edit: {d: now, how: "Change name, scope and settings; change the secret by replacing it, never by reading it back.", src: [Stripe, Shopify, Cal.com]}
    draft: {d: no, how: "It is connected, failed or disconnected; half-saved connections confuse health.", src: [judge]}
    view: {d: now, how: "Service, account name, state, last success, last error and what it is used for.", src: [Stripe, Shopify, Cal.com]}
    search: {d: later, how: "Only when many connections exist.", src: [judge]}
    filter: {d: later, how: "By service and state, when many exist.", src: [Stripe, Shopify]}
    sort: {d: no, how: "There are few; order by service name.", src: [judge]}
    group: {d: no, how: "There are few; group by service in the page layout.", src: [judge]}
    saved_view: {d: no, how: "Not worth saving for a short list.", src: [judge]}
    columns: {d: no, how: "Fixed short list.", src: [judge]}
    bulk: {d: no, how: "Each connection has its own secret and risk; none are changed in bulk.", src: [judge]}
    import: {d: no, how: "Secrets are never imported from a file.", src: [judge]}
    export: {d: no, how: "Secrets are never exported; settings may be copied without them.", src: [judge]}
    delete: {d: now, how: "Disconnect revokes at the other end where possible, and says what stops working.", src: [Stripe, Shopify, Cal.com]}
    archive: {d: no, how: "A disabled connection is the same as paused.", src: [judge]}
    restore: {d: now, how: "Reconnect the same service again, restoring the mapping and past ids.", src: [Stripe, Cal.com]}
    duplicate: {d: no, how: "A copy would share or clone a secret.", src: [judge]}
    version: {d: no, how: "Secrets rotate; there is no version to read.", src: [judge]}
    reverse: {d: no, how: "Calls made out cannot be recalled; disconnect only stops new ones.", src: [judge]}
    print_pdf: {d: no, how: "Nothing to print.", src: [judge]}
    share_link: {d: no, how: "Never shared.", src: [judge]}
    preview: {d: now, how: "Send a test event or fetch a sample, and show the result.", src: [Stripe, Cal.com]}
    assign: {d: later, how: "Owner of the connection who gets failure alerts.", src: [Salesforce]}
    approve: {d: later, how: "Admin approval before a person adds one on larger accounts.", src: [Slack, Salesforce]}
    comment: {d: no, how: "A description field is enough.", src: [judge]}
    attach: {d: no, how: "Not for files.", src: [judge]}
    tag: {d: no, how: "Few records; not needed.", src: [judge]}
    follow: {d: no, how: "Alerts go by role, not by watching.", src: [judge]}
    remind: {d: now, how: "Alert before a token expires or when sign-in is revoked at the other end.", src: [GitHub, Shopify, Cal.com]}
    schedule: {d: later, how: "Sync timing choices such as every hour or daily.", src: [Zoho, Cal.com]}
    history: {d: now, how: "Connected, tested, failed, rotated, disconnected, with who and when; calls recorded with result.", src: [Stripe, Shopify]}
    custom_fields: {d: no, how: "Setup is fixed by the service.", src: [judge]}
    merge: {d: no, how: "One connection per account per service.", src: [judge]}
    link_related: {d: now, how: "Shows what uses it and the recent calls and failures.", src: [Stripe, Shopify]}
    notify: {d: now, how: "Admin alert when it fails, expires or is revoked at the other end.", src: [Stripe, Shopify, Cal.com]}
    api: {d: now, how: "Read state and create or remove connections; secrets are write-only.", src: [Stripe, Shopify]}
    webhook: {d: now, how: "Connected, failed and disconnected events, plus the connection's own incoming and outgoing deliveries.", src: [Stripe, Shopify, Cal.com]}
  questions:
    secret: {q: "Where is the secret kept, who can see it, and can it be rotated without downtime?", case: "Stripe keys can be rolled; Shopify access scopes", src: [Stripe, Shopify]}
    scope: {q: "What may this link read and write, and is it the least needed?", case: "Shopify has 156 access scopes", src: [Shopify]}
    health: {q: "How do we know it works, and what is shown when it fails?", case: "Stripe webhook delivery log and retries", src: [Stripe]}
    direction: {q: "Does data go in, out or both, and which side wins on conflict?", case: "Cal.com calendar sync read and write", src: [Cal.com]}
    retry: {q: "When a call fails, how often and how long does it retry, and what is shown at the end?", case: "Stripe webhooks retry with backoff", src: [Stripe]}
    gone: {q: "When the outside service revokes it, what do users see and what stops?", case: "GitHub token expiry; Shopify app uninstall", src: [GitHub, Shopify]}
    limits: {q: "What rate limit and plan limit does the other side impose?", case: "Salesforce API limits per 24 hours", src: [Salesforce]}
    test: {q: "Is there a test mode or sandbox, and can it be told from live?", case: "Stripe test mode", src: [Stripe]}

job:
  name: "Job"
  when: "Work the system does in the background that takes time and ends with a result: import, export, sync run."
  tracks: [run]
  abilities:
    create: {d: now, how: "Started by a person from an import, export or sync button, or by a schedule or event.", src: [Chatwoot, Shopify, Salesforce]}
    edit: {d: no, how: "A run is a record of what happened; a new run is made instead.", src: [judge]}
    draft: {d: now, how: "Import shows a validation step with errors before it starts; the run itself has no draft.", src: [Twenty, Chatwoot, Invoice Ninja]}
    view: {d: now, how: "State, progress count, started, ended, who started it, errors, and result file or log.", src: [Chatwoot, Shopify, Salesforce]}
    search: {d: later, how: "Only when runs are many; by name or file.", src: [judge]}
    filter: {d: now, how: "By type, state, person and date; failed runs first.", src: [Chatwoot, Shopify]}
    sort: {d: now, how: "Newest first.", src: [Chatwoot, Shopify]}
    group: {d: no, how: "A flat history is enough.", src: [judge]}
    saved_view: {d: no, how: "Not worth saving.", src: [judge]}
    columns: {d: no, how: "Fixed short list.", src: [judge]}
    bulk: {d: later, how: "Cancel or retry many runs on request.", src: [Salesforce, Shopify]}
    import: {d: no, how: "A run is not imported; its file is what is imported.", src: [judge]}
    export: {d: later, how: "Run log as a csv for support.", src: [Chatwoot]}
    delete: {d: now, how: "Old run logs are cleared by age; results files expire and the screen says so.", src: [Shopify, Salesforce]}
    archive: {d: no, how: "Old runs age out instead.", src: [judge]}
    restore: {d: no, how: "Cleared logs do not come back.", src: [judge]}
    duplicate: {d: now, how: "Run again with the same settings, as a new run.", src: [Chatwoot, Salesforce]}
    version: {d: no, how: "Each run is its own record.", src: [judge]}
    reverse: {d: now, how: "Cancel while running; for an import, undo the batch where rows are traceable.", src: [Chatwoot, Shopify]}
    print_pdf: {d: no, how: "Not a document.", src: [judge]}
    share_link: {d: later, how: "Expiring link to the result file for the person who asked.", src: [Shopify]}
    preview: {d: now, how: "Import shows what will be created, changed or skipped before it starts.", src: [Twenty, Chatwoot, Invoice Ninja]}
    assign: {d: no, how: "It belongs to the person who started it.", src: [judge]}
    approve: {d: later, how: "Large exports or deletes may need a second person.", src: [Salesforce]}
    comment: {d: no, how: "A log is not a thread.", src: [judge]}
    attach: {d: now, how: "Result and rejected-rows file attached to the run.", src: [Chatwoot, Shopify, Twenty]}
    tag: {d: no, how: "Not needed.", src: [judge]}
    follow: {d: no, how: "The starter is told; others do not follow runs.", src: [judge]}
    remind: {d: no, how: "A run asks for no reminder; failures alert.", src: [judge]}
    schedule: {d: now, how: "Recurring runs with next time shown, and a pause switch.", src: [Salesforce, Zoho]}
    history: {d: now, how: "Every state, with time and row counts; rejected rows kept.", src: [Chatwoot, Shopify]}
    custom_fields: {d: no, how: "Fixed fields.", src: [judge]}
    merge: {d: no, how: "Runs are not merged.", src: [judge]}
    link_related: {d: now, how: "Shows what it touched, the file, and the connection used.", src: [Chatwoot, Salesforce]}
    notify: {d: now, how: "Starter told on finish or failure by email or in-app; large exports by email.", src: [Shopify, Chatwoot, Twenty]}
    api: {d: now, how: "Start a run, poll its state, download the result.", src: [Shopify, Salesforce, Chatwoot]}
    webhook: {d: now, how: "Finished and failed events so other tools can pick up.", src: [Shopify, Chatwoot]}
  questions:
    size: {q: "What is the biggest it can handle, and what happens beyond that?", case: "Twenty exports at most 20,000 records; Shopify emails large exports", src: [Twenty, Shopify]}
    fail: {q: "If some rows or steps fail, do others go through, and where are failures listed?", case: "Chatwoot rejected_rows; Salesforce bulk results", src: [Chatwoot, Salesforce]}
    again: {q: "Is running it twice safe, and what stops duplicates?", case: "Twenty import needs unique email; Stripe idempotency keys", src: [Twenty, Stripe]}
    progress: {q: "What shows while it runs, and can it be stopped?", case: "Chatwoot data_imports start and abandon", src: [Chatwoot]}
    who: {q: "Who may start it, and which records does it see?", case: "Twenty needs Export CSV permission", src: [Twenty]}
    result: {q: "Where is the result kept and for how long?", case: "Shopify bulk results expire in a week", src: [Shopify]}
    limit: {q: "How many may run at once?", case: "Shopify allows 5 bulk queries per app per shop", src: [Shopify]}
    timing: {q: "What if it runs while people edit the same records?", case: "Salesforce bulk and locking limits", src: [Salesforce]}

report:
  name: "Report"
  when: "A read-only view that counts, sums or lists other records over time: report, log, metric."
  tracks: []
  abilities:
    create: {d: now, how: "Pick from a catalogue of ready reports; custom ones come by saving filters and columns.", src: [Stripe, Shopify, Invoice Ninja]}
    edit: {d: now, how: "Change filters, grouping and columns of a saved report; ready ones are copied first.", src: [Salesforce, Shopify]}
    draft: {d: no, how: "A report is run or not; nothing is saved half done.", src: [judge]}
    view: {d: now, how: "Figure or table, period choice, comparison to the last period, and the rows behind each figure.", src: [Stripe, Shopify, Lago]}
    search: {d: later, how: "Search inside a long log; report list by name.", src: [Stripe, Shopify]}
    filter: {d: now, how: "Date range, and the main dimensions such as customer, product, staff.", src: [Stripe, Shopify, Invoice Ninja]}
    sort: {d: now, how: "Click column heads; default is the figure people rank by.", src: [Shopify, Invoice Ninja]}
    group: {d: now, how: "Group by day, week, month or a dimension.", src: [Shopify, Stripe, Salesforce]}
    saved_view: {d: now, how: "Save as a named report, shareable.", src: [Shopify, Salesforce, Stripe]}
    columns: {d: now, how: "Choose and order columns.", src: [Shopify, Invoice Ninja, Salesforce]}
    bulk: {d: no, how: "Nothing to change in bulk; the report only reads.", src: [judge]}
    import: {d: no, how: "A report is not imported.", src: [judge]}
    export: {d: now, how: "CSV and PDF of exactly what is on screen, with date and filters printed.", src: [Stripe, Shopify, Invoice Ninja]}
    delete: {d: now, how: "Saved custom reports can be removed; ready ones cannot.", src: [Salesforce, Shopify]}
    archive: {d: no, how: "Delete it or leave it; there is no middle state.", src: [judge]}
    restore: {d: no, how: "Saved report is re-made from filters.", src: [judge]}
    duplicate: {d: now, how: "Copy a saved report to change it.", src: [Salesforce, Shopify]}
    version: {d: no, how: "The figures change with data; old figures come back by choosing the date.", src: [judge]}
    reverse: {d: no, how: "Nothing to reverse.", src: [judge]}
    print_pdf: {d: now, how: "PDF with title, period, filters and run time on it.", src: [Stripe, Invoice Ninja, ERPNext]}
    share_link: {d: later, how: "Expiring link to a report for an outsider such as an accountant.", src: [Shopify, Stripe]}
    preview: {d: no, how: "A report on screen is already the preview.", src: [judge]}
    assign: {d: no, how: "A saved report has a creator; no one is assigned.", src: [judge]}
    approve: {d: no, how: "Nothing to approve; reports only read.", src: [judge]}
    comment: {d: no, how: "Comments belong on the record, not on the figures.", src: [judge]}
    attach: {d: no, how: "Not for files.", src: [judge]}
    tag: {d: later, how: "Folders or tags for many saved reports.", src: [Salesforce]}
    follow: {d: later, how: "Subscribe to a report by email; it is the usual form of following.", src: [Shopify, Salesforce]}
    remind: {d: later, how: "Alert when a figure crosses a line, on request.", src: [Stripe, Lago]}
    schedule: {d: now, how: "Email a report daily, weekly or monthly to chosen people.", src: [Salesforce, Shopify, Stripe]}
    history: {d: now, how: "Who ran, exported or changed a saved report; for a log, every event.", src: [Salesforce, Invoice Ninja]}
    custom_fields: {d: later, how: "Owner fields appear as columns and filters once they exist.", src: [Shopify, Salesforce]}
    merge: {d: no, how: "Reports are not merged.", src: [judge]}
    link_related: {d: now, how: "Every figure opens the rows behind it.", src: [Stripe, Shopify, Lago]}
    notify: {d: later, how: "Scheduled mail only; no other alerts.", src: [judge]}
    api: {d: now, how: "Run a report and read rows or figures through api.", src: [Stripe, Salesforce, Shopify]}
    webhook: {d: later, how: "Report-ready event for large reports run in the background.", src: [Stripe]}
  questions:
    definition: {q: "How is each figure worked out, and where is that stated on screen?", case: "Stripe and Shopify show definitions beside figures", src: [Stripe, Shopify]}
    period: {q: "What default period, which timezone, and how are boundaries counted?", case: "Shopify shop timezone; Lago billing periods", src: [Shopify, Lago]}
    fresh: {q: "How old can the data be, and is that shown?", case: "Stripe Sigma data freshness note", src: [Stripe]}
    drill: {q: "Does each figure open the rows behind it, and do those rows add up to it?", case: "Stripe report rows; Lago invoices", src: [Stripe, Lago]}
    who: {q: "Who may see which figures, such as money or other staff's work?", case: "Salesforce report folders and sharing", src: [Salesforce]}
    big: {q: "What happens when the report is huge: limit, background run, emailed file?", case: "Shopify emails exports over 50 rows", src: [Shopify]}
    money: {q: "Which currency and tax treatment do the sums use?", case: "Stripe reports by currency; Invoice Ninja tax summary", src: [Stripe, Invoice Ninja]}
    log: {q: "For logs, how long are they kept, and can they be edited?", case: "Stripe and Salesforce audit retention", src: [Stripe, Salesforce]}

