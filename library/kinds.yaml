# What a mature first release gives each kind of object. Written from outside products only (2026-11-26).
# Proof that a product lacks a thing is weak, so every `no` is marked judge. Sources listed from memory are marked in research notes.
# Library of kinds. What a mature product gives each kind of object. d: now | room | later | no.
# Abilities are the 37 ids in abilities.yaml. src names outside products; judge = my own call.

master:
  name: "Master record"
  when: "A long-lived thing other records point at: customer, product, part. Documents refer to it; it is not a transaction."
  tracks: [lifecycle]
  abilities:
    create: {d: now, how: "Form plus inline create from inside other forms, such as a new customer while making an invoice.", src: [Invoice Ninja, Stripe, Shopify]}
    edit: {d: now, how: "Always editable. Issued documents keep the values they were issued with, never the new ones.", src: [Stripe, Shopify, ERPNext]}
    draft: {d: room, how: "Product has draft status before sale. Customer and part need none; keep a status field ready.", src: [Shopify, Saleor]}
    view: {d: now, how: "Facts first, then linked documents with balance owed, then the activity timeline.", src: [Stripe, Salesforce, Twenty]}
    search: {d: now, how: "One box finds by name, email, phone, code or id; an exact id jumps to the record.", src: [Stripe, Shopify, Twenty]}
    filter: {d: now, how: "Status, tag, owner, created date and one or two business facts such as city or stock.", src: [Shopify, Twenty, Chatwoot]}
    sort: {d: now, how: "Name, newest, and the one money or quantity field people rank by.", src: [Shopify, Salesforce]}
    group: {d: later, how: "Group by owner, type or category only when a board or tree view is asked for.", src: [Twenty, Plane]}
    saved_view: {d: now, how: "Filters, columns and order kept by name, with a locked All view.", src: [Shopify, Twenty, Linear]}
    columns: {d: now, how: "People pick and order columns; the choice is kept per person.", src: [Shopify, Twenty]}
    bulk: {d: now, how: "Tag, archive, assign and delete many rows; result lists which rows failed and why.", src: [Shopify, Invoice Ninja, Twenty]}
    import: {d: now, how: "CSV with column mapping, error rows fixable in place, and a match key to avoid duplicates.", src: [Shopify, Twenty, Invoice Ninja]}
    export: {d: now, how: "CSV of the filtered list; large exports are emailed rather than downloaded.", src: [Shopify, Twenty, Invoice Ninja]}
    delete: {d: now, how: "Only when nothing refers to it; otherwise the screen says what blocks it and offers archive.", src: [Invoice Ninja, ERPNext, Shopify]}
    archive: {d: now, how: "Hidden from pickers and default lists but still on old documents and searchable.", src: [Invoice Ninja, Shopify, Plane]}
    restore: {d: now, how: "Archived or deleted record returns with its links; deleted ones keep a fixed recovery window.", src: [Invoice Ninja, Notion, Twenty]}
    duplicate: {d: now, how: "Copies fields and tags; never copies id, history, balances or linked documents.", src: [Shopify, Invoice Ninja]}
    version: {d: room, how: "Keep change history only for fields that matter later, such as price, tax id or address.", src: [Salesforce, Medusa]}
    reverse: {d: no, how: "A master has nothing to refund or cancel; mistakes are edited, or the record is merged or archived.", src: [judge]}
    print_pdf: {d: later, how: "Customer statement or product sheet only when asked; the documents already print themselves.", src: [Zoho, Invoice Ninja]}
    share_link: {d: no, how: "Outsiders see documents or a portal, never the raw master record.", src: [judge]}
    preview: {d: no, how: "There is no receiver view of a master record; previews belong to documents and content.", src: [judge]}
    assign: {d: later, how: "Customer gets one owner; product and part rarely need it.", src: [Salesforce, Twenty, Zoho]}
    approve: {d: later, how: "Only for price or credit-limit changes when a second person must sign off.", src: [Salesforce, ERPNext]}
    comment: {d: now, how: "Internal notes on the timeline, never visible to the customer.", src: [Shopify, Twenty, Salesforce]}
    attach: {d: now, how: "Contracts, tax forms or datasheets on the record, with size and type limits shown.", src: [Salesforce, Twenty, ERPNext]}
    tag: {d: now, how: "Free labels the team invents, filterable and bulk-assignable.", src: [Shopify, Stripe, Chatwoot]}
    follow: {d: later, how: "Watch a key customer without owning it; add when teams grow past a few people.", src: [Plane, Salesforce]}
    remind: {d: later, how: "Follow-up or review date with a nudge; add when the team asks for it.", src: [Salesforce, Zoho]}
    schedule: {d: no, how: "Dates belong to documents and reminders, not to the master record itself.", src: [judge]}
    history: {d: now, how: "Who changed which field, from what, to what, and when.", src: [Salesforce, Shopify, Twenty]}
    custom_fields: {d: now, how: "Owner adds their own fields per kind; they show in list, form, import and export.", src: [Shopify, Salesforce, Twenty, ERPNext]}
    merge: {d: now, how: "Two duplicates join into one; all linked records move over and the loser is kept as redirect.", src: [Shopify, Salesforce, Twenty]}
    link_related: {d: now, how: "Shows its documents, payments and tickets with totals, each one opening in place.", src: [Stripe, Salesforce, Twenty]}
    notify: {d: later, how: "Alerts to the owner on key changes; add with roles and follow.", src: [Salesforce, Chatwoot]}
    api: {d: now, how: "Read, write and search by id and by your own external reference.", src: [Stripe, Shopify, Saleor]}
    webhook: {d: now, how: "Created, updated and deleted events carry the new values and a stable event id.", src: [Stripe, Shopify, Invoice Ninja]}
  questions:
    identity: {q: "Which fact makes two records the same one, and what happens on a duplicate?", case: "Twenty import needs unique email; Shopify merges customers", src: [Twenty, Shopify]}
    snapshot: {q: "Which values are copied into a document at issue time so later edits do not rewrite it?", case: "Stripe invoices keep customer details at finalise", src: [Stripe, ERPNext]}
    remove: {q: "What blocks removal, and what takes its place when it is in use?", case: "Invoice Ninja archives rather than deleting used clients", src: [Invoice Ninja, ERPNext]}
    owner: {q: "Who owns the record, and may another person see it?", case: "Salesforce owner and sharing layers", src: [Salesforce, Twenty]}
    contacts: {q: "Can one record hold several contacts, addresses or tax ids, and which is the default?", case: "Shopify customer addresses; Stripe customer shipping and billing", src: [Shopify, Stripe]}
    code: {q: "Is there a human code or sku, who sets it, and is it unique per tenant?", case: "Shopify SKU; ERPNext item code", src: [Shopify, ERPNext]}
    inactive: {q: "What does inactive mean: hidden from pickers, blocked from new documents, or both?", case: "Shopify product archived vs draft", src: [Shopify, Saleor]}

document:
  name: "Issued document"
  when: "Something sent to an outsider that carries a number, money and a legal weight: invoice, order, quote."
  tracks: [document, payment]
  abilities:
    create: {d: now, how: "From scratch, from a quote or order with lines carried over, and by copy of an older one.", src: [Invoice Ninja, ERPNext, Stripe]}
    edit: {d: now, how: "Only while draft. After issue only note, contact and tags; money and lines lock.", src: [Stripe, ERPNext, Lago]}
    draft: {d: now, how: "Auto-saved, no number yet, invisible to the customer, deletable without a trace.", src: [Stripe, Lago, Invoice Ninja, Shopify]}
    view: {d: now, how: "Header with state and amount due, lines and tax, payments, then timeline.", src: [Stripe, Invoice Ninja, Saleor]}
    search: {d: now, how: "Number, customer name, reference, amount; an exact number jumps straight to it.", src: [Stripe, Invoice Ninja, Saleor]}
    filter: {d: now, how: "State, customer, date range, overdue, amount range, and payment status shown separately.", src: [Lago, Shopify, Saleor]}
    sort: {d: now, how: "Issue date newest first by default; also due date, amount, number.", src: [Shopify, Saleor, Invoice Ninja]}
    group: {d: later, how: "Group by customer or month only when asked; state tabs are enough at start.", src: [Shopify, Odoo]}
    saved_view: {d: now, how: "Named filters like Unpaid, Overdue, This month, kept per person or shared.", src: [Shopify, ERPNext, Stripe]}
    columns: {d: now, how: "Pick columns such as number, customer, due, balance; choice is kept.", src: [Shopify, Invoice Ninja]}
    bulk: {d: now, how: "Send, mark paid, download, archive and cancel many; failures listed row by row.", src: [Invoice Ninja, Stripe, Shopify]}
    import: {d: later, how: "Opening balances and old invoices on request; tag them imported and keep their old numbers.", src: [Invoice Ninja, Zoho]}
    export: {d: now, how: "CSV for the accountant by date range; large ranges are emailed, with tax columns.", src: [Shopify, Invoice Ninja, ERPNext]}
    delete: {d: now, how: "Only drafts. Issued documents are voided or reversed, never deleted; the number stays used.", src: [Stripe, Lago, ERPNext]}
    archive: {d: now, how: "Hides a settled or voided document from default lists without changing its state.", src: [Invoice Ninja, Shopify]}
    restore: {d: now, how: "Archived returns to lists; a deleted draft does not come back.", src: [Invoice Ninja, Stripe]}
    duplicate: {d: now, how: "Makes a new draft without number, dates, payments or sent history.", src: [Invoice Ninja, Stripe, ERPNext]}
    version: {d: room, how: "Each issue or revision stored as a frozen copy so the sent version can be reproduced.", src: [Medusa, Lago, ERPNext]}
    reverse: {d: now, how: "Credit note or return document linked to the original; the original stays untouched.", src: [Stripe, ERPNext, Lago, Saleor]}
    print_pdf: {d: now, how: "PDF that matches the sent copy exactly, with the legal fields; a template choice per tenant.", src: [Stripe, Invoice Ninja, ERPNext, Lago]}
    share_link: {d: now, how: "Hosted page with pay button; link can expire or be revoked and shows when it was viewed.", src: [Stripe, Invoice Ninja, Shopify]}
    preview: {d: now, how: "Shows the email and PDF as the customer will get them before sending.", src: [Stripe, Invoice Ninja]}
    assign: {d: later, how: "Account owner or salesperson on the document; add when teams grow.", src: [Invoice Ninja, Salesforce]}
    approve: {d: room, how: "Optional sign-off before issue above a limit; leave a state slot between draft and issued.", src: [Saleor, ERPNext, Medusa]}
    comment: {d: now, how: "Internal notes on the timeline; customer-visible notes are a separate field.", src: [Shopify, Invoice Ninja, Medusa]}
    attach: {d: now, how: "Supporting files sent with or kept beside the document, with size limit shown.", src: [Invoice Ninja, ERPNext, Shopify]}
    tag: {d: now, how: "Free labels for filtering and reports; editable even after issue.", src: [Shopify, Invoice Ninja]}
    follow: {d: later, how: "Watch a document without owning it; add with roles.", src: [Salesforce, Plane]}
    remind: {d: now, how: "Automatic reminders before and after due date, with a stop once paid.", src: [Invoice Ninja, Lago, Zoho]}
    schedule: {d: now, how: "Send later, and repeat monthly as a recurring invoice that makes drafts or issues.", src: [Invoice Ninja, Stripe, Zoho]}
    history: {d: now, how: "Created, sent, viewed, paid, voided, with who and when; cannot be edited.", src: [Invoice Ninja, Saleor, Stripe]}
    custom_fields: {d: now, how: "Own fields on header and lines that show on the PDF if chosen.", src: [Invoice Ninja, ERPNext, Shopify]}
    merge: {d: no, how: "Two issued documents are never joined; reverse one and make a new one.", src: [judge]}
    link_related: {d: now, how: "Shows the source quote or order, payments, credit notes and the customer.", src: [ERPNext, Stripe, Invoice Ninja]}
    notify: {d: now, how: "Customer email on send and on payment; staff alert on paid, failed, viewed or overdue.", src: [Stripe, Invoice Ninja, Lago]}
    api: {d: now, how: "Create draft, finalise, void, send, read PDF; writes accept an idempotency key.", src: [Stripe, Lago, Invoice Ninja]}
    webhook: {d: now, how: "Events for created, finalised, paid, failed, voided, overdue, each with a stable id.", src: [Stripe, Lago, Invoice Ninja]}
  questions:
    freeze: {q: "What is frozen after issue, and what may still change?", case: "Stripe locks money fields at finalise; ERPNext allows 21 fields after submit", src: [Stripe, ERPNext]}
    number: {q: "Who assigns the number, when, and are gaps ever allowed?", case: "Lago per-entity sequence; numbering is legal data", src: [Lago, ERPNext]}
    fix: {q: "How is a mistake corrected after issue: void, credit note or revise?", case: "Stripe credit notes; ERPNext return against original", src: [Stripe, ERPNext]}
    money: {q: "Which currency, rounding and tax rules apply, and are amounts whole minor units?", case: "Stripe integer minor units; Saleor net and gross split", src: [Stripe, Saleor, Lago]}
    paid: {q: "How does payment state relate to document state, and are they separate?", case: "Lago separates status from payment_status; Shopify financial status", src: [Lago, Shopify]}
    late: {q: "What happens when due date passes: reminder, fee, state change?", case: "Invoice Ninja reminders; Lago dunning campaigns", src: [Invoice Ninja, Lago]}
    law: {q: "Which legal fields, e-invoice or tax-portal rules apply, and what stops a cancel?", case: "India e-invoice allows cancel only within 24 hours", src: [ERPNext, Zoho]}
    send: {q: "What counts as issued: saved, emailed or opened by customer?", case: "Invoice Ninja cannot return to draft once sent", src: [Invoice Ninja, Stripe]}

work:
  name: "Work item"
  when: "Something a person must do or move forward with an owner and states: ticket, task, deal."
  tracks: [work]
  abilities:
    create: {d: now, how: "Quick add from anywhere with only a title; full form optional; email or API can also create.", src: [Linear, Plane, Chatwoot, Salesforce]}
    edit: {d: now, how: "Any field, any time, by anyone with access; every change lands in history.", src: [Linear, Plane, Salesforce]}
    draft: {d: room, how: "Keep unsent drafts locally while typing; no draft state on the item itself.", src: [Linear, Plane]}
    view: {d: now, how: "Title, state, owner, priority, description, then activity and related items.", src: [Linear, Plane, Salesforce]}
    search: {d: now, how: "Title, description, id and comments; a typed id opens the item.", src: [Linear, Plane, Chatwoot]}
    filter: {d: now, how: "State, owner, priority, label, due date, creator, and project or stage.", src: [Plane, Linear, Chatwoot, Twenty]}
    sort: {d: now, how: "Priority, updated, created, due date, manual order on boards.", src: [Plane, Linear]}
    group: {d: now, how: "List grouped or board by state, owner or priority; drag to change.", src: [Plane, Linear, Twenty, Salesforce]}
    saved_view: {d: now, how: "Named filters with layout, shareable with the team.", src: [Linear, Plane, Chatwoot, Twenty]}
    columns: {d: now, how: "Show or hide due, owner, labels, estimate, in list and table layouts.", src: [Plane, Twenty]}
    bulk: {d: now, how: "Change state, owner, label or priority on many; result says how many succeeded.", src: [Chatwoot, Plane, Linear, Twenty]}
    import: {d: now, how: "CSV or from another tracker with state and owner mapping; unknown owners are reported.", src: [Twenty, Linear, Plane, Chatwoot]}
    export: {d: now, how: "CSV or JSON of filtered items with owner and state names, not ids.", src: [Plane, Twenty, Chatwoot]}
    delete: {d: now, how: "Soft delete to trash with a recovery window; sub-items and comments follow.", src: [Plane, Linear, Twenty]}
    archive: {d: now, how: "Done items archive by hand or after N days; they remain searchable and restorable.", src: [Plane, Linear]}
    restore: {d: now, how: "Archived or deleted item returns with comments and links intact.", src: [Plane, Linear, Twenty]}
    duplicate: {d: now, how: "New item copies title, labels, project; resets state, owner, comments and dates.", src: [Linear, Plane]}
    version: {d: room, how: "Description edits keep versions so a bad edit can be recovered.", src: [Plane, Notion]}
    reverse: {d: no, how: "A work item has no money to undo; reopen it instead.", src: [judge]}
    print_pdf: {d: no, how: "Work items are read on screen; reports carry any print need.", src: [judge]}
    share_link: {d: later, how: "Public board or single-item link for customers only when requested.", src: [Plane, Linear]}
    preview: {d: no, how: "No receiver sees a different form of a work item; customer replies go through conversation.", src: [judge]}
    assign: {d: now, how: "One owner, optionally several; unassigned view and auto-assign by rule.", src: [Linear, Plane, Chatwoot, Salesforce]}
    approve: {d: later, how: "Add review or sign-off steps only for deals and changes that need them.", src: [Salesforce, Linear]}
    comment: {d: now, how: "Threaded comments with mentions; internal vs customer-visible is a deliberate choice.", src: [Linear, Plane, Chatwoot, Shopify]}
    attach: {d: now, how: "Files and images on description and comments, with size cap and preview.", src: [Linear, Plane, Chatwoot]}
    tag: {d: now, how: "Labels with colour, groupable, created on the fly by those allowed.", src: [Linear, Plane, Chatwoot]}
    follow: {d: now, how: "Subscribe without owning; subscribers get state and comment changes.", src: [Plane, Linear, Chatwoot]}
    remind: {d: now, how: "Due date with a nudge before it; snooze hides the item until a date.", src: [Chatwoot, Linear, Plane]}
    schedule: {d: later, how: "Recurring items and start dates when asked; due date covers the start.", src: [Plane, Salesforce]}
    history: {d: now, how: "Every change with who, what, from and to; cannot be edited.", src: [Plane, Linear, Salesforce, Chatwoot]}
    custom_fields: {d: now, how: "Typed owner-defined fields per project or pipeline, usable in filters.", src: [Chatwoot, Twenty, Salesforce, Plane]}
    merge: {d: later, how: "Join duplicates, keeping comments from both; common for support tickets and deals.", src: [Zendesk, Salesforce, Linear]}
    link_related: {d: now, how: "Parent, sub-items, blocks, duplicates and linked records such as customer.", src: [Plane, Linear, Salesforce]}
    notify: {d: now, how: "Owner told on assign, mention and state change; per-person mute.", src: [Linear, Plane, Chatwoot]}
    api: {d: now, how: "Full read and write on items, comments and states; filter by updated time.", src: [Linear, Plane, Chatwoot]}
    webhook: {d: now, how: "Created, updated, state-changed and comment events.", src: [Plane, Chatwoot, Linear]}
  questions:
    states: {q: "Which states exist, which are terminal, and which moves are allowed?", case: "Plane state groups; Salesforce stage drives probability", src: [Plane, Salesforce]}
    owner: {q: "Who owns it, can it be unowned, and what happens when the owner leaves?", case: "Linear triage inbox; Chatwoot auto-assign", src: [Linear, Chatwoot]}
    due: {q: "Is there a due or target date, and what happens when it passes?", case: "Chatwoot SLA; Plane target date", src: [Chatwoot, Plane]}
    priority: {q: "What priority levels exist and do they change order or alerts?", case: "Plane 5 priorities; Chatwoot priority and SLA", src: [Plane, Chatwoot]}
    close: {q: "What does closed mean, who may reopen, and does it ask for a reason?", case: "Salesforce won and lost; Plane completed vs cancelled", src: [Salesforce, Plane]}
    whom: {q: "Who is it for, and which customer record does it link to?", case: "Twenty opportunity links company and contact", src: [Twenty, Chatwoot]}
    sub: {q: "Can it have parts or children, and does closing the parent close them?", case: "Plane sub-issues; Linear sub-issues", src: [Plane, Linear]}
    intake: {q: "Where do items come from besides the form: email, widget, API, import?", case: "Chatwoot channels; Linear Asks", src: [Chatwoot, Linear]}

money:
  name: "Money movement"
  when: "A record that moves or claims money, tied to a document: payment, refund, payout."
  tracks: [payment]
  abilities:
    create: {d: now, how: "Made from the document it settles with amount prefilled to the balance due; or by gateway callback.", src: [Stripe, Invoice Ninja, ERPNext]}
    edit: {d: no, how: "Amount, currency and method never change after recording; correct by reversing and re-entering.", src: [judge]}
    draft: {d: no, how: "A payment is either recorded or not; pending is a state, not a saved draft.", src: [judge]}
    view: {d: now, how: "Amount, method, state, fees, the document it settled, and the payer.", src: [Stripe, Shopify, Invoice Ninja]}
    search: {d: now, how: "Payment id, reference, payer, amount, last four digits.", src: [Stripe, Shopify]}
    filter: {d: now, how: "State, method, date range, amount range, currency, payer, settled or unsettled.", src: [Stripe, Shopify, Lago]}
    sort: {d: now, how: "Newest first; also amount and date received.", src: [Stripe, Shopify]}
    group: {d: later, how: "Group by method or day for reconciliation when asked.", src: [Stripe, Odoo]}
    saved_view: {d: now, how: "Named filters like Failed, Disputed, This month.", src: [Stripe, Shopify]}
    columns: {d: now, how: "Pick amount, fee, net, method, payer, settled-on columns.", src: [Stripe, Shopify]}
    bulk: {d: later, how: "Bulk full refund or mark-as-reconciled; each needs a reason and a failure list.", src: [Stripe, Invoice Ninja]}
    import: {d: later, how: "Bank statement lines for matching, not payments as such.", src: [Odoo, Zoho, Invoice Ninja]}
    export: {d: now, how: "CSV with gross, fee, net, currency and payout id for the accountant.", src: [Stripe, Shopify, Invoice Ninja]}
    delete: {d: no, how: "Never deleted; a wrong payment is reversed so the audit trail survives.", src: [judge]}
    archive: {d: no, how: "Money records are never hidden; filters cover noise.", src: [judge]}
    restore: {d: no, how: "Nothing is removed, so nothing returns; a reversal is undone by a new record.", src: [judge]}
    duplicate: {d: no, how: "Copying a payment would copy money; a new payment is entered fresh.", src: [judge]}
    version: {d: no, how: "Immutable; each correction is a new linked record instead of a new version.", src: [judge]}
    reverse: {d: now, how: "Refund full or partial against the original, with reason; sum of refunds cannot pass the payment.", src: [Stripe, Shopify, Saleor, Medusa]}
    print_pdf: {d: now, how: "Receipt for the payer; official receipt number where the law asks.", src: [Stripe, Zoho, Invoice Ninja]}
    share_link: {d: later, how: "Payment link or receipt page for the payer; link can expire.", src: [Stripe, Invoice Ninja]}
    preview: {d: no, how: "There is nothing to preview; receipt email preview is a template setting.", src: [judge]}
    assign: {d: no, how: "Money records have no owner; the document or customer carries it.", src: [judge]}
    approve: {d: later, how: "Large refunds or payouts may need a second person; add on request.", src: [Shopify, Stripe]}
    comment: {d: now, how: "Internal note on the payment, such as bank reference or dispute detail.", src: [Shopify, Stripe]}
    attach: {d: later, how: "Proof of payment or dispute evidence file.", src: [Stripe, Invoice Ninja]}
    tag: {d: later, how: "Labels for reconciliation batches.", src: [Stripe, Shopify]}
    follow: {d: no, how: "Alerts are by event type, not by watching one payment.", src: [judge]}
    remind: {d: later, how: "Chase failed or pending payments through retries and dunning.", src: [Lago, Invoice Ninja, Stripe]}
    schedule: {d: now, how: "Retry failed payments on a schedule; scheduled or recurring charges belong to the plan.", src: [Stripe, Lago, Invoice Ninja]}
    history: {d: now, how: "Every state change with time and gateway message; kept forever.", src: [Stripe, Shopify]}
    custom_fields: {d: room, how: "A metadata bag for the owner's own references.", src: [Stripe, Shopify]}
    merge: {d: no, how: "Payments are never joined; each is one real money event.", src: [judge]}
    link_related: {d: now, how: "Shows the document, customer, refunds, payout and dispute together.", src: [Stripe, Shopify, Lago]}
    notify: {d: now, how: "Payer receipt; staff alert on failed, refunded, disputed.", src: [Stripe, Shopify, Lago]}
    api: {d: now, how: "Create, capture, refund and read, each write with an idempotency key.", src: [Stripe, Shopify, Saleor]}
    webhook: {d: now, how: "Succeeded, failed, refunded, disputed and payout events with stable ids.", src: [Stripe, Lago, Shopify]}
  questions:
    amount: {q: "Which currency and unit, and may amounts be partial or over the balance?", case: "Stripe integer minor units; ERPNext overpayment becomes unallocated", src: [Stripe, ERPNext]}
    settles: {q: "What does it settle, and can one payment cover several documents?", case: "ERPNext payment entry with references; Lago partial payments", src: [ERPNext, Lago]}
    undo: {q: "How is it undone, how much of it, and until when?", case: "Stripe partial refunds up to the charge; Shopify refund cannot be reversed", src: [Stripe, Shopify]}
    fail: {q: "What happens when it fails or hangs pending, and who is told?", case: "Lago retry_payment; Invoice Ninja auto-bill retries", src: [Lago, Invoice Ninja]}
    fee: {q: "Who bears fees, and are they stored beside gross and net?", case: "Stripe balance transactions", src: [Stripe]}
    dispute: {q: "What happens on a chargeback or dispute?", case: "Lago lose_dispute; Shopify chargeback filter", src: [Lago, Shopify]}
    proof: {q: "What proof does the payer get, and does the law need a numbered receipt?", case: "Zoho receipt; ERPNext payment entry", src: [Zoho, ERPNext]}
    match: {q: "How is it matched to a bank line or payout?", case: "Stripe payout reconciliation; Zoho bank feeds", src: [Stripe, Zoho]}

booking:
  name: "Booking"
  when: "A claim on a time and a resource for someone: slot, appointment, reservation."
  tracks: [booking]
  abilities:
    create: {d: now, how: "Public booking page with live availability, plus staff entry for walk-ins and phone bookings.", src: [Cal.com, Calendly]}
    edit: {d: now, how: "Staff may change notes, attendees and location; time changes go through reschedule.", src: [Cal.com]}
    draft: {d: no, how: "A slot is either held or not; unconfirmed is a state with an expiry, not a draft.", src: [judge]}
    view: {d: now, how: "When, who, what, where or link, state and payment, then actions that fit the state.", src: [Cal.com, Calendly]}
    search: {d: now, how: "Attendee name, email and booking id.", src: [Cal.com]}
    filter: {d: now, how: "Upcoming, past, cancelled, unconfirmed tabs plus service, staff, attendee and date range.", src: [Cal.com]}
